<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Agenda - Salão Janaina</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f8f5f7;
  color: #333;
}

header {
  background: linear-gradient(135deg,#8e4168,#c66d9c);
  color: white;
  padding: 25px 20px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 27px;
}

header p {
  margin: 7px 0 0;
  opacity: .9;
}

.container {
  width: 100%;
  max-width: 1000px;
  margin: 25px auto;
  padding: 0 15px;
}

.topo {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 20px;
}

.topo h2 {
  margin: 0;
  color: #713253;
}

button {
  border: 0;
  cursor: pointer;
  font-family: inherit;
}

.btn-principal {
  background: #8e4168;
  color: white;
  padding: 13px 20px;
  border-radius: 10px;
  font-size: 15px;
  font-weight: bold;
}

.btn-principal:hover {
  background: #713253;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 3px 15px rgba(0,0,0,.07);
}

.card h3 {
  margin-top: 0;
  color: #713253;
}

.filtro {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

label {
  display: block;
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 7px;
  color: #555;
}

input,
select,
textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 9px;
  font-size: 15px;
  outline: none;
  background: white;
}

input:focus,
select:focus,
textarea:focus {
  border-color: #b65f8d;
}

textarea {
  min-height: 80px;
  resize: vertical;
}

.campo {
  margin-bottom: 16px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 15px;
}


/* =====================================================
   HORÁRIOS
   ===================================================== */

.horarios {
  display: grid;
  grid-template-columns: repeat(auto-fill,minmax(95px,1fr));
  gap: 10px;
  margin-top: 10px;
}

.horario {
  padding: 12px 8px;
  border-radius: 10px;
  background: #f4e6ee;
  color: #713253;
  border: 2px solid transparent;
  font-size: 15px;
  font-weight: bold;
}

.horario:hover {
  background: #e8cadb;
}

.horario.selecionado {
  background: #8e4168;
  color: white;
  border-color: #713253;
}

.horario.ocupado {
  background: #eeeeee;
  color: #aaa;
  cursor: not-allowed;
  text-decoration: line-through;
}

.horario.informacao {
  background: #fff8fb;
  color: #8e4168;
  border: 1px dashed #d89abc;
  cursor: default;
  font-size: 13px;
  grid-column: 1 / -1;
  text-decoration: none;
}


/* =====================================================
   MENSAGENS
   ===================================================== */

.mensagem {
  padding: 12px;
  border-radius: 9px;
  margin-bottom: 15px;
  display: none;
}

.mensagem.erro {
  display: block;
  background: #ffe4e4;
  color: #a00000;
}

.mensagem.sucesso {
  display: block;
  background: #e2f7e8;
  color: #176b2d;
}

.carregando {
  text-align: center;
  color: #777;
  padding: 15px;
}

.sem-horarios {
  background: #fff4f4;
  color: #a33;
  padding: 15px;
  border-radius: 10px;
  text-align: center;
}


/* =====================================================
   AGENDA
   ===================================================== */

.agendamento {
  border: 1px solid #eee;
  border-left: 5px solid #8e4168;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 12px;
  background: #fff;
}

.agendamento-topo {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}

.agendamento strong {
  color: #713253;
}

.info {
  margin-top: 7px;
  font-size: 14px;
  color: #555;
}

.btn-cancelar {
  background: #ffe1e1;
  color: #a00000;
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: bold;
}

.btn-cancelar:hover {
  background: #ffcaca;
}


/* =====================================================
   MODAL
   ===================================================== */

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  z-index: 999;
  padding: 20px;
  overflow-y: auto;
}

.modal.ativo {
  display: flex;
  align-items: flex-start;
  justify-content: center;
}

.modal-conteudo {
  background: white;
  width: 100%;
  max-width: 650px;
  margin: 20px auto;
  border-radius: 18px;
  padding: 25px;
  box-shadow: 0 10px 40px rgba(0,0,0,.2);
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.modal-header h2 {
  margin: 0;
  color: #713253;
}

.fechar {
  width: 35px;
  height: 35px;
  border-radius: 50%;
  background: #f2e6ed;
  color: #713253;
  font-size: 20px;
}

.fechar:hover {
  background: #e5cedb;
}

.resumo {
  background: #f8f1f5;
  border-radius: 10px;
  padding: 12px;
  margin-top: 15px;
  color: #713253;
  font-size: 14px;
}

.acoes {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  margin-top: 20px;
}

.btn-secundario {
  background: #eee;
  color: #444;
  padding: 12px 18px;
  border-radius: 9px;
  font-weight: bold;
}

.btn-salvar {
  background: #8e4168;
  color: white;
  padding: 12px 20px;
  border-radius: 9px;
  font-weight: bold;
}

.btn-salvar:hover {
  background: #713253;
}

.btn-salvar:disabled {
  background: #aaa;
  cursor: not-allowed;
}

.preco {
  color: #8e4168;
  font-weight: bold;
}


/* =====================================================
   RESPONSIVO
   ===================================================== */

@media (max-width:600px) {

  .grid {
    grid-template-columns: 1fr;
  }

  .topo {
    align-items: stretch;
    flex-direction: column;
  }

  .topo .btn-principal {
    width: 100%;
  }

  .modal {
    padding: 10px;
  }

  .modal-conteudo {
    margin: 5px auto;
    padding: 18px;
  }

  .horarios {
    grid-template-columns: repeat(3,1fr);
  }

}

</style>

</head>


<body>


<header>

<h1>Salão Janaina</h1>

<p>Agenda de clientes</p>

</header>


<div class="container">


<div class="topo">

<h2>Agenda</h2>

<button
  class="btn-principal"
  onclick="abrirNovoAgendamento()">

  + Novo Agendamento

</button>

</div>


<div
  id="mensagemPrincipal"
  class="mensagem">
</div>


<div class="card">

<h3>Agendamentos do dia</h3>

<div class="filtro">

<div style="width:100%;max-width:250px">

<label for="dataAgenda">
Data
</label>

<input
  type="date"
  id="dataAgenda"
  onchange="carregarAgenda()">

</div>

</div>

</div>


<div
  id="listaAgendamentos"
  class="card">

<div class="carregando">
Carregando...
</div>

</div>


</div>



<!-- =====================================================
     MODAL NOVO AGENDAMENTO
     ===================================================== -->

<div
  id="modal"
  class="modal">

<div class="modal-conteudo">


<div class="modal-header">

<h2>Novo Agendamento</h2>

<button
  class="fechar"
  onclick="fecharModal()">

  ×

</button>

</div>


<div
  id="mensagemModal"
  class="mensagem">
</div>


<div class="campo">

<label for="cliente">
Nome da cliente *
</label>

<input
  type="text"
  id="cliente"
  placeholder="Digite o nome da cliente">

</div>


<div class="campo">

<label for="whatsapp">
WhatsApp *
</label>

<input
  type="tel"
  id="whatsapp"
  placeholder="(31) 99999-9999">

</div>


<div class="grid">


<div class="campo">

<label for="data">
Data *
</label>

<input
  type="date"
  id="data"
  onchange="atualizarHorarios()">

</div>


<div class="campo">

<label for="servico">
Serviço *
</label>

<select
  id="servico"
  onchange="atualizarHorarios()">

<option value="">
Selecione o serviço
</option>

</select>

</div>


</div>


<div class="campo">

<label>
Horários disponíveis *
</label>


<div
  id="areaHorarios"
  class="horarios">

<div class="carregando">
Selecione a data e o serviço.
</div>

</div>

</div>


<div class="campo">

<label for="observacao">
Observação
</label>

<textarea
  id="observacao"
  placeholder="Observações da cliente..."></textarea>

</div>


<div
  id="resumo"
  class="resumo"
  style="display:none">
</div>


<div class="acoes">

<button
  class="btn-secundario"
  onclick="fecharModal()">

  Cancelar

</button>


<button
  id="btnSalvar"
  class="btn-salvar"
  onclick="salvarAgendamento()">

  Agendar Cliente

</button>

</div>


</div>

</div>



<script>


/* =========================================================
   CONFIGURAÇÃO
   ========================================================= */

const API_URL =
'https://script.google.com/macros/s/AKfycbzGWzCjQsNGfPfFZuRp2Xw3TgqKQ2lslr_bT7sS2_p7YZOqhF_zwTU5KCl_jGqGYrZj/exec';


/*
 * HORÁRIO DO SALÃO
 */

const INICIO_EXPEDIENTE = 8 * 60;

const FIM_EXPEDIENTE = 18 * 60;


/*
 * IMPORTANTE
 *
 * NÃO EXISTE INTERVALO 30 MINUTOS.
 *
 * Os horários são calculados a partir
 * da duração real do serviço e dos
 * agendamentos existentes.
 *
 * Exemplo:
 *
 * Mão = 50 minutos
 *
 * Agendamento:
 *
 * 10:00 -> 10:50
 *
 * Próximo horário:
 *
 * 10:50
 *
 *
 * Mão = 40 minutos
 *
 * 10:00 -> 10:40
 *
 * Próximo horário:
 *
 * 10:40
 */


/* =========================================================
   VARIÁVEIS
   ========================================================= */

let servicos = [];

let agendamentosDoDia = [];

let horarioSelecionado = '';

let servicoSelecionado = null;


/* =========================================================
   INICIALIZAÇÃO
   ========================================================= */

document.addEventListener(
  'DOMContentLoaded',
  async function() {

    const hoje =
      obterDataHoje();


    document.getElementById(
      'dataAgenda'
    ).value = hoje;


    document.getElementById(
      'dataAgenda'
    ).min = hoje;


    document.getElementById(
      'data'
    ).min = hoje;


    await carregarServicos();

    carregarAgenda();

  }
);


/* =========================================================
   DATA HOJE
   ========================================================= */

function obterDataHoje() {

  const agora =
    new Date();


  const ano =
    agora.getFullYear();


  const mes =
    String(
      agora.getMonth() + 1
    ).padStart(2,'0');


  const dia =
    String(
      agora.getDate()
    ).padStart(2,'0');


  return (
    ano +
    '-' +
    mes +
    '-' +
    dia
  );

}


/* =========================================================
   ABRIR MODAL
   ========================================================= */

async function abrirNovoAgendamento() {

  limparFormulario();


  const dataAgenda =
    document.getElementById(
      'dataAgenda'
    ).value;


  document.getElementById(
    'data'
  ).value =
    dataAgenda ||
    obterDataHoje();


  document.getElementById(
    'modal'
  ).classList.add('ativo');


  if (
    servicos.length === 0
  ) {

    await carregarServicos();

  }


  atualizarHorarios();

}


/* =========================================================
   FECHAR
   ========================================================= */

function fecharModal() {

  document.getElementById(
    'modal'
  ).classList.remove('ativo');

}


/* =========================================================
   LIMPAR
   ========================================================= */

function limparFormulario() {

  document.getElementById(
    'cliente'
  ).value = '';


  document.getElementById(
    'whatsapp'
  ).value = '';


  document.getElementById(
    'observacao'
  ).value = '';


  document.getElementById(
    'servico'
  ).value = '';


  horarioSelecionado = '';

  servicoSelecionado = null;


  document.getElementById(
    'resumo'
  ).style.display = 'none';


  document.getElementById(
    'areaHorarios'
  ).innerHTML =
    '<div class="carregando">' +
    'Selecione a data e o serviço.' +
    '</div>';


  esconderMensagem(
    'mensagemModal'
  );

}


/* =========================================================
   CARREGAR SERVIÇOS
   ========================================================= */

async function carregarServicos() {

  try {

    const resposta =
      await fetch(
        API_URL +
        '?acao=servicos&_=' +
        Date.now(),
        {
          cache: 'no-store'
        }
      );


    if (!resposta.ok) {

      throw new Error(
        'HTTP ' +
        resposta.status
      );

    }


    const dados =
      await resposta.json();


    /*
     * Seu Code.gs retorna diretamente
     * um ARRAY ou pode retornar:
     *
     * {
     *   sucesso:true,
     *   servicos:[...]
     * }
     */

    let lista = dados;


    if (
      dados &&
      Array.isArray(
        dados.servicos
      )
    ) {

      lista =
        dados.servicos;

    }


    if (
      !Array.isArray(lista)
    ) {

      throw new Error(
        'Resposta inválida dos serviços.'
      );

    }


    servicos =
      lista
        .map(
          function(item) {

            return {

              id:
                String(
                  item.id || ''
                ),

              nome:
                String(
                  item.nome ||
                  item.servico ||
                  ''
                ),

              /*
               * AQUI está a regra principal:
               *
               * DURAÇÃO VEM DA ABA SERVICOS.
               */

              duracao:
                Number(
                  item.duracao
                ),

              preco:
                Number(
                  item.preco || 0
                )

            };

          }
        )
        .filter(
          function(item) {

            return (
              item.id &&
              item.nome &&
              Number.isFinite(
                item.duracao
              ) &&
              item.duracao > 0
            );

          }
        );


    preencherSelectServicos();


  } catch (erro) {

    console.error(
      'Erro ao carregar serviços:',
      erro
    );


    mostrarMensagem(
      'mensagemModal',
      'Erro ao carregar serviços: ' +
      erro.message,
      'erro'
    );

  }

}


/* =========================================================
   SELECT SERVIÇOS
   ========================================================= */

function preencherSelectServicos() {

  const select =
    document.getElementById(
      'servico'
    );


  select.innerHTML =
    '<option value="">' +
    'Selecione o serviço' +
    '</option>';


  servicos.forEach(
    function(servico) {

      const option =
        document.createElement(
          'option'
        );


      option.value =
        servico.id;


      let texto =
        servico.nome;


      texto +=
        ' - ' +
        servico.duracao +
        ' min';


      if (
        servico.preco > 0
      ) {

        texto +=
          ' - R$ ' +
          servico.preco
            .toFixed(2)
            .replace('.',',');

      }


      option.textContent =
        texto;


      select.appendChild(
        option
      );

    }
  );

}


/* =========================================================
   DATA / SERVIÇO ALTERADOS
   ========================================================= */

async function atualizarHorarios() {

  horarioSelecionado = '';

  servicoSelecionado = null;


  document.getElementById(
    'resumo'
  ).style.display = 'none';


  const data =
    document.getElementById(
      'data'
    ).value;


  const servicoId =
    document.getElementById(
      'servico'
    ).value;


  const area =
    document.getElementById(
      'areaHorarios'
    );


  if (!data) {

    area.innerHTML =
      '<div class="carregando">' +
      'Selecione uma data.' +
      '</div>';

    return;

  }


  if (!servicoId) {

    area.innerHTML =
      '<div class="carregando">' +
      'Selecione o serviço.' +
      '</div>';

    return;

  }


  const servico =
    servicos.find(
      function(item) {

        return String(
          item.id
        ) === String(
          servicoId
        );

      }
    );


  if (
    !servico ||
    !servico.duracao ||
    servico.duracao <= 0
  ) {

    area.innerHTML =
      '<div class="sem-horarios">' +
      'A duração deste serviço é inválida.' +
      '</div>';

    return;

  }


  servicoSelecionado =
    servico;


  area.innerHTML =
    '<div class="carregando">' +
    'Calculando horários usando ' +
    servico.duracao +
    ' minutos...' +
    '</div>';


  try {

    const agendamentos =
      await buscarAgendamentos(
        data
      );


    agendamentosDoDia =
      agendamentos;


    /*
     * NÃO usamos a função "horarios"
     * do Code.gs.
     *
     * O HTML calcula tudo usando
     * a duração real do serviço.
     */

    renderizarHorarios(
      servico,
      agendamentos
    );


  } catch (erro) {

    console.error(
      erro
    );


    area.innerHTML =
      '<div class="sem-horarios">' +
      'Erro ao carregar horários.<br><br>' +
      '<small>' +
      escapeHtml(
        erro.message
      ) +
      '</small>' +
      '</div>';

  }

}


/* =========================================================
   BUSCAR AGENDAMENTOS
   ========================================================= */

async function buscarAgendamentos(
  data
) {

  const url =
    API_URL +
    '?acao=agendamentos' +
    '&data=' +
    encodeURIComponent(data) +
    '&_=' +
    Date.now();


  const resposta =
    await fetch(
      url,
      {
        cache: 'no-store'
      }
    );


  if (!resposta.ok) {

    throw new Error(
      'HTTP ' +
      resposta.status
    );

  }


  const dados =
    await resposta.json();


  /*
   * Seu Code.gs retorna:
   *
   * [
   *   {...}
   * ]
   *
   * Mas aceitamos também:
   *
   * {
   *   agendamentos:[...]
   * }
   */

  if (
    Array.isArray(dados)
  ) {

    return dados;

  }


  if (
    dados &&
    Array.isArray(
      dados.agendamentos
    )
  ) {

    return dados.agendamentos;

  }


  throw new Error(
    'Resposta inválida dos agendamentos.'
  );

}


/* =========================================================
   RENDERIZAR HORÁRIOS
   ========================================================= */

function renderizarHorarios(
  servico,
  agendamentos
) {

  const area =
    document.getElementById(
      'areaHorarios'
    );

  const duracao =
    Number(servico.duracao);

  /*
   * Segurança
   */
  if (
    !Number.isFinite(duracao) ||
    duracao <= 0
  ) {

    area.innerHTML =
      '<div class="sem-horarios">' +
      'Duração inválida.' +
      '</div>';

    return;
  }


  /*
   * ========================================================
   * NOVA REGRA DE GERAÇÃO DOS HORÁRIOS
   * ========================================================
   *
   * Não percorremos mais minuto por minuto.
   *
   * O primeiro horário começa às 08:00.
   *
   * Se estiver livre:
   *
   * 08:00 -> 08:50
   *
   * então o próximo horário possível será:
   *
   * 08:50
   *
   * Se existir um agendamento:
   *
   * 09:20 -> 10:10
   *
   * e o horário atual não comportar o serviço,
   * pulamos diretamente para 10:10.
   */


  /*
   * Normalizamos os agendamentos,
   * transformando hora + duração em
   * início e fim em minutos.
   */

  const bloqueios =
    agendamentos
      .map(function(agendamento) {

        const inicio =
          horaParaMinutos(
            agendamento.hora
          );

        let duracaoExistente =
          Number(
            agendamento.duracao
          );


        /*
         * Se a duração não veio no
         * agendamento, tenta localizar
         * o serviço correspondente.
         */

        if (
          !Number.isFinite(
            duracaoExistente
          ) ||
          duracaoExistente <= 0
        ) {

          const servicoExistente =
            servicos.find(
              function(item) {

                return (
                  String(
                    item.nome
                  ).trim().toLowerCase() ===
                  String(
                    agendamento.servico
                  ).trim().toLowerCase()
                );

              }
            );


          if (servicoExistente) {

            duracaoExistente =
              Number(
                servicoExistente.duracao
              );

          }

        }


        if (
          inicio < 0 ||
          !Number.isFinite(
            duracaoExistente
          ) ||
          duracaoExistente <= 0
        ) {

          return null;

        }


        return {

          inicio:
            inicio,

          fim:
            inicio +
            duracaoExistente

        };

      })
      .filter(function(item) {

        return item !== null;

      })
      .sort(function(a,b) {

        return a.inicio - b.inicio;

      });


  /*
   * ========================================================
   * GERAÇÃO DOS HORÁRIOS
   * ========================================================
   */

  const horarios = [];

  let inicio =
    INICIO_EXPEDIENTE;


  while (
    inicio < FIM_EXPEDIENTE
  ) {

    const fim =
      inicio + duracao;


    /*
     * Se o serviço não couber até
     * o final do expediente,
     * encerramos a busca.
     */

    if (
      fim > FIM_EXPEDIENTE
    ) {

      break;

    }


    /*
     * Procuramos um agendamento que
     * tenha conflito com o horário.
     */

    const conflito =
      bloqueios.find(
        function(bloqueio) {

          return (
            inicio < bloqueio.fim &&
            fim > bloqueio.inicio
          );

        }
      );


    /*
     * ======================================================
     * HORÁRIO LIVRE
     * ======================================================
     */

    if (!conflito) {

      horarios.push({

        inicio:
          inicio,

        fim:
          fim,

        hora:
          minutosParaHora(
            inicio
          ),

        termino:
          minutosParaHora(
            fim
          ),

        disponivel:
          true

      });


      /*
       * IMPORTANTE:
       *
       * O próximo horário começa
       * exatamente quando este serviço
       * termina.
       *
       * Exemplo:
       *
       * Mão = 50 min
       *
       * 08:00 -> 08:50
       * 08:50 -> 09:40
       * 09:40 -> 10:30
       */

      inicio =
        fim;


      continue;

    }


    /*
     * ======================================================
     * HORÁRIO OCUPADO
     * ======================================================
     *
     * Se existe conflito, não precisamos
     * testar 08:01, 08:02, 08:03...
     *
     * Pulamos diretamente para o final
     * do agendamento que está bloqueando.
     *
     * Exemplo:
     *
     * Serviço solicitado = 50 min
     *
     * Agendamento existente:
     *
     * 09:20 -> 10:10
     *
     * Se chegamos em 09:00 e há conflito,
     * pulamos diretamente para 10:10.
     */

    inicio =
      Math.max(
        inicio + 1,
        conflito.fim
      );

  }


  /*
   * ========================================================
   * NENHUM HORÁRIO
   * ========================================================
   */

  if (
    horarios.length === 0
  ) {

    area.innerHTML =
      '<div class="sem-horarios">' +
      'Não há horários disponíveis para este serviço nesta data.' +
      '</div>';

    return;

  }


  /*
   * ========================================================
   * RENDERIZAÇÃO
   * ========================================================
   */

  area.innerHTML = '';


  /*
   * Informação da duração
   */

  const info =
    document.createElement(
      'div'
    );


  info.className =
    'horario informacao';


  info.textContent =
    'Duração do serviço: ' +
    duracao +
    ' minutos';


  area.appendChild(
    info
  );


  /*
   * Mostra somente os horários
   * realmente disponíveis.
   */

  horarios.forEach(
    function(item) {

      const botao =
        document.createElement(
          'button'
        );


      botao.type =
        'button';


      botao.textContent =
        item.hora;


      botao.className =
        'horario';


      botao.onclick =
        function() {

          selecionarHorario(
            item.hora,
            botao
          );

        };


      botao.title =
        'Início: ' +
        item.hora +
        ' | Término: ' +
        item.termino;


      area.appendChild(
        botao
      );

    }
  );

}



/* =========================================================
   DISPONIBILIDADE
   ========================================================= */

function verificarDisponibilidadeLocal(
  inicioNovo,
  fimNovo,
  agendamentos
) {

  return !agendamentos.some(
    function(agendamento) {

      const inicioExistente =
        horaParaMinutos(
          agendamento.hora
        );


      if (
        inicioExistente < 0
      ) {

        return false;

      }


      /*
       * SEMPRE usa a duração do
       * agendamento.
       */

      let duracaoExistente =
        Number(
          agendamento.duracao
        );


      /*
       * Se vier inválida,
       * tenta buscar pelo serviço.
       */

      if (
        !Number.isFinite(
          duracaoExistente
        ) ||
        duracaoExistente <= 0
      ) {

        const servico =
          servicos.find(
            function(item) {

              return (
                String(
                  item.nome
                ).trim().toLowerCase() ===
                String(
                  agendamento.servico
                ).trim().toLowerCase()
              );

            }
          );


        if (servico) {

          duracaoExistente =
            Number(
              servico.duracao
            );

        }

      }


      if (
        duracaoExistente <= 0
      ) {

        return false;

      }


      const fimExistente =
        inicioExistente +
        duracaoExistente;


      /*
       * INTERVALOS:
       *
       * Novo:
       * 10:00 -------- 10:50
       *
       * Existente:
       * 10:50 -------- 11:40
       *
       * NÃO conflita.
       *
       *
       * Novo:
       * 10:00 -------- 10:50
       *
       * Existente:
       * 10:40 -------- 11:30
       *
       * CONFLITA.
       */

      return (
        inicioNovo < fimExistente &&
        fimNovo > inicioExistente
      );

    }
  );

}


/* =========================================================
   SELECIONAR HORÁRIO
   ========================================================= */

function selecionarHorario(
  hora,
  botao
) {

  document
    .querySelectorAll(
      '#areaHorarios .horario'
    )
    .forEach(
      function(item) {

        item.classList.remove(
          'selecionado'
        );

      }
    );


  botao.classList.add(
    'selecionado'
  );


  horarioSelecionado =
    hora;


  atualizarResumo();

}


/* =========================================================
   RESUMO
   ========================================================= */

function atualizarResumo() {

  const data =
    document.getElementById(
      'data'
    ).value;


  const servicoId =
    document.getElementById(
      'servico'
    ).value;


  const resumo =
    document.getElementById(
      'resumo'
    );


  if (
    !data ||
    !servicoId ||
    !horarioSelecionado
  ) {

    resumo.style.display =
      'none';

    return;

  }


  const servico =
    servicos.find(
      function(item) {

        return String(
          item.id
        ) === String(
          servicoId
        );

      }
    );


  if (!servico) {

    resumo.style.display =
      'none';

    return;

  }


  const inicio =
    horaParaMinutos(
      horarioSelecionado
    );


  const fim =
    inicio +
    Number(
      servico.duracao
    );


  resumo.innerHTML =

    '<strong>Resumo:</strong><br>' +

    'Data: ' +
    formatarDataBR(data) +

    '<br>' +

    'Horário: ' +
    horarioSelecionado +

    '<br>' +

    'Previsão de término: ' +
    minutosParaHora(fim) +

    '<br>' +

    'Serviço: ' +
    escapeHtml(
      servico.nome
    ) +

    '<br>' +

    'Duração: ' +
    servico.duracao +
    ' minutos';


  resumo.style.display =
    'block';

}


/* =========================================================
   SALVAR
   ========================================================= */

async function salvarAgendamento() {

  const cliente =
    document.getElementById(
      'cliente'
    ).value.trim();


  const whatsapp =
    document.getElementById(
      'whatsapp'
    ).value.trim();


  const data =
    document.getElementById(
      'data'
    ).value;


  const servicoId =
    document.getElementById(
      'servico'
    ).value;


  const observacao =
    document.getElementById(
      'observacao'
    ).value.trim();


  if (!cliente) {

    mostrarMensagem(
      'mensagemModal',
      'Informe o nome da cliente.',
      'erro'
    );

    return;

  }


  if (!whatsapp) {

    mostrarMensagem(
      'mensagemModal',
      'Informe o WhatsApp.',
      'erro'
    );

    return;

  }


  if (!data) {

    mostrarMensagem(
      'mensagemModal',
      'Informe a data.',
      'erro'
    );

    return;

  }


  if (!servicoId) {

    mostrarMensagem(
      'mensagemModal',
      'Selecione o serviço.',
      'erro'
    );

    return;

  }


  if (!horarioSelecionado) {

    mostrarMensagem(
      'mensagemModal',
      'Selecione um horário.',
      'erro'
    );

    return;

  }


  const servico =
    servicos.find(
      function(item) {

        return String(
          item.id
        ) === String(
          servicoId
        );

      }
    );


  if (
    !servico ||
    !servico.duracao ||
    servico.duracao <= 0
  ) {

    mostrarMensagem(
      'mensagemModal',
      'Duração do serviço inválida.',
      'erro'
    );

    return;

  }


  /*
   * Verificação local final.
   */

  const inicioNovo =
    horaParaMinutos(
      horarioSelecionado
    );


  const fimNovo =
    inicioNovo +
    Number(
      servico.duracao
    );


  if (
    fimNovo >
    FIM_EXPEDIENTE
  ) {

    mostrarMensagem(
      'mensagemModal',
      'Este serviço termina após o horário de funcionamento.',
      'erro'
    );

    return;

  }


  /*
   * Busca novamente antes de salvar.
   */

  const btn =
    document.getElementById(
      'btnSalvar'
    );


  btn.disabled =
    true;


  btn.textContent =
    'Verificando...';


  try {

    const agendaAtual =
      await buscarAgendamentos(
        data
      );


    const conflito =
      !verificarDisponibilidadeLocal(
        inicioNovo,
        fimNovo,
        agendaAtual
      );


    if (conflito) {

      throw new Error(
        'Este horário não está mais disponível. Escolha outro.'
      );

    }


    btn.textContent =
      'Agendando...';


    /*
     * Enviamos:
     *
     * servicoId
     * servico
     * duracao
     *
     * Porém o Code.gs deve usar
     * a coluna Duração da aba Servicos
     * como fonte oficial.
     */

    const dados = {

      acao:
        'agendar',

      cliente:
        cliente,

      whatsapp:
        whatsapp,

      data:
        data,

      hora:
        horarioSelecionado,

      servico:
        servico.nome,

      servicoId:
        servico.id,

      duracao:
        Number(
          servico.duracao
        ),

      observacao:
        observacao

    };


    const resposta =
      await fetch(
        API_URL,
        {

          method:
            'POST',

          headers: {

            'Content-Type':
              'text/plain;charset=utf-8'

          },

          body:
            JSON.stringify(
              dados
            )

        }
      );


    if (!resposta.ok) {

      throw new Error(
        'HTTP ' +
        resposta.status
      );

    }


    const resultado =
      await resposta.json();


    if (
      !resultado.sucesso
    ) {

      throw new Error(
        resultado.erro ||
        'Não foi possível realizar o agendamento.'
      );

    }


    mostrarMensagem(
      'mensagemPrincipal',
      'Agendamento realizado com sucesso.',
      'sucesso'
    );


    fecharModal();


    document.getElementById(
      'dataAgenda'
    ).value =
      data;


    carregarAgenda();


  } catch (erro) {

    console.error(
      'Erro ao salvar:',
      erro
    );


    mostrarMensagem(
      'mensagemModal',
      erro.message ||
      'Erro ao realizar agendamento.',
      'erro'
    );


  } finally {

    btn.disabled =
      false;


    btn.textContent =
      'Agendar Cliente';

  }

}


/* =========================================================
   CARREGAR AGENDA
   ========================================================= */

async function carregarAgenda() {

  const data =
    document.getElementById(
      'dataAgenda'
    ).value;


  const area =
    document.getElementById(
      'listaAgendamentos'
    );


  if (!data) {

    area.innerHTML =
      '<div class="carregando">' +
      'Selecione uma data.' +
      '</div>';

    return;

  }


  area.innerHTML =
    '<div class="carregando">' +
    'Carregando agendamentos...' +
    '</div>';


  try {

    const dados =
      await buscarAgendamentos(
        data
      );


    renderizarAgenda(
      dados
    );


  } catch (erro) {

    console.error(
      'Erro agenda:',
      erro
    );


    area.innerHTML =
      '<div class="sem-horarios">' +
      'Erro ao carregar a agenda.<br><br>' +
      '<small>' +
      escapeHtml(
        erro.message
      ) +
      '</small>' +
      '</div>';

  }

}


/* =========================================================
   RENDERIZAR AGENDA
   ========================================================= */

function renderizarAgenda(
  agendamentos
) {

  const area =
    document.getElementById(
      'listaAgendamentos'
    );


  if (
    !agendamentos ||
    agendamentos.length === 0
  ) {

    area.innerHTML =
      '<h3>Agendamentos do dia</h3>' +

      '<div class="carregando">' +
      'Nenhum agendamento para esta data.' +
      '</div>';

    return;

  }


  agendamentos.sort(
    function(a,b) {

      return (
        horaParaMinutos(a.hora) -
        horaParaMinutos(b.hora)
      );

    }
  );


  let html =
    '<h3>Agendamentos do dia</h3>';


  agendamentos.forEach(
    function(item) {

      const inicio =
        horaParaMinutos(
          item.hora
        );


      const duracao =
        Number(
          item.duracao || 0
        );


      const fim =
        inicio +
        duracao;


      html +=

        '<div class="agendamento">' +

        '<div class="agendamento-topo">' +

        '<div>' +

        '<strong>' +

        escapeHtml(
          item.hora
        ) +

        ' - ' +

        escapeHtml(
          item.cliente
        ) +

        '</strong>' +

        '</div>' +


        '<button ' +

        'class="btn-cancelar" ' +

        'onclick="cancelarAgendamento(\'' +

        escapeHtmlJS(
          item.id
        ) +

        '\')">' +

        'Cancelar' +

        '</button>' +

        '</div>' +


        '<div class="info">' +

        '<strong>Serviço:</strong> ' +

        escapeHtml(
          item.servico
        ) +

        ' (' +

        duracao +

        ' min)' +

        '</div>' +


        '<div class="info">' +

        '<strong>Horário:</strong> ' +

        escapeHtml(
          item.hora
        ) +

        ' até ' +

        minutosParaHora(
          fim
        ) +

        '</div>' +


        '<div class="info">' +

        '<strong>WhatsApp:</strong> ' +

        escapeHtml(
          item.whatsapp
        ) +

        '</div>' +


        (
          item.observacao
            ?

            '<div class="info">' +

            '<strong>Observação:</strong> ' +

            escapeHtml(
              item.observacao
            ) +

            '</div>'

            :

            ''
        ) +


        '</div>';

    }
  );


  area.innerHTML =
    html;

}


/* =========================================================
   CANCELAR
   ========================================================= */

async function cancelarAgendamento(
  id
) {

  if (
    !confirm(
      'Deseja realmente cancelar este agendamento?'
    )
  ) {

    return;

  }


  try {

    const resposta =
      await fetch(
        API_URL,
        {

          method:
            'POST',

          headers: {

            'Content-Type':
              'text/plain;charset=utf-8'

          },

          body:
            JSON.stringify({

              acao:
                'cancelar',

              id:
                id

            })

        }
      );


    if (!resposta.ok) {

      throw new Error(
        'HTTP ' +
        resposta.status
      );

    }


    const resultado =
      await resposta.json();


    if (
      !resultado.sucesso
    ) {

      throw new Error(
        resultado.erro ||
        'Erro ao cancelar.'
      );

    }


    mostrarMensagem(
      'mensagemPrincipal',
      'Agendamento cancelado com sucesso.',
      'sucesso'
    );


    carregarAgenda();


  } catch (erro) {

    console.error(
      erro
    );


    mostrarMensagem(
      'mensagemPrincipal',
      erro.message,
      'erro'
    );

  }

}


/* =========================================================
   HORA -> MINUTOS
   ========================================================= */

function horaParaMinutos(
  hora
) {

  if (!hora) {
    return -1;
  }


  const partes =
    String(
      hora
    ).split(':');


  if (
    partes.length < 2
  ) {

    return -1;

  }


  const horas =
    Number(
      partes[0]
    );


  const minutos =
    Number(
      partes[1]
    );


  if (
    !Number.isFinite(horas) ||
    !Number.isFinite(minutos)
  ) {

    return -1;

  }


  return (
    horas * 60 +
    minutos
  );

}


/* =========================================================
   MINUTOS -> HORA
   ========================================================= */

function minutosParaHora(
  minutos
) {

  const valor =
    Number(
      minutos
    );


  if (
    !Number.isFinite(valor)
  ) {

    return '';

  }


  const horas =
    Math.floor(
      valor / 60
    );


  const mins =
    valor % 60;


  return (
    String(
      horas
    ).padStart(2,'0') +
    ':' +
    String(
      mins
    ).padStart(2,'0')
  );

}


/* =========================================================
   DATA BR
   ========================================================= */

function formatarDataBR(
  data
) {

  const partes =
    String(
      data
    ).split('-');


  if (
    partes.length !== 3
  ) {

    return data;

  }


  return (
    partes[2] +
    '/' +
    partes[1] +
    '/' +
    partes[0]
  );

}


/* =========================================================
   MENSAGEM
   ========================================================= */

function mostrarMensagem(
  id,
  texto,
  tipo
) {

  const elemento =
    document.getElementById(
      id
    );


  if (!elemento) {
    return;
  }


  elemento.textContent =
    texto;


  elemento.className =
    'mensagem ' +
    tipo;


  setTimeout(
    function() {

      esconderMensagem(
        id
      );

    },
    5000
  );

}


/* =========================================================
   ESCONDER MENSAGEM
   ========================================================= */

function esconderMensagem(
  id
) {

  const elemento =
    document.getElementById(
      id
    );


  if (!elemento) {
    return;
  }


  elemento.className =
    'mensagem';


  elemento.textContent =
    '';

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(
  texto
) {

  return String(
    texto || ''
  )

  .replace(
    /&/g,
    '&amp;'
  )

  .replace(
    /</g,
    '&lt;'
  )

  .replace(
    />/g,
    '&gt;'
  )

  .replace(
    /"/g,
    '&quot;'
  )

  .replace(
    /'/g,
    '&#039;'
  );

}


/* =========================================================
   ESCAPE JS
   ========================================================= */

function escapeHtmlJS(
  texto
) {

  return String(
    texto || ''
  )

  .replace(
    /\\/g,
    '\\\\'
  )

  .replace(
    /'/g,
    "\\'"
  )

  .replace(
    /"/g,
    '\\"'
  );

}


/* =========================================================
   FECHAR CLICANDO FORA
   ========================================================= */

document
  .getElementById(
    'modal'
  )
  .addEventListener(
    'click',
    function(event) {

      if (
        event.target === this
      ) {

        fecharModal();

      }

    }
  );


</script>
