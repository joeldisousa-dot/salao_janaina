<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Agenda - Salão Janaina</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      background: #f8f5f7;
      color: #333;
    }

    header {
      background:
        linear-gradient(
          135deg,
          #8e4168,
          #c66d9c
        );

      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 27px;
    }

    header p {
      margin: 7px 0 0;
      opacity: .9;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .topo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .topo h2 {
      margin: 0;
      color: #713253;
    }

    button {
      border: 0;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-principal {
      background: #8e4168;
      color: white;
      padding: 13px 20px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
    }

    .btn-principal:hover {
      background: #713253;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;

      box-shadow:
        0 3px 15px
        rgba(0,0,0,.07);
    }

    .card h3 {
      margin-top: 0;
      color: #713253;
    }

    .filtro {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 7px;
      color: #555;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
      background: white;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #b65f8d;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    .campo {
      margin-bottom: 16px;
    }

    .grid {
      display: grid;
      grid-template-columns:
        repeat(2, 1fr);
      gap: 15px;
    }

    .horarios {
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(90px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .horario {
      padding: 12px 8px;
      border-radius: 10px;

      background: #f4e6ee;
      color: #713253;

      border: 2px solid
        transparent;

      font-size: 15px;
      font-weight: bold;
    }

    .horario:hover {
      background: #e8cadb;
    }

    .horario.selecionado {
      background: #8e4168;
      color: white;
      border-color: #713253;
    }

    .horario.ocupado {
      background: #eee;
      color: #aaa;
      cursor: not-allowed;
      text-decoration: line-through;
    }

    .mensagem {
      padding: 12px;
      border-radius: 9px;
      margin-bottom: 15px;
      display: none;
    }

    .mensagem.erro {
      display: block;
      background: #ffe4e4;
      color: #a00000;
    }

    .mensagem.sucesso {
      display: block;
      background: #e2f7e8;
      color: #176b2d;
    }

    .carregando {
      text-align: center;
      color: #777;
      padding: 15px;
    }

    .sem-horarios {
      background: #fff4f4;
      color: #a33;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
    }

    .agendamento {
      border: 1px solid #eee;
      border-left: 5px solid #8e4168;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 12px;
      background: #fff;
    }

    .agendamento-topo {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .agendamento strong {
      color: #713253;
    }

    .info {
      margin-top: 7px;
      font-size: 14px;
      color: #555;
    }

    .btn-cancelar {
      background: #ffe1e1;
      color: #a00000;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
    }

    .btn-cancelar:hover {
      background: #ffcaca;
    }

    .modal {
      display: none;

      position: fixed;
      inset: 0;

      background:
        rgba(0,0,0,.55);

      z-index: 999;

      padding: 20px;

      overflow-y: auto;
    }

    .modal.ativo {
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    .modal-conteudo {
      background: white;
      width: 100%;
      max-width: 650px;

      margin: 20px auto;

      border-radius: 18px;
      padding: 25px;

      box-shadow:
        0 10px 40px
        rgba(0,0,0,.2);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h2 {
      margin: 0;
      color: #713253;
    }

    .fechar {
      width: 35px;
      height: 35px;
      border-radius: 50%;

      background: #f2e6ed;
      color: #713253;

      font-size: 20px;
    }

    .fechar:hover {
      background: #e5cedb;
    }

    .resumo {
      background: #f8f1f5;
      border-radius: 10px;
      padding: 12px;
      margin-top: 15px;
      color: #713253;
      font-size: 14px;
    }

    .acoes {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 20px;
    }

    .btn-secundario {
      background: #eee;
      color: #444;
      padding: 12px 18px;
      border-radius: 9px;
      font-weight: bold;
    }

    .btn-salvar {
      background: #8e4168;
      color: white;
      padding: 12px 20px;
      border-radius: 9px;
      font-weight: bold;
    }

    .btn-salvar:hover {
      background: #713253;
    }

    .btn-salvar:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .preco {
      color: #8e4168;
      font-weight: bold;
    }

    @media (max-width: 600px) {

      .grid {
        grid-template-columns: 1fr;
      }

      .topo {
        align-items: stretch;
        flex-direction: column;
      }

      .topo .btn-principal {
        width: 100%;
      }

      .modal {
        padding: 10px;
      }

      .modal-conteudo {
        margin: 5px auto;
        padding: 18px;
      }

      .horarios {
        grid-template-columns:
          repeat(3, 1fr);
      }

    }

  </style>
</head>

<body>

<header>

  <h1>Salão Janaina</h1>

  <p>
    Agenda de clientes
  </p>

</header>


<div class="container">

  <div class="topo">

    <h2>Agenda</h2>

    <button
      class="btn-principal"
      onclick="abrirNovoAgendamento()"
    >
      + Novo Agendamento
    </button>

  </div>


  <div
    id="mensagemPrincipal"
    class="mensagem"
  ></div>


  <div class="card">

    <h3>Agendamentos do dia</h3>

    <div class="filtro">

      <div style="width:100%;max-width:250px">

        <label for="dataAgenda">
          Data
        </label>

        <input
          type="date"
          id="dataAgenda"
          onchange="carregarAgenda()"
        >

      </div>

    </div>

  </div>


  <div
    id="listaAgendamentos"
    class="card"
  >

    <div class="carregando">
      Carregando...
    </div>

  </div>

</div>


<!-- =========================================================
     MODAL NOVO AGENDAMENTO
========================================================= -->

<div
  id="modal"
  class="modal"
>

  <div class="modal-conteudo">

    <div class="modal-header">

      <h2>
        Novo Agendamento
      </h2>

      <button
        class="fechar"
        onclick="fecharModal()"
      >
        ×
      </button>

    </div>


    <div
      id="mensagemModal"
      class="mensagem"
    ></div>


    <div class="campo">

      <label for="cliente">
        Nome da cliente *
      </label>

      <input
        type="text"
        id="cliente"
        placeholder="Digite o nome da cliente"
      >

    </div>


    <div class="campo">

      <label for="whatsapp">
        WhatsApp *
      </label>

      <input
        type="tel"
        id="whatsapp"
        placeholder="(31) 99999-9999"
      >

    </div>


    <div class="grid">

      <div class="campo">

        <label for="data">
          Data *
        </label>

        <input
          type="date"
          id="data"
          onchange="dataAlterada()"
        >

      </div>


      <div class="campo">

        <label for="servico">
          Serviço *
        </label>

        <select
          id="servico"
          onchange="servicoAlterado()"
        >

          <option value="">
            Selecione o serviço
          </option>

        </select>

      </div>

    </div>


    <div class="campo">

      <label>
        Horário *
      </label>

      <div
        id="areaHorarios"
        class="horarios"
      >

        <div class="carregando">
          Selecione uma data.
        </div>

      </div>

    </div>


    <div class="campo">

      <label for="observacao">
        Observação
      </label>

      <textarea
        id="observacao"
        placeholder="Observações da cliente..."
      ></textarea>

    </div>


    <div
      id="resumo"
      class="resumo"
      style="display:none"
    ></div>


    <div class="acoes">

      <button
        class="btn-secundario"
        onclick="fecharModal()"
      >
        Cancelar
      </button>

      <button
        id="btnSalvar"
        class="btn-salvar"
        onclick="salvarAgendamento()"
      >
        Agendar Cliente
      </button>

    </div>

  </div>

</div>


<script>

  /*
   * ==========================================================
   * CONFIGURAÇÃO
   * ==========================================================
   */

  const API_URL =
    'https://script.google.com/macros/s/AKfycbxlDNqWDBZZ_BQiECAgMFgd1iZKmv-T1AVBOg2bTnvJdPj7NGolqTbQYdUljRORD3DK/exec';


  let servicos = [];

  let horarioSelecionado = '';

  let agendamentosAtuais = [];


  /*
   * ==========================================================
   * INICIALIZAÇÃO
   * ==========================================================
   */

  document.addEventListener(
    'DOMContentLoaded',
    function() {

      const hoje =
        obterDataHoje();

      document
        .getElementById(
          'dataAgenda'
        )
        .value = hoje;


      document
        .getElementById(
          'data'
        )
        .min = hoje;


      document
        .getElementById(
          'dataAgenda'
        )
        .min = hoje;


      carregarServicos();

      carregarAgenda();

    }
  );


  /*
   * ==========================================================
   * DATA HOJE
   * ==========================================================
   */

  function obterDataHoje() {

    const agora =
      new Date();


    const ano =
      agora.getFullYear();


    const mes =
      String(
        agora.getMonth() + 1
      ).padStart(
        2,
        '0'
      );


    const dia =
      String(
        agora.getDate()
      ).padStart(
        2,
        '0'
      );


    return (
      ano +
      '-' +
      mes +
      '-' +
      dia
    );

  }


  /*
   * ==========================================================
   * ABRIR MODAL
   * ==========================================================
   */

  function abrirNovoAgendamento() {

    limparFormulario();


    document
      .getElementById(
        'modal'
      )
      .classList
      .add('ativo');


    document
      .getElementById(
        'data'
      )
      .value =
      document
        .getElementById(
          'dataAgenda'
        )
        .value ||
      obterDataHoje();


    carregarServicos();


    /*
     * Se já existe serviço selecionado,
     * carrega os horários.
     */

    atualizarHorarios();

  }


  /*
   * ==========================================================
   * FECHAR MODAL
   * ==========================================================
   */

  function fecharModal() {

    document
      .getElementById(
        'modal'
      )
      .classList
      .remove('ativo');

  }


  /*
   * ==========================================================
   * LIMPAR FORMULÁRIO
   * ==========================================================
   */

  function limparFormulario() {

    document
      .getElementById(
        'cliente'
      )
      .value = '';


    document
      .getElementById(
        'whatsapp'
      )
      .value = '';


    document
      .getElementById(
        'observacao'
      )
      .value = '';


    document
      .getElementById(
        'servico'
      )
      .value = '';


    horarioSelecionado = '';


    document
      .getElementById(
        'resumo'
      )
      .style.display =
      'none';


    esconderMensagem(
      'mensagemModal'
    );


    mostrarMensagemHorario(
      'Selecione uma data e um serviço.'
    );

  }


  /*
   * ==========================================================
   * CARREGAR SERVIÇOS
   * ==========================================================
   */

  async function carregarServicos() {

    try {

      const resposta =
        await fetch(
          API_URL +
          '?acao=servicos'
        );


      const dados =
        await resposta.json();


      if (
        !Array.isArray(
          dados
        )
      ) {

        throw new Error(
          'Resposta inválida ao carregar serviços.'
        );

      }


      servicos = dados;


      const select =
        document.getElementById(
          'servico'
        );


      /*
       * Mantém a opção inicial.
       */

      select.innerHTML =
        '<option value="">Selecione o serviço</option>';


      servicos.forEach(
        function(servico) {

          const option =
            document.createElement(
              'option'
            );


          option.value =
            servico.id;


          option.textContent =
            servico.nome +
            ' - ' +
            servico.duracao +
            ' min' +
            (
              servico.preco
                ? ' - R$ ' +
                  Number(
                    servico.preco
                  ).toFixed(2).replace(
                    '.',
                    ','
                  )
                : ''
            );


          select.appendChild(
            option
          );

        }
      );

    } catch (erro) {

      mostrarMensagem(
        'mensagemModal',
        'Erro ao carregar os serviços: ' +
        erro.message,
        'erro'
      );

    }

  }


  /*
   * ==========================================================
   * DATA ALTERADA
   * ==========================================================
   */

  function dataAlterada() {

    horarioSelecionado = '';

    atualizarHorarios();

  }


  /*
   * ==========================================================
   * SERVIÇO ALTERADO
   * ==========================================================
   */

  function servicoAlterado() {

    horarioSelecionado = '';

    atualizarHorarios();

  }


  /*
   * ==========================================================
   * ATUALIZAR HORÁRIOS
   * ==========================================================
   */

  async function atualizarHorarios() {

    const data =
      document
        .getElementById(
          'data'
        )
        .value;


    const servicoId =
      document
        .getElementById(
          'servico'
        )
        .value;


    const area =
      document
        .getElementById(
          'areaHorarios'
        );


    horarioSelecionado = '';


    if (!data) {

      area.innerHTML =
        '<div class="carregando">' +
        'Selecione uma data.' +
        '</div>';

      atualizarResumo();

      return;

    }


    if (!servicoId) {

      area.innerHTML =
        '<div class="carregando">' +
        'Agora selecione o serviço.' +
        '</div>';

      atualizarResumo();

      return;

    }


    const servico =
      servicos.find(
        function(item) {

          return String(
            item.id
          ) === String(
            servicoId
          );

        }
      );


    if (!servico) {

      area.innerHTML =
        '<div class="sem-horarios">' +
        'Serviço não encontrado.' +
        '</div>';

      return;

    }


    area.innerHTML =
      '<div class="carregando">' +
      'Buscando horários disponíveis...' +
      '</div>';


    try {

      const url =
        API_URL +
        '?acao=horarios' +
        '&data=' +
        encodeURIComponent(
          data
        ) +
        '&duracao=' +
        encodeURIComponent(
          servico.duracao
        );


      console.log(
        'Consultando:',
        url
      );


      const resposta =
        await fetch(
          url,
          {
            method: 'GET',
            cache: 'no-store'
          }
        );


      if (!resposta.ok) {

        throw new Error(
          'Erro HTTP ' +
          resposta.status
        );

      }


      const dados =
        await resposta.json();


      console.log(
        'Horários recebidos:',
        dados
      );


      if (
        !dados ||
        dados.sucesso === false
      ) {

        throw new Error(
          dados.erro ||
          'Erro ao consultar horários.'
        );

      }


      renderizarHorarios(
        dados.horarios || []
      );


    } catch (erro) {

      console.error(
        erro
      );


      area.innerHTML =
        '<div class="sem-horarios">' +
        'Não foi possível carregar os horários.<br><br>' +
        '<small>' +
        escapeHtml(
          erro.message
        ) +
        '</small>' +
        '</div>';

    }

  }


  /*
   * ==========================================================
   * RENDERIZAR HORÁRIOS
   * ==========================================================
   */

  function renderizarHorarios(
    horarios
  ) {

    const area =
      document
        .getElementById(
          'areaHorarios'
        );


    if (
      !horarios ||
      horarios.length === 0
    ) {

      area.innerHTML =
        '<div class="sem-horarios">' +
        'Não há horários disponíveis para esta data.' +
        '</div>';

      return;

    }


    const disponiveis =
      horarios.filter(
        function(item) {

          return item.disponivel;

        }
      );


    if (
      disponiveis.length === 0
    ) {

      area.innerHTML =
        '<div class="sem-horarios">' +
        'Todos os horários estão ocupados nesta data.' +
        '</div>';

      return;

    }


    area.innerHTML = '';


    horarios.forEach(
      function(item) {

        const botao =
          document.createElement(
            'button'
          );


        botao.type =
          'button';


        botao.textContent =
          item.hora;


        botao.className =
          'horario';


        if (
          !item.disponivel
        ) {

          botao.classList.add(
            'ocupado'
          );

          botao.disabled =
            true;

          botao.title =
            'Horário ocupado';

        } else {

          botao.onclick =
            function() {

              selecionarHorario(
                item.hora,
                botao
              );

            };

        }


        area.appendChild(
          botao
        );

      }
    );

  }


  /*
   * ==========================================================
   * SELECIONAR HORÁRIO
   * ==========================================================
   */

  function selecionarHorario(
    hora,
    botao
  ) {

    document
      .querySelectorAll(
        '#areaHorarios .horario'
      )
      .forEach(
        function(item) {

          item.classList.remove(
            'selecionado'
          );

        }
      );


    botao.classList.add(
      'selecionado'
    );


    horarioSelecionado =
      hora;


    atualizarResumo();

  }


  /*
   * ==========================================================
   * RESUMO
   * ==========================================================
   */

  function atualizarResumo() {

    const resumo =
      document
        .getElementById(
          'resumo'
        );


    const data =
      document
        .getElementById(
          'data'
        )
        .value;


    const servicoId =
      document
        .getElementById(
          'servico'
        )
        .value;


    if (
      !data ||
      !servicoId ||
      !horarioSelecionado
    ) {

      resumo.style.display =
        'none';

      return;

    }


    const servico =
      servicos.find(
        function(item) {

          return String(
            item.id
          ) === String(
            servicoId
          );

        }
      );


    if (!servico) {

      resumo.style.display =
        'none';

      return;

    }


    resumo.innerHTML =

      '<strong>Resumo:</strong><br>' +

      'Data: ' +
      formatarDataBR(
        data
      ) +

      '<br>' +

      'Horário: ' +
      horarioSelecionado +

      '<br>' +

      'Serviço: ' +
      escapeHtml(
        servico.nome
      ) +

      '<br>' +

      'Duração: ' +
      servico.duracao +
      ' minutos';


    resumo.style.display =
      'block';

  }


  /*
   * ==========================================================
   * SALVAR
   * ==========================================================
   */

  async function salvarAgendamento() {

    const cliente =
      document
        .getElementById(
          'cliente'
        )
        .value
        .trim();


    const whatsapp =
      document
        .getElementById(
          'whatsapp'
        )
        .value
        .trim();


    const data =
      document
        .getElementById(
          'data'
        )
        .value;


    const servicoId =
      document
        .getElementById(
          'servico'
        )
        .value;


    const observacao =
      document
        .getElementById(
          'observacao'
        )
        .value
        .trim();


    if (!cliente) {

      mostrarMensagem(
        'mensagemModal',
        'Informe o nome da cliente.',
        'erro'
      );

      return;

    }


    if (!whatsapp) {

      mostrarMensagem(
        'mensagemModal',
        'Informe o WhatsApp da cliente.',
        'erro'
      );

      return;

    }


    if (!data) {

      mostrarMensagem(
        'mensagemModal',
        'Informe a data.',
        'erro'
      );

      return;

    }


    if (!servicoId) {

      mostrarMensagem(
        'mensagemModal',
        'Selecione o serviço.',
        'erro'
      );

      return;

    }


    if (!horarioSelecionado) {

      mostrarMensagem(
        'mensagemModal',
        'Selecione um horário.',
        'erro'
      );

      return;

    }


    const servico =
      servicos.find(
        function(item) {

          return String(
            item.id
          ) === String(
            servicoId
          );

        }
      );


    if (!servico) {

      mostrarMensagem(
        'mensagemModal',
        'Serviço inválido.',
        'erro'
      );

      return;

    }


    const btn =
      document
        .getElementById(
          'btnSalvar'
        );


    btn.disabled =
      true;


    btn.textContent =
      'Agendando...';


    esconderMensagem(
      'mensagemModal'
    );


    try {

      const dados = {

        acao:
          'agendar',

        cliente:
          cliente,

        whatsapp:
          whatsapp,

        data:
          data,

        hora:
          horarioSelecionado,

        servico:
          servico.nome,

        duracao:
          Number(
            servico.duracao
          ),

        observacao:
          observacao

      };


      /*
       * O Apps Script aceita POST JSON.
       */

      const resposta =
        await fetch(
          API_URL,
          {

            method:
              'POST',

            headers: {

              'Content-Type':
                'text/plain;charset=utf-8'

            },

            body:
              JSON.stringify(
                dados
              )

          }
        );


      const resultado =
        await resposta.json();


      if (
        !resultado.sucesso
      ) {

        throw new Error(
          resultado.erro ||
          'Não foi possível realizar o agendamento.'
        );

      }


      mostrarMensagem(
        'mensagemPrincipal',
        'Agendamento realizado com sucesso!',
        'sucesso'
      );


      fecharModal();


      document
        .getElementById(
          'dataAgenda'
        )
        .value =
        data;


      carregarAgenda();


    } catch (erro) {

      console.error(
        erro
      );


      mostrarMensagem(
        'mensagemModal',
        erro.message,
        'erro'
      );


    } finally {

      btn.disabled =
        false;

      btn.textContent =
        'Agendar Cliente';

    }

  }


  /*
   * ==========================================================
   * CARREGAR AGENDA
   * ==========================================================
   */

  async function carregarAgenda() {

    const data =
      document
        .getElementById(
          'dataAgenda'
        )
        .value;


    const area =
      document
        .getElementById(
          'listaAgendamentos'
        );


    if (!data) {

      area.innerHTML =
        '<div class="carregando">' +
        'Selecione uma data.' +
        '</div>';

      return;

    }


    area.innerHTML =
      '<div class="carregando">' +
      'Carregando agendamentos...' +
      '</div>';


    try {

      const resposta =
        await fetch(
          API_URL +
          '?acao=agendamentos' +
          '&data=' +
          encodeURIComponent(
            data
          ) +
          '&_=' +
          Date.now(),
          {
            cache:
              'no-store'
          }
        );


      const dados =
        await resposta.json();


      if (
        !Array.isArray(
          dados
        )
      ) {

        throw new Error(
          'Resposta inválida.'
        );

      }


      agendamentosAtuais =
        dados;


      renderizarAgenda(
        dados
      );


    } catch (erro) {

      console.error(
        erro
      );


      area.innerHTML =
        '<div class="sem-horarios">' +
        'Erro ao carregar a agenda.<br>' +
        escapeHtml(
          erro.message
        ) +
        '</div>';

    }

  }


  /*
   * ==========================================================
   * RENDERIZAR AGENDA
   * ==========================================================
   */

  function renderizarAgenda(
    agendamentos
  ) {

    const area =
      document
        .getElementById(
          'listaAgendamentos'
        );


    if (
      !agendamentos ||
      agendamentos.length === 0
    ) {

      area.innerHTML =
        '<h3>Agendamentos do dia</h3>' +
        '<div class="carregando">' +
        'Nenhum agendamento para esta data.' +
        '</div>';

      return;

    }


    /*
     * Ordena por horário.
     */

    agendamentos.sort(
      function(a, b) {

        return converterMinutosJS(
          a.hora
        ) -
        converterMinutosJS(
          b.hora
        );

      }
    );


    let html =
      '<h3>Agendamentos do dia</h3>';


    agendamentos.forEach(
      function(item) {

        html +=

          '<div class="agendamento">' +

            '<div class="agendamento-topo">' +

              '<div>' +

                '<strong>' +

                escapeHtml(
                  item.hora
                ) +

                ' - ' +

                escapeHtml(
                  item.cliente
                ) +

                '</strong>' +

              '</div>' +

              '<button ' +

                'class="btn-cancelar" ' +

                'onclick="cancelarAgendamento(\'' +

                escapeHtmlJS(
                  item.id
                ) +

                '\')">' +

                'Cancelar' +

              '</button>' +

            '</div>' +

            '<div class="info">' +

              '<strong>Serviço:</strong> ' +

              escapeHtml(
                item.servico
              ) +

              ' (' +

              item.duracao +

              ' min)' +

            '</div>' +

            '<div class="info">' +

              '<strong>WhatsApp:</strong> ' +

              escapeHtml(
                item.whatsapp
              ) +

            '</div>' +

            (
              item.observacao
              ?

              '<div class="info">' +

                '<strong>Observação:</strong> ' +

                escapeHtml(
                  item.observacao
                ) +

              '</div>'

              :

              ''

            ) +

          '</div>';

      }
    );


    area.innerHTML =
      html;

  }


  /*
   * ==========================================================
   * CANCELAR
   * ==========================================================
   */

  async function cancelarAgendamento(
    id
  ) {

    if (
      !confirm(
        'Deseja realmente cancelar este agendamento?'
      )
    ) {

      return;

    }


    try {

      const resposta =
        await fetch(
          API_URL,
          {

            method:
              'POST',

            headers: {

              'Content-Type':
                'text/plain;charset=utf-8'

            },

            body:
              JSON.stringify({

                acao:
                  'cancelar',

                id:
                  id

              })

          }
        );


      const resultado =
        await resposta.json();


      if (
        !resultado.sucesso
      ) {

        throw new Error(
          resultado.erro ||
          'Erro ao cancelar.'
        );

      }


      mostrarMensagem(
        'mensagemPrincipal',
        'Agendamento cancelado com sucesso.',
        'sucesso'
      );


      carregarAgenda();


    } catch (erro) {

      mostrarMensagem(
        'mensagemPrincipal',
        erro.message,
        'erro'
      );

    }

  }


  /*
   * ==========================================================
   * MENSAGENS
   * ==========================================================
   */

  function mostrarMensagem(
    id,
    texto,
    tipo
  ) {

    const elemento =
      document.getElementById(
        id
      );


    if (!elemento) {

      return;

    }


    elemento.textContent =
      texto;


    elemento.className =
      'mensagem ' +
      tipo;


    setTimeout(
      function() {

        esconderMensagem(
          id
        );

      },
      5000
    );

  }


  function esconderMensagem(
    id
  ) {

    const elemento =
      document.getElementById(
        id
      );


    if (!elemento) {

      return;

    }


    elemento.className =
      'mensagem';

    elemento.textContent =
      '';

  }


  function mostrarMensagemHorario(
    texto
  ) {

    document
      .getElementById(
        'areaHorarios'
      )
      .innerHTML =
      '<div class="carregando">' +
      texto +
      '</div>';

  }


  /*
   * ==========================================================
   * FUNÇÕES DE FORMATAÇÃO
   * ==========================================================
   */

  function formatarDataBR(
    data
  ) {

    if (!data) {

      return '';

    }


    const partes =
      data.split('-');


    if (
      partes.length !== 3
    ) {

      return data;

    }


    return (

      partes[2] +
      '/' +
      partes[1] +
      '/' +
      partes[0]

    );

  }


  function converterMinutosJS(
    hora
  ) {

    const partes =
      String(
        hora || '00:00'
      ).split(':');


    return (

      Number(
        partes[0] || 0
      ) * 60

      +

      Number(
        partes[1] || 0
      )

    );

  }


  /*
   * ==========================================================
   * SEGURANÇA HTML
   * ==========================================================
   */

  function escapeHtml(
    texto
  ) {

    return String(
      texto || ''
    )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

  }


  function escapeHtmlJS(
    texto
  ) {

    return String(
      texto || ''
    )
    .replace(
      /\\/g,
      '\\\\'
    )
    .replace(
      /'/g,
      "\\'"
    )
    .replace(
      /"/g,
      '\\"'
    );

  }


  /*
   * Fecha o modal clicando fora.
   */

  document
    .getElementById(
      'modal'
    )
    .addEventListener(
      'click',
      function(event) {

        if (
          event.target ===
          this
        ) {

          fecharModal();

        }

      }
    );

</script>
