<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Agenda - Salão Janaina</title>

<style>

/* =====================================================
   RESET
   ===================================================== */

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    Helvetica,
    sans-serif;

  background:
    linear-gradient(
      180deg,
      #faf7f9 0%,
      #f7f2f5 100%
    );

  color: #30272c;
  min-height: 100vh;
}


/* =====================================================
   HEADER
   ===================================================== */

header {
  position: relative;

  background:
    linear-gradient(
      135deg,
      #713253 0%,
      #8e4168 45%,
      #c66d9c 100%
    );

  color: white;

  padding: 32px 20px;

  text-align: center;

  box-shadow:
    0 8px 25px rgba(113, 50, 83, .16);
}

header::after {
  content: "";

  position: absolute;

  inset: 0;

  background:
    radial-gradient(
      circle at 15% 20%,
      rgba(255,255,255,.12),
      transparent 35%
    ),

    radial-gradient(
      circle at 85% 80%,
      rgba(255,255,255,.08),
      transparent 35%
    );

  pointer-events: none;
}

header h1 {
  position: relative;
  z-index: 1;

  margin: 0;

  font-size: 30px;
  font-weight: 800;

  letter-spacing: -.5px;
}

header p {
  position: relative;
  z-index: 1;

  margin: 8px 0 0;

  opacity: .92;

  font-size: 15px;

  font-weight: 400;
}


/* =====================================================
   CONTAINER
   ===================================================== */

.container {
  width: 100%;
  max-width: 1100px;

  margin: 0 auto;

  padding: 30px 20px 50px;
}


/* =====================================================
   TOPO DA AGENDA
   ===================================================== */

.topo {
  display: flex;

  justify-content: space-between;
  align-items: center;

  width: 100%;

  margin-bottom: 24px;

  gap: 20px;
}

.topo h2 {
  margin: 0;
  padding: 0;

  color: #713253;

  font-size: 28px;
  font-weight: 750;

  line-height: 1.2;

  text-align: left;

  letter-spacing: -.5px;
}

.topo .btn-principal {
  margin-left: auto;
  flex-shrink: 0;
}


/* =====================================================
   BOTÃO PRINCIPAL
   ===================================================== */

button {
  border: 0;
  cursor: pointer;

  font-family: inherit;
}

.btn-principal {

  display: inline-flex;

  align-items: center;
  justify-content: center;

  gap: 8px;

  background:
    linear-gradient(
      135deg,
      #8e4168 0%,
      #a95780 100%
    );

  color: white;

  padding: 14px 20px;

  min-height: 46px;

  border-radius: 11px;

  font-size: 14px;
  font-weight: 700;

  line-height: 1;

  box-shadow:
    0 6px 18px rgba(
      142,
      65,
      104,
      .20
    );

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    background .2s ease;
}

.btn-principal:hover {

  background:
    linear-gradient(
      135deg,
      #713253 0%,
      #8e4168 100%
    );

  transform:
    translateY(-1px);

  box-shadow:
    0 9px 24px rgba(
      142,
      65,
      104,
      .28
    );
}

.btn-principal:active {
  transform:
    translateY(0);
}


/* =====================================================
   CARDS
   ===================================================== */

.card {

  background:
    rgba(255,255,255,.96);

  border:
    1px solid rgba(
      113,
      50,
      83,
      .07
    );

  border-radius: 18px;

  padding: 24px;

  margin-bottom: 20px;

  box-shadow:
    0 5px 25px rgba(
      45,
      30,
      38,
      .06
    );

  transition:
    box-shadow .2s ease;
}

.card:hover {

  box-shadow:
    0 8px 30px rgba(
      45,
      30,
      38,
      .08
    );
}

.card h3 {

  margin-top: 0;
  margin-bottom: 20px;

  color: #713253;

  font-size: 17px;
  font-weight: 750;
}


/* =====================================================
   FILTRO
   ===================================================== */

.filtro {

  display: flex;

  align-items: flex-end;

  gap: 15px;

  flex-wrap: wrap;
}


/* =====================================================
   LABELS
   ===================================================== */

label {

  display: block;

  font-size: 13px;

  font-weight: 700;

  margin-bottom: 8px;

  color: #5c5257;
}


/* =====================================================
   INPUTS
   ===================================================== */

input,
select,
textarea {

  width: 100%;

  padding: 13px 14px;

  border:
    1px solid #e2dce0;

  border-radius: 10px;

  font-family: inherit;

  font-size: 14px;

  color: #352c31;

  outline: none;

  background: #fff;

  transition:
    border-color .2s ease,
    box-shadow .2s ease,
    background .2s ease;
}

input:hover,
select:hover,
textarea:hover {

  border-color:
    #d4bcc9;
}

input:focus,
select:focus,
textarea:focus {

  border-color:
    #b65f8d;

  background: #fff;

  box-shadow:
    0 0 0 4px
    rgba(
      182,
      95,
      141,
      .10
    );
}

input::placeholder,
textarea::placeholder {

  color: #aaa1a6;
}

textarea {

  min-height: 90px;

  resize: vertical;
}


/* =====================================================
   CAMPOS
   ===================================================== */

.campo {
  margin-bottom: 18px;
}


/* =====================================================
   GRID
   ===================================================== */

.grid {

  display: grid;

  grid-template-columns:
    repeat(2, 1fr);

  gap: 16px;
}


/* =====================================================
   HORÁRIOS
   ===================================================== */

.horarios {

  display: grid;

  grid-template-columns:
    repeat(
      auto-fill,
      minmax(105px, 1fr)
    );

  gap: 10px;

  margin-top: 10px;
}

.horario {

  padding: 13px 8px;

  min-height: 46px;

  border-radius: 10px;

  background:
    #f7eaf1;

  color:
    #713253;

  border:
    2px solid transparent;

  font-size: 14px;

  font-weight: 700;

  transition:
    background .2s ease,
    transform .2s ease,
    border-color .2s ease;
}

.horario:hover {

  background:
    #ecd4e1;

  transform:
    translateY(-1px);
}

.horario.selecionado {

  background:
    linear-gradient(
      135deg,
      #8e4168,
      #a95780
    );

  color: white;

  border-color:
    #713253;

  box-shadow:
    0 5px 15px
    rgba(
      142,
      65,
      104,
      .22
    );
}

.horario.ocupado {

  background:
    #eeeeee;

  color:
    #aaa;

  cursor:
    not-allowed;

  text-decoration:
    line-through;
}

.horario.informacao {

  background:
    #fff8fb;

  color:
    #8e4168;

  border:
    1px dashed #d89abc;

  cursor:
    default;

  font-size: 13px;

  grid-column:
    1 / -1;

  text-decoration:
    none;

  box-shadow:
    none;
}


/* =====================================================
   MENSAGENS
   ===================================================== */

.mensagem {

  padding: 13px 15px;

  border-radius: 10px;

  margin-bottom: 18px;

  display: none;

  font-size: 14px;

  font-weight: 600;
}

.mensagem.erro {

  display: block;

  background:
    #fff0f0;

  color:
    #a00000;

  border:
    1px solid #ffd4d4;
}

.mensagem.sucesso {

  display: block;

  background:
    #edf9f1;

  color:
    #176b2d;

  border:
    1px solid #ccebd5;
}

.carregando {

  text-align: center;

  color: #8b8186;

  padding: 20px;

  font-size: 14px;
}

.sem-horarios {

  background:
    #fff5f5;

  color:
    #a33;

  padding: 16px;

  border-radius: 11px;

  text-align: center;

  font-size: 14px;

  border:
    1px solid #f4dddd;
}


/* =====================================================
   AGENDA
   ===================================================== */

.agendamento {

  border:
    1px solid #eee6ea;

  border-left:
    5px solid #8e4168;

  padding: 17px;

  border-radius: 11px;

  margin-bottom: 12px;

  background:
    #fff;

  transition:
    transform .2s ease,
    box-shadow .2s ease;
}

.agendamento:hover {

  transform:
    translateY(-1px);

  box-shadow:
    0 5px 18px
    rgba(
      45,
      30,
      38,
      .06
    );
}

.agendamento-topo {

  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 10px;

  flex-wrap: wrap;
}

.agendamento strong {

  color:
    #713253;
}

.info {

  margin-top: 8px;

  font-size: 14px;

  color:
    #5d5559;

  line-height:
    1.45;
}


/* =====================================================
   BOTÃO CANCELAR
   ===================================================== */

.btn-cancelar {

  background:
    #fff0f0;

  color:
    #a00000;

  padding:
    8px 12px;

  border-radius:
    8px;

  font-size:
    12px;

  font-weight:
    700;

  transition:
    background .2s ease;
}

.btn-cancelar:hover {

  background:
    #ffdede;
}


/* =====================================================
   MODAL
   ===================================================== */

.modal {

  display: none;

  position: fixed;

  inset: 0;

  background:
    rgba(
      37,
      24,
      31,
      .62
    );

  backdrop-filter:
    blur(4px);

  -webkit-backdrop-filter:
    blur(4px);

  z-index: 999;

  padding: 20px;

  overflow-y: auto;
}

.modal.ativo {

  display: flex;

  align-items:
    flex-start;

  justify-content:
    center;
}

.modal-conteudo {

  background:
    #fff;

  width: 100%;

  max-width: 650px;

  margin: 20px auto;

  border-radius: 20px;

  padding: 26px;

  box-shadow:
    0 20px 60px
    rgba(
      0,
      0,
      0,
      .25
    );

  animation:
    abrirModal .2s ease;
}

@keyframes abrirModal {

  from {
    opacity: 0;

    transform:
      translateY(10px)
      scale(.98);
  }

  to {
    opacity: 1;

    transform:
      translateY(0)
      scale(1);
  }

}


/* =====================================================
   CABEÇALHO DO MODAL
   ===================================================== */

.modal-header {

  display: flex;

  justify-content:
    space-between;

  align-items:
    center;

  margin-bottom:
    24px;

  padding-bottom:
    18px;

  border-bottom:
    1px solid #eee6ea;
}

.modal-header h2 {

  margin: 0;

  color:
    #713253;

  font-size:
    22px;

  font-weight:
    750;
}


/* =====================================================
   FECHAR MODAL
   ===================================================== */

.fechar {

  width: 36px;
  height: 36px;

  border-radius:
    50%;

  background:
    #f7edf2;

  color:
    #713253;

  font-size:
    21px;

  display: flex;

  align-items:
    center;

  justify-content:
    center;

  transition:
    background .2s ease,
    transform .2s ease;
}

.fechar:hover {

  background:
    #ead4df;

  transform:
    rotate(3deg);
}


/* =====================================================
   RESUMO
   ===================================================== */

.resumo {

  background:
    linear-gradient(
      135deg,
      #fbf3f7,
      #f7eaf1
    );

  border:
    1px solid #ecd8e2;

  border-radius:
    11px;

  padding:
    14px;

  margin-top:
    15px;

  color:
    #713253;

  font-size:
    13px;

  line-height:
    1.7;
}


/* =====================================================
   AÇÕES DO MODAL
   ===================================================== */

.acoes {

  display: flex;

  gap: 10px;

  justify-content:
    flex-end;

  margin-top:
    24px;

  padding-top:
    18px;

  border-top:
    1px solid #eee6ea;
}

.btn-secundario {

  background:
    #f1eff0;

  color:
    #4b4548;

  padding:
    12px 18px;

  min-height:
    44px;

  border-radius:
    9px;

  font-weight:
    700;

  font-size:
    13px;

  transition:
    background .2s ease;
}

.btn-secundario:hover {

  background:
    #e5e1e3;
}

.btn-salvar {

  background:
    linear-gradient(
      135deg,
      #8e4168,
      #a95780
    );

  color:
    white;

  padding:
    12px 20px;

  min-height:
    44px;

  border-radius:
    9px;

  font-weight:
    700;

  font-size:
    13px;

  box-shadow:
    0 5px 15px
    rgba(
      142,
      65,
      104,
      .20
    );

  transition:
    transform .2s ease,
    box-shadow .2s ease;
}

.btn-salvar:hover {

  transform:
    translateY(-1px);

  box-shadow:
    0 7px 19px
    rgba(
      142,
      65,
      104,
      .27
    );
}

.btn-salvar:disabled {

  background:
    #aaa;

  cursor:
    not-allowed;

  box-shadow:
    none;

  transform:
    none;
}


/* =====================================================
   RESPONSIVO
   ===================================================== */

@media (max-width: 700px) {

  .container {

    padding:
      24px 15px 40px;
  }

  header {

    padding:
      27px 15px;
  }

  header h1 {

    font-size:
      26px;
  }

  .topo {

    flex-direction:
      column;

    align-items:
      stretch;

    gap:
      14px;
  }

  .topo h2 {

    text-align:
      left;

    font-size:
      25px;
  }

  .topo .btn-principal {

    width:
      100%;

    margin-left:
      0;
  }

  .grid {

    grid-template-columns:
      1fr;
  }

  .card {

    padding:
      18px;

    border-radius:
      15px;
  }

  .horarios {

    grid-template-columns:
      repeat(3, 1fr);

    gap:
      8px;
  }

  .horario {

    font-size:
      13px;

    padding:
      11px 5px;
  }

  .modal {

    padding:
      10px;
  }

  .modal-conteudo {

    margin:
      5px auto;

    padding:
      19px;

    border-radius:
      16px;
  }

  .modal-header h2 {

    font-size:
      19px;
  }

  .acoes {

    flex-direction:
      column-reverse;
  }

  .acoes button {

    width:
      100%;
  }

}


@media (max-width: 380px) {

  .horarios {

    grid-template-columns:
      repeat(2, 1fr);
  }

}


/* =====================================================
   BARRA DE ROLAGEM
   ===================================================== */

::-webkit-scrollbar {

  width:
    8px;
}

::-webkit-scrollbar-track {

  background:
    #f5f1f3;
}

::-webkit-scrollbar-thumb {

  background:
    #c99ab1;

  border-radius:
    10px;
}

::-webkit-scrollbar-thumb:hover {

  background:
    #a95780;
}

</style>

</head>


<body>


<header>

<h1>Salão Janaina</h1>

<p>Gestão de agenda e atendimento</p>

</header>


<div class="container">


<!-- =====================================================
     TOPO
     ===================================================== -->

<div class="topo">

<h2>Agenda</h2>

<button
  class="btn-principal"
  onclick="abrirNovoAgendamento()">

  + Novo Agendamento

</button>

</div>


<!-- =====================================================
     MENSAGEM PRINCIPAL
     ===================================================== -->

<div
  id="mensagemPrincipal"
  class="mensagem">
</div>


<!-- =====================================================
     FILTRO DE DATA
     ===================================================== -->

<div class="card">

<h3>Agendamentos do dia</h3>

<div class="filtro">

<div style="width:100%;max-width:250px">

<label for="dataAgenda">
Data
</label>

<input
  type="date"
  id="dataAgenda"
  onchange="carregarAgenda()">

</div>

</div>

</div>


<!-- =====================================================
     LISTA DE AGENDAMENTOS
     ===================================================== -->

<div
  id="listaAgendamentos"
  class="card">

<div class="carregando">
Carregando...
</div>

</div>


</div>


<!-- =====================================================
     MODAL
     ===================================================== -->

<div
  id="modal"
  class="modal">

<div class="modal-conteudo">


<div class="modal-header">

<h2>Novo Agendamento</h2>

<button
  class="fechar"
  onclick="fecharModal()">

  ×

</button>

</div>


<div
  id="mensagemModal"
  class="mensagem">
</div>


<!-- CLIENTE -->

<div class="campo">

<label for="cliente">
Nome da cliente *
</label>

<input
  type="text"
  id="cliente"
  placeholder="Digite o nome da cliente">

</div>


<!-- WHATSAPP -->

<div class="campo">

<label for="whatsapp">
WhatsApp *
</label>

<input
  type="tel"
  id="whatsapp"
  placeholder="(31) 99999-9999">

</div>


<!-- DATA + SERVIÇO -->

<div class="grid">


<div class="campo">

<label for="data">
Data *
</label>

<input
  type="date"
  id="data"
  onchange="atualizarHorarios()">

</div>


<div class="campo">

<label for="servico">
Serviço *
</label>

<select
  id="servico"
  onchange="atualizarHorarios()">

<option value="">
Selecione o serviço
</option>

</select>

</div>

</div>


<!-- HORÁRIOS -->

<div class="campo">

<label>
Horários disponíveis *
</label>

<div
  id="areaHorarios"
  class="horarios">

<div class="carregando">
Selecione a data e o serviço.
</div>

</div>

</div>


<!-- OBSERVAÇÃO -->

<div class="campo">

<label for="observacao">
Observação
</label>

<textarea
  id="observacao"
  placeholder="Observações da cliente..."></textarea>

</div>


<!-- RESUMO -->

<div
  id="resumo"
  class="resumo"
  style="display:none">
</div>


<!-- AÇÕES -->

<div class="acoes">

<button
  class="btn-secundario"
  onclick="fecharModal()">

  Cancelar

</button>


<button
  id="btnSalvar"
  class="btn-salvar"
  onclick="salvarAgendamento()">

  Agendar Cliente

</button>

</div>


</div>

</div>


<script>


/* =====================================================
   CONFIGURAÇÃO
   ===================================================== */

const API_URL =
'https://script.google.com/macros/s/AKfycbzGWzCjQsNGfPfFZuRp2Xw3TgqKQ2lslr_bT7sS2_p7YZOqhF_zwTU5KCl_jGqGYrZj/exec';


const NOME_SALAO =
'Salão Janaina';


const INICIO_EXPEDIENTE =
8 * 60;


const FIM_EXPEDIENTE =
18 * 60;


let servicos = [];

let agendamentosDoDia = [];

let horarioSelecionado = '';

let servicoSelecionado = null;


/* =====================================================
   INICIALIZAÇÃO
   ===================================================== */

document.addEventListener(
  'DOMContentLoaded',
  async function() {

    const hoje =
      obterDataHoje();

    document.getElementById(
      'dataAgenda'
    ).value = hoje;

    document.getElementById(
      'dataAgenda'
    ).min = hoje;

    document.getElementById(
      'data'
    ).min = hoje;

    await carregarServicos();

    carregarAgenda();

  }
);


/* =====================================================
   DATA
   ===================================================== */

function obterDataHoje() {

  const agora = new Date();

  return (
    agora.getFullYear() +
    '-' +
    String(
      agora.getMonth() + 1
    ).padStart(2,'0') +
    '-' +
    String(
      agora.getDate()
    ).padStart(2,'0')
  );

}


/* =====================================================
   MODAL
   ===================================================== */

async function abrirNovoAgendamento() {

  limparFormulario();

  const dataAgenda =
    document.getElementById(
      'dataAgenda'
    ).value;

  document.getElementById(
    'data'
  ).value =
    dataAgenda ||
    obterDataHoje();

  document.getElementById(
    'modal'
  ).classList.add('ativo');

  if (servicos.length === 0) {

    await carregarServicos();

  }

  atualizarHorarios();

}


function fecharModal() {

  document.getElementById(
    'modal'
  ).classList.remove('ativo');

}


function limparFormulario() {

  document.getElementById(
    'cliente'
  ).value = '';

  document.getElementById(
    'whatsapp'
  ).value = '';

  document.getElementById(
    'observacao'
  ).value = '';

  document.getElementById(
    'servico'
  ).value = '';

  horarioSelecionado = '';

  servicoSelecionado = null;

  document.getElementById(
    'resumo'
  ).style.display = 'none';

  document.getElementById(
    'areaHorarios'
  ).innerHTML =
    '<div class="carregando">' +
    'Selecione a data e o serviço.' +
    '</div>';

  esconderMensagem(
    'mensagemModal'
  );

}


/* =====================================================
   SERVIÇOS
   ===================================================== */

async function carregarServicos() {

  try {

    const resposta =
      await fetch(
        API_URL +
        '?acao=servicos&_=' +
        Date.now(),
        {
          cache: 'no-store'
        }
      );

    if (!resposta.ok) {

      throw new Error(
        'HTTP ' +
        resposta.status
      );

    }

    const dados =
      await resposta.json();

    let lista = dados;

    if (
      dados &&
      Array.isArray(
        dados.servicos
      )
    ) {

      lista =
        dados.servicos;

    }

    if (
      !Array.isArray(lista)
    ) {

      throw new Error(
        'Resposta inválida dos serviços.'
      );

    }

    servicos =
      lista.map(

              ),

function renderizarHorarios(
  servico,
  agendamentos
) {

  const area =
    document.getElementById(
      'areaHorarios'
    );

  const duracao =
    Number(
      servico.duracao
    );

  const possiveis = [];

  let cursor =
    INICIO_EXPEDIENTE;

  const agenda =
    agendamentos
      .map(
        function(item) {

          const inicio =
            horaParaMinutos(
              item.hora
            );

          const d =
            Number(
              item.duracao
            );

          return {

            inicio: inicio,

            fim:
              inicio +
              d

          };

        }
      )
      .filter(
        function(item) {

          return (
            item.inicio >= 0 &&
            item.fim > item.inicio
          );

        }
      )
      .sort(
        function(a,b) {

          return a.inicio -
            b.inicio;

        }
      );


  while (
    cursor +
    duracao <=
    FIM_EXPEDIENTE
  ) {

    const conflito =
      encontrarConflito(
        cursor,
        cursor + duracao,
        agenda
      );

    if (!conflito) {

      possiveis.push({
        inicio: cursor,
        fim:
          cursor + duracao
      });

      cursor += duracao;

    } else {

      cursor =
        Math.max(
          cursor + 1,
          conflito.fim
        );

    }

  }


  const unicos = [];

  possiveis.forEach(
    function(item) {

      const existe =
        unicos.some(
          function(x) {

            return x.inicio ===
              item.inicio;

          }
        );

      if (!existe) {

        unicos.push(item);

      }

    }
  );


  if (unicos.length === 0) {

    area.innerHTML =
      '<div class="sem-horarios">' +
      'Não há horários disponíveis para este serviço nesta data.' +
      '</div>';

    return;

  }


  area.innerHTML = '';


  const info =
    document.createElement(
      'div'
    );

  info.className =
    'horario informacao';

  info.textContent =
    'Duração: ' +
    duracao +
    ' minutos';

  area.appendChild(info);


  unicos.forEach(
    function(item) {

      const botao =
        document.createElement(
          'button'
        );

      botao.type =
        'button';

      botao.className =
        'horario';

      botao.textContent =
        minutosParaHora(
          item.inicio
        );

      botao.title =
        'Término previsto: ' +
        minutosParaHora(
          item.fim
        );

      botao.onclick =
        function() {

          selecionarHorario(
            minutosParaHora(
              item.inicio
            ),
            botao
          );

        };

      area.appendChild(
        botao
      );

    }
  );

}


function encontrarConflito(
  inicio,
  fim,
  agenda
) {

  return agenda.find(
    function(item) {

      return (
        inicio < item.fim &&
        fim > item.inicio
      );

    }
  ) || null;

}


/* =====================================================
   SELECIONAR HORÁRIO

function selecionarHorario(

    );

    );

  }

    );

    return;

  }


  const servico =

    );

  }


  let janelaWhatsApp = null;

      );

              );

    btn.textContent =

/* =====================================================
   WHATSAPP
   ===================================================== */

function prepararWhatsApp(
  numero
) {

  let telefone =
    String(
      numero || ''
    ).replace(
      /\D/g,
      ''
    );


  if (!telefone) {

    return '';

  }


  if (
    telefone.length === 10 ||
    telefone.length === 11
  ) {

    telefone =
      '55' +
      telefone;

  }


  if (
    telefone.startsWith('55') &&
    (
      telefone.length === 12 ||
      telefone.length === 13
    )
  ) {

    return telefone;

  }


  return '';

}


/* =====================================================
   BUSCAR AGENDAMENTOS
   ===================================================== */

async function buscarAgendamentos(
  data
) {

  const url =
    API_URL +
    '?acao=agendamentos' +
    '&data=' +
    encodeURIComponent(data) +
    '&_=' +
    Date.now();


  const resposta =
    await fetch(
      url,
      {
        cache: 'no-store'
      }
    );


  if (!resposta.ok) {

    throw new Error(
      'HTTP ' +
      resposta.status
    );

  }


  const dados =
    await resposta.json();


  if (
    Array.isArray(dados)
  ) {

    return dados;

  }


  if (
    dados &&
    Array.isArray(
      dados.agendamentos
    )
  ) {

    return dados.agendamentos;

  }


  throw new Error(
    'Resposta inválida dos agendamentos.'
  );

}

        );

/* =====================================================
   UTILITÁRIOS
   ===================================================== */

function horaParaMinutos(
  hora
) {

  if (!hora) {

    return -1;

  }


  const partes =
    String(
      hora
    ).split(':');


  if (
    partes.length < 2
  ) {

    return -1;

  }


  const h =
    Number(
      partes[0]
    );

  const m =
    Number(
      partes[1]
    );


  if (
    !Number.isFinite(h) ||
    !Number.isFinite(m)
  ) {

    return -1;

  }


  return h * 60 + m;

}


function minutosParaHora(
  minutos
) {

  const valor =
    Number(
      minutos
    );


  if (
    !Number.isFinite(valor)
  ) {

    return '';

  }


  return (
    String(
      Math.floor(
        valor / 60
      )
    ).padStart(2,'0') +
    ':' +
    String(
      valor % 60
    ).padStart(2,'0')
  );

}


function formatarDataBR(
  data
) {

  const partes =
    String(
      data
    ).split('-');


  if (
    partes.length !== 3
  ) {

    return data;

  }


  return (
    partes[2] +
    '/' +
    partes[1] +
    '/' +
    partes[0]
  );

}


function mostrarMensagem(
  id,
  texto,
  tipo
) {

  const elemento =
    document.getElementById(
      id
    );


  if (!elemento) {

    return;

  }


  elemento.textContent =
    texto;

  elemento.className =
    'mensagem ' +
    tipo;


  setTimeout(
    function() {

      esconderMensagem(
        id
      );

    },
    5000
  );

}


function esconderMensagem(
  id
) {

  const elemento =
    document.getElementById(
      id
    );


  if (!elemento) {

    return;

  }


  elemento.className =
    'mensagem';

  elemento.textContent =
    '';

}


function escapeHtml(
  texto
) {

  return String(
    texto || ''
  )

  .replace(
    /&/g,
    '&amp;'
  )

  .replace(
    /</g,
    '&lt;'
  )

  .replace(
    />/g,
    '&gt;'
  )

  .replace(
    /"/g,
    '&quot;'
  )

  .replace(
    /'/g,
    '&#039;'
  );

}


function escapeHtmlJS(
  texto
) {

  return String(
    texto || ''
  )

  .replace(
    /\\/g,
    '\\\\'
  )

  .replace(
    /'/g,
    "\\'"
  )

  .replace(
    /"/g,
    '\\"'
  );

}
