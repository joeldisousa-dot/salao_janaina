<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Agenda - Salão Janaina</title>

<style>

/* =====================================================
   DESIGN SYSTEM
   ===================================================== */

:root {

  --primary: #8b315f;
  --primary-dark: #682344;
  --primary-light: #b95782;
  --primary-soft: #f8edf3;

  --accent: #d69a3a;
  --accent-soft: #fff7e8;

  --background: #f5f3f6;
  --surface: #ffffff;
  --surface-soft: #faf9fb;

  --text: #252129;
  --text-light: #77717a;
  --text-muted: #9a949d;

  --border: #ece8ed;

  --success: #23865a;
  --success-bg: #eaf8f1;

  --danger: #b23b4b;
  --danger-bg: #fff0f2;

  --shadow-sm:
    0 2px 8px rgba(45, 25, 40, .05);

  --shadow:
    0 8px 30px rgba(45, 25, 40, .08);

  --shadow-lg:
    0 20px 60px rgba(45, 25, 40, .16);

  --radius-sm: 10px;
  --radius: 16px;
  --radius-lg: 22px;

}


/* =====================================================
   RESET
   ===================================================== */

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {

  margin: 0;

  min-height: 100vh;

  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    Helvetica,
    sans-serif;

  background:
    radial-gradient(
      circle at top left,
      rgba(185,87,130,.08),
      transparent 30%
    ),
    var(--background);

  color: var(--text);

  -webkit-font-smoothing: antialiased;

}


/* =====================================================
   HEADER / TOPO PREMIUM
   ===================================================== */

header {

  position: relative;

  overflow: hidden;

  background:
    linear-gradient(
      135deg,
      #57203b 0%,
      #7c2d54 45%,
      #a84773 100%
    );

  color: white;

  padding: 34px 25px 38px;

  box-shadow:
    0 8px 30px rgba(85,30,60,.18);

}

header::before {

  content: "";

  position: absolute;

  width: 360px;
  height: 360px;

  right: -120px;
  top: -180px;

  border-radius: 50%;

  background:
    rgba(255,255,255,.07);

}

header::after {

  content: "";

  position: absolute;

  width: 220px;
  height: 220px;

  left: -100px;
  bottom: -150px;

  border-radius: 50%;

  background:
    rgba(255,255,255,.05);

}

header h1 {

  position: relative;

  z-index: 1;

  margin: 0;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 34px;

  font-weight: 600;

  letter-spacing: -.5px;

}

header p {

  position: relative;

  z-index: 1;

  margin: 8px 0 0;

  font-size: 14px;

  letter-spacing: .3px;

  color: rgba(255,255,255,.78);

}


/* =====================================================
   CONTAINER
   ===================================================== */

.container {

  position: relative;

  width: 100%;

  max-width: 1180px;

  margin: -18px auto 50px;

  padding: 0 22px;

  z-index: 2;

}


/* =====================================================
   TOPO DA AGENDA
   ===================================================== */

.topo {

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 20px;

  margin-bottom: 22px;

}

.topo h2 {

  margin: 0;

  color: var(--text);

  font-size: 26px;

  font-weight: 700;

  letter-spacing: -.5px;

}

.topo h2::before {

  content: "";

  display: inline-block;

  width: 5px;
  height: 26px;

  margin-right: 11px;

  vertical-align: -4px;

  border-radius: 5px;

  background:
    linear-gradient(
      to bottom,
      var(--primary-light),
      var(--primary-dark)
    );

}


/* =====================================================
   BOTÕES
   ===================================================== */

button {

  border: 0;

  cursor: pointer;

  font-family: inherit;

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    background .2s ease,
    opacity .2s ease;

}

button:active {

  transform: scale(.98);

}

.btn-principal {

  display: inline-flex;

  align-items: center;

  justify-content: center;

  gap: 9px;

  background:
    linear-gradient(
      135deg,
      var(--primary),
      var(--primary-light)
    );

  color: white;

  padding: 14px 21px;

  border-radius: 12px;

  font-size: 14px;

  font-weight: 700;

  box-shadow:
    0 7px 18px rgba(139,49,95,.24);

}

.btn-principal:hover {

  transform: translateY(-2px);

  box-shadow:
    0 11px 25px rgba(139,49,95,.30);

}

.btn-principal::first-letter {

  font-size: 18px;

}


/* =====================================================
   CARDS
   ===================================================== */

.card {

  position: relative;

  background:
    rgba(255,255,255,.96);

  border: 1px solid rgba(236,232,237,.9);

  border-radius: var(--radius);

  padding: 24px;

  margin-bottom: 20px;

  box-shadow: var(--shadow-sm);

  transition:
    box-shadow .2s ease,
    transform .2s ease;

}

.card:hover {

  box-shadow: var(--shadow);

}

.card h3 {

  margin: 0 0 18px;

  color: var(--text);

  font-size: 17px;

  font-weight: 700;

  letter-spacing: -.2px;

}


/* =====================================================
   FILTRO / DATA
   ===================================================== */

.filtro {

  display: flex;

  align-items: flex-end;

  gap: 14px;

  flex-wrap: wrap;

}

.filtro > div {

  width: 100%;

  max-width: 280px !important;

}

label {

  display: block;

  font-size: 12px;

  font-weight: 700;

  margin-bottom: 8px;

  color: var(--text-light);

  text-transform: uppercase;

  letter-spacing: .5px;

}

input,
select,
textarea {

  width: 100%;

  padding: 13px 14px;

  border: 1px solid var(--border);

  border-radius: 11px;

  font-size: 14px;

  font-family: inherit;

  color: var(--text);

  outline: none;

  background:
    var(--surface-soft);

  transition:
    border .2s ease,
    box-shadow .2s ease,
    background .2s ease;

}

input:hover,
select:hover,
textarea:hover {

  border-color: #d9cfd7;

}

input:focus,
select:focus,
textarea:focus {

  border-color:
    var(--primary-light);

  background: white;

  box-shadow:
    0 0 0 4px rgba(185,87,130,.10);

}

input::placeholder,
textarea::placeholder {

  color: #aaa4ab;

}

textarea {

  min-height: 100px;

  resize: vertical;

  line-height: 1.5;

}


/* =====================================================
   MENSAGENS
   ===================================================== */

.mensagem {

  padding: 14px 16px;

  border-radius: 12px;

  margin-bottom: 18px;

  display: none;

  font-size: 14px;

  font-weight: 600;

  border: 1px solid transparent;

}

.mensagem.erro {

  display: block;

  background:
    var(--danger-bg);

  color:
    var(--danger);

  border-color:
    #f4cbd1;

}

.mensagem.sucesso {

  display: block;

  background:
    var(--success-bg);

  color:
    var(--success);

  border-color:
    #c8ead9;

}


/* =====================================================
   LOADING
   ===================================================== */

.carregando {

  text-align: center;

  color: var(--text-muted);

  padding: 32px 15px;

  font-size: 14px;

}

.carregando::before {

  content: "";

  display: block;

  width: 22px;
  height: 22px;

  margin: 0 auto 10px;

  border: 3px solid #eee7eb;

  border-top-color:
    var(--primary);

  border-radius: 50%;

  animation:
    girar .8s linear infinite;

}

@keyframes girar {

  to {
    transform: rotate(360deg);
  }

}

.sem-horarios {

  background:
    linear-gradient(
      135deg,
      #fff8f9,
      #fff2f4
    );

  color:
    var(--danger);

  padding: 18px;

  border-radius: 12px;

  text-align: center;

  font-size: 14px;

  border: 1px solid #f3d8dc;

}


/* =====================================================
   HORÁRIOS
   ===================================================== */

.horarios {

  display: grid;

  grid-template-columns:
    repeat(
      auto-fill,
      minmax(105px,1fr)
    );

  gap: 10px;

  margin-top: 10px;

}

.horario {

  position: relative;

  padding: 13px 8px;

  min-height: 48px;

  border-radius: 11px;

  background:
    var(--primary-soft);

  color:
    var(--primary-dark);

  border:
    1px solid #efd9e4;

  font-size: 14px;

  font-weight: 700;

  transition:
    all .2s ease;

}

.horario:hover {

  background:
    #f2dce7;

  border-color:
    #dfb8cb;

  transform:
    translateY(-2px);

  box-shadow:
    0 5px 14px rgba(139,49,95,.10);

}

.horario.selecionado {

  background:
    linear-gradient(
      135deg,
      var(--primary-dark),
      var(--primary)
    );

  color: white;

  border-color:
    var(--primary-dark);

  box-shadow:
    0 6px 16px rgba(139,49,95,.25);

  transform:
    translateY(-2px);

}

.horario.ocupado {

  background:
    #f1f0f1;

  color:
    #aaa6aa;

  cursor:
    not-allowed;

  text-decoration:
    line-through;

}

.horario.informacao {

  background:
    var(--accent-soft);

  color:
    #916521;

  border:
    1px dashed #e8ca8f;

  cursor:
    default;

  font-size: 12px;

  grid-column:
    1 / -1;

  text-decoration:
    none;

  font-weight: 600;

  padding: 11px;

}

.horario.informacao:hover {

  transform: none;

  box-shadow: none;

}


/* =====================================================
   AGENDAMENTOS
   ===================================================== */

#listaAgendamentos {

  min-height: 150px;

}

.agendamento {

  position: relative;

  border:
    1px solid var(--border);

  border-left:
    4px solid var(--primary);

  padding: 17px 18px;

  border-radius: 12px;

  margin-bottom: 12px;

  background:
    linear-gradient(
      135deg,
      #fff,
      #fdfbfd
    );

  box-shadow:
    0 2px 8px rgba(45,25,40,.03);

  transition:
    transform .2s ease,
    box-shadow .2s ease;

}

.agendamento:hover {

  transform:
    translateX(2px);

  box-shadow:
    var(--shadow-sm);

}

.agendamento-topo {

  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 12px;

  flex-wrap: wrap;

}

.agendamento strong {

  color:
    var(--primary-dark);

  font-size: 14px;

}

.agendamento-topo strong {

  font-size: 15px;

}

.info {

  margin-top: 8px;

  font-size: 13px;

  color:
    var(--text-light);

  line-height: 1.5;

}

.info strong {

  color:
    var(--text);

  font-size: 13px;

}


/* =====================================================
   CANCELAR
   ===================================================== */

.btn-cancelar {

  background:
    var(--danger-bg);

  color:
    var(--danger);

  padding: 8px 12px;

  border-radius: 9px;

  font-size: 12px;

  font-weight: 700;

  border:
    1px solid #f4d4d8;

}

.btn-cancelar:hover {

  background:
    #ffe1e5;

  border-color:
    #eabac1;

}


/* =====================================================
   MODAL
   ===================================================== */

.modal {

  display: none;

  position: fixed;

  inset: 0;

  background:
    rgba(38,22,32,.68);

  backdrop-filter:
    blur(6px);

  -webkit-backdrop-filter:
    blur(6px);

  z-index: 999;

  padding: 20px;

  overflow-y: auto;

}

.modal.ativo {

  display: flex;

  align-items: flex-start;

  justify-content: center;

}

.modal-conteudo {

  position: relative;

  background:
    rgba(255,255,255,.98);

  width: 100%;

  max-width: 680px;

  margin: 20px auto;

  border-radius: 22px;

  padding: 28px;

  box-shadow:
    var(--shadow-lg);

  border:
    1px solid rgba(255,255,255,.7);

  animation:
    modalEntrada .25s ease;

}

@keyframes modalEntrada {

  from {

    opacity: 0;

    transform:
      translateY(15px) scale(.98);

  }

  to {

    opacity: 1;

    transform:
      translateY(0) scale(1);

  }

}


/* =====================================================
   CABEÇALHO MODAL
   ===================================================== */

.modal-header {

  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 15px;

  margin-bottom: 24px;

  padding-bottom: 18px;

  border-bottom:
    1px solid var(--border);

}

.modal-header h2 {

  margin: 0;

  color:
    var(--primary-dark);

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 25px;

  font-weight: 600;

}

.fechar {

  flex-shrink: 0;

  width: 38px;
  height: 38px;

  border-radius: 11px;

  background:
    #f5eff3;

  color:
    var(--primary-dark);

  font-size: 22px;

  line-height: 1;

}

.fechar:hover {

  background:
    #ead9e3;

  transform:
    rotate(4deg);

}


/* =====================================================
   CAMPOS
   ===================================================== */

.campo {

  margin-bottom: 18px;

}

.campo:last-child {

  margin-bottom: 0;

}

.grid {

  display: grid;

  grid-template-columns:
    repeat(2,1fr);

  gap: 15px;

}


/* =====================================================
   RESUMO
   ===================================================== */

.resumo {

  position: relative;

  background:
    linear-gradient(
      135deg,
      #fbf1f6,
      #f8eaf1
    );

  border:
    1px solid #edd5e1;

  border-radius: 12px;

  padding: 15px 16px;

  margin-top: 15px;

  color:
    var(--primary-dark);

  font-size: 13px;

  line-height: 1.7;

}

.resumo::before {

  content: "✓";

  display: inline-flex;

  align-items: center;

  justify-content: center;

  width: 24px;
  height: 24px;

  margin-right: 7px;

  border-radius: 50%;

  background:
    var(--primary);

  color: white;

  font-weight: 700;

}


/* =====================================================
   AÇÕES MODAL
   ===================================================== */

.acoes {

  display: flex;

  gap: 10px;

  justify-content: flex-end;

  margin-top: 24px;

  padding-top: 20px;

  border-top:
    1px solid var(--border);

}

.btn-secundario {

  background:
    #f1eff1;

  color:
    #555057;

  padding: 12px 18px;

  border-radius: 10px;

  font-weight: 700;

  font-size: 13px;

}

.btn-secundario:hover {

  background:
    #e7e4e7;

}

.btn-salvar {

  background:
    linear-gradient(
      135deg,
      var(--primary-dark),
      var(--primary)
    );

  color: white;

  padding: 12px 21px;

  border-radius: 10px;

  font-weight: 700;

  font-size: 13px;

  box-shadow:
    0 6px 16px rgba(139,49,95,.20);

}

.btn-salvar:hover {

  transform:
    translateY(-1px);

  box-shadow:
    0 9px 20px rgba(139,49,95,.26);

}

.btn-salvar:disabled {

  background:
    #aaa;

  cursor:
    not-allowed;

  box-shadow:
    none;

  transform:
    none;

}


/* =====================================================
   SCROLLBAR
   ===================================================== */

::-webkit-scrollbar {

  width: 8px;

}

::-webkit-scrollbar-track {

  background:
    #f3f1f3;

}

::-webkit-scrollbar-thumb {

  background:
    #c9a9ba;

  border-radius:
    20px;

}

::-webkit-scrollbar-thumb:hover {

  background:
    var(--primary);

}


/* =====================================================
   SELEÇÃO DE TEXTO
   ===================================================== */

::selection {

  background:
    rgba(139,49,95,.20);

  color:
    var(--primary-dark);

}


/* =====================================================
   RESPONSIVO TABLET
   ===================================================== */

@media (max-width: 800px) {

  .container {

    padding:
      0 16px;

  }

  header {

    padding:
      28px 20px 34px;

  }

  header h1 {

    font-size:
      30px;

  }

  .card {

    padding:
      20px;

  }

}


/* =====================================================
   RESPONSIVO CELULAR
   ===================================================== */

@media (max-width: 600px) {

  body {

    background:
      #f7f5f7;

  }

  header {

    padding:
      25px 18px 34px;

  }

  header h1 {

    font-size:
      27px;

  }

  header p {

    font-size:
      13px;

  }

  .container {

    margin:
      -12px auto 35px;

    padding:
      0 12px;

  }

  .topo {

    align-items:
      stretch;

    flex-direction:
      column;

    gap:
      14px;

  }

  .topo h2 {

    font-size:
      23px;

  }

  .topo .btn-principal {

    width:
      100%;

  }

  .card {

    padding:
      17px;

    border-radius:
      14px;

  }

  .card h3 {

    font-size:
      16px;

  }

  .filtro > div {

    max-width:
      none !important;

  }

  .grid {

    grid-template-columns:
      1fr;

    gap:
      0;

  }

  .horarios {

    grid-template-columns:
      repeat(3,1fr);

    gap:
      8px;

  }

  .horario {

    padding:
      12px 5px;

    font-size:
      13px;

  }

  .modal {

    padding:
      8px;

  }

  .modal-conteudo {

    margin:
      4px auto;

    padding:
      20px 16px;

    border-radius:
      18px;

  }

  .modal-header h2 {

    font-size:
      22px;

  }

  .acoes {

    flex-direction:
      column-reverse;

  }

  .acoes button {

    width:
      100%;

  }

  .agendamento {

    padding:
      15px;

  }

}


/* =====================================================
   CELULARES MUITO PEQUENOS
   ===================================================== */

@media (max-width: 380px) {

  .horarios {

    grid-template-columns:
      repeat(2,1fr);

  }

}


/* =====================================================
   REDUÇÃO DE MOVIMENTO
   ===================================================== */

@media (prefers-reduced-motion: reduce) {

  *,
  *::before,
  *::after {

    animation-duration:
      .01ms !important;

    animation-iteration-count:
      1 !important;

    transition-duration:
      .01ms !important;

  }

}

</style>

</head>


<body>


<header>

<h1>Salão Janaina</h1>

<p>Gestão de agenda e atendimento</p>

</header>


<div class="container">


<div class="topo">

<h2>Agenda</h2>

<button
  class="btn-principal"
  onclick="abrirNovoAgendamento()">

  + Novo Agendamento

</button>

</div>


<div
  id="mensagemPrincipal"
  class="mensagem">
</div>


<div class="card">

<h3>Agendamentos do dia</h3>

<div class="filtro">

<div style="width:100%;max-width:250px">

<label for="dataAgenda">
Data
</label>

<input
  type="date"
  id="dataAgenda"
  onchange="carregarAgenda">

</div>

</div>

</div>


<div
  id="listaAgendamentos"
  class="card">

<div class="carregando">
Carregando...
</div>

</div>


</div>


<!-- =====================================================
     MODAL
     ===================================================== -->

<div
  id="modal"
  class="modal">

<div class="modal-conteudo">


<div class="modal-header">

<h2>Novo Agendamento</h2>

<button
  class="fechar"
  onclick="fecharModal()">

  ×

</button>

</div>


<div
  id="mensagemModal"
  class="mensagem">
</div>


<div class="campo">

<label for="cliente">
Nome da cliente *
</label>

<input
  type="text"
  id="cliente"
  placeholder="Digite o nome da cliente">

</div>


<div class="campo">

<label for="whatsapp">
WhatsApp *
</label>

<input
  type="tel"
  id="whatsapp"
  placeholder="(31) 99999-9999">

</div>


<div class="grid">


<div class="campo">

<label for="data">
Data *
</label>

<input
  type="date"
  id="data"
  onchange="atualizarHorarios()">

</div>


<div class="campo">

<label for="servico">
Serviço *
</label>

<select
  id="servico"
  onchange="atualizarHorarios()">

<option value="">
Selecione o serviço
</option>

</select>

</div>

</div>


<div class="campo">

<label>
Horários disponíveis *
</label>

<div
  id="areaHorarios"
  class="horarios">

<div class="carregando">
Selecione a data e o serviço.
</div>

</div>

</div>


<div class="campo">

<label for="observacao">
Observação
</label>

<textarea
  id="observacao"
  placeholder="Observações da cliente..."></textarea>

</div>


<div
  id="resumo"
  class="resumo"
  style="display:none">
</div>


<div class="acoes">

<button
  class="btn-secundario"
  onclick="fecharModal()">

  Cancelar

</button>


<button
  id="btnSalvar"
  class="btn-salvar"
  onclick="salvarAgendamento()">

  Agendar Cliente

</button>

</div>


</div>

</div>


<script>


/* =====================================================
   CONFIGURAÇÃO
   ===================================================== */

const API_URL =
'https://script.google.com/macros/s/AKfycbzGWzCjQsNGfPfFZuRp2Xw3TgqKQ2lslr_bT7sS2_p7YZOqhF_zwTU5KCl_jGqGYrZj/exec';


const NOME_SALAO =
'Salão Janaina';


const INICIO_EXPEDIENTE =
8 * 60;


const FIM_EXPEDIENTE =
18 * 60;


let servicos = [];

let agendamentosDoDia = [];

let horarioSelecionado = '';

let servicoSelecionado = null;


/* =====================================================
   INICIALIZAÇÃO
   ===================================================== */

document.addEventListener(
  'DOMContentLoaded',
  async function() {

    const hoje =
      obterDataHoje();

    document.getElementById(
      'dataAgenda'
    ).value = hoje;

    document.getElementById(
      'dataAgenda'
    ).min = hoje;

    document.getElementById(
      'data'
    ).min = hoje;

    await carregarServicos();

    carregarAgenda();

  }
);


/* =====================================================
   DATA
   ===================================================== */

function obterDataHoje() {

  const agora = new Date();

  return (
    agora.getFullYear() +
    '-' +
    String(
      agora.getMonth() + 1
    ).padStart(2,'0') +
    '-' +
    String(
      agora.getDate()
    ).padStart(2,'0')
  );

}


/* =====================================================
   MODAL
   ===================================================== */

async function abrirNovoAgendamento() {

  limparFormulario();

  const dataAgenda =
    document.getElementById(
      'dataAgenda'
    ).value;

  document.getElementById(
    'data'
  ).value =
    dataAgenda ||
    obterDataHoje();

  document.getElementById(
    'modal'
  ).classList.add('ativo');

  if (servicos.length === 0) {

    await carregarServicos();

  }

  atualizarHorarios();

}


function fecharModal() {

  document.getElementById(
    'modal'
  ).classList.remove('ativo');

}


function limparFormulario() {

  document.getElementById(
    'cliente'
  ).value = '';

  document.getElementById(
    'whatsapp'
  ).value = '';

  document.getElementById(
    'observacao'
  ).value = '';

  document.getElementById(
    'servico'
  ).value = '';

  horarioSelecionado = '';

  servicoSelecionado = null;

  document.getElementById(
    'resumo'
  ).style.display = 'none';

  document.getElementById(
    'areaHorarios'
  ).innerHTML =
    '<div class="carregando">' +
    'Selecione a data e o serviço.' +
    '</div>';

  esconderMensagem(
    'mensagemModal'
  );

}


/* =====================================================
   SERVIÇOS
   ===================================================== */

async function carregarServicos() {

  try {

    const resposta =
      await fetch(
        API_URL +
        '?acao=servicos&_=' +
        Date.now(),
        {
          cache: 'no-store'
        }
      );

    if (!resposta.ok) {

      throw new Error(
        'HTTP ' +
        resposta.status
      );

    }

    const dados =
      await resposta.json();

    let lista = dados;

    if (
      dados &&
      Array.isArray(
        dados.servicos
      )
    ) {

      lista =
        dados.servicos;

    }

    if (
      !Array.isArray(lista)
    ) {

      throw new Error(
        'Resposta inválida dos serviços.'
      );

    }

    servicos =
      lista.map(
        function(item) {

          return {

            id:
              String(
                item.id || ''
              ),

            nome:
              String(
                item.nome ||
                item.servico ||
                ''
              ),

            duracao:
              Number(
                item.duracao
              ),

            preco:
              Number(
                item.preco || 0
              )

          };

        }
      )
      .filter(
        function(item) {

          return (
            item.id &&
            item.nome &&
            Number.isFinite(
              item.duracao
            ) &&
            item.duracao > 0
          );

        }
      );

    preencherSelectServicos();

  } catch (erro) {

    console.error(erro);

    mostrarMensagem(
      'mensagemModal',
      'Erro ao carregar serviços: ' +
      erro.message,
      'erro'
    );

  }

}


function preencherSelectServicos() {

  const select =
    document.getElementById(
      'servico'
    );

  select.innerHTML =
    '<option value="">' +
    'Selecione o serviço' +
    '</option>';

  servicos.forEach(
    function(servico) {

      const option =
        document.createElement(
          'option'
        );

      option.value =
        servico.id;

      let texto =
        servico.nome +
        ' - ' +
        servico.duracao +
        ' min';

      if (
        servico.preco > 0
      ) {

        texto +=
          ' - R$ ' +
          servico.preco
            .toFixed(2)
            .replace('.',',');

      }

      option.textContent =
        texto;

      select.appendChild(
        option
      );

    }
  );

}


/* =====================================================
   HORÁRIOS
   ===================================================== */

async function atualizarHorarios() {

  horarioSelecionado = '';

  servicoSelecionado = null;

  document.getElementById(
    'resumo'
  ).style.display = 'none';

  const data =
    document.getElementById(
      'data'
    ).value;

  const servicoId =
    document.getElementById(
      'servico'
    ).value;

  const area =
    document.getElementById(
      'areaHorarios'
    );

  if (!data) {

    area.innerHTML =
      '<div class="carregando">' +
      'Selecione uma data.' +
      '</div>';

    return;

  }

  if (!servicoId) {

    area.innerHTML =
      '<div class="carregando">' +
      'Selecione o serviço.' +
      '</div>';

    return;

  }

  const servico =
    servicos.find(
      function(item) {

        return String(item.id) ===
          String(servicoId);

      }
    );

  if (!servico) {

    return;

  }

  servicoSelecionado =
    servico;

  area.innerHTML =
    '<div class="carregando">' +
    'Calculando horários...' +
    '</div>';

  try {

    const agendamentos =
      await buscarAgendamentos(
        data
      );

    agendamentosDoDia =
      agendamentos;

    renderizarHorarios(
      servico,
      agendamentos
    );

  } catch (erro) {

    area.innerHTML =
      '<div class="sem-horarios">' +
      'Erro ao carregar horários.<br><br>' +
      escapeHtml(
        erro.message
      ) +
      '</div>';

  }

}


/* =====================================================
   RENDERIZA HORÁRIOS
   ===================================================== */

function renderizarHorarios(
  servico,
  agendamentos
) {

  const area =
    document.getElementById(
      'areaHorarios'
    );

  const duracao =
    Number(
      servico.duracao
    );

  const possiveis = [];

  let cursor =
    INICIO_EXPEDIENTE;

  const agenda =
    agendamentos
      .map(
        function(item) {

          const inicio =
            horaParaMinutos(
              item.hora
            );

          const d =
            Number(
              item.duracao
            );

          return {

            inicio: inicio,

            fim:
              inicio +
              d

          };

        }
      )
      .filter(
        function(item) {

          return (
            item.inicio >= 0 &&
            item.fim > item.inicio
          );

        }
      )
      .sort(
        function(a,b) {

          return a.inicio -
            b.inicio;

        }
      );

  while (
    cursor +
    duracao <=
    FIM_EXPEDIENTE
  ) {

    const conflito =
      encontrarConflito(
        cursor,
        cursor + duracao,
        agenda
      );

    if (!conflito) {

      possiveis.push({
        inicio: cursor,
        fim:
          cursor + duracao
      });

      cursor += duracao;

    } else {

      cursor =
        Math.max(
          cursor + 1,
          conflito.fim
        );

    }

  }

  const unicos = [];

  possiveis.forEach(
    function(item) {

      const existe =
        unicos.some(
          function(x) {

            return x.inicio ===
              item.inicio;

          }
        );

      if (!existe) {

        unicos.push(item);

      }

    }
  );

  if (unicos.length === 0) {

    area.innerHTML =
      '<div class="sem-horarios">' +
      'Não há horários disponíveis para este serviço nesta data.' +
      '</div>';

    return;

  }

  area.innerHTML = '';

  const info =
    document.createElement(
      'div'
    );

  info.className =
    'horario informacao';

  info.textContent =
    'Duração do serviço: ' +
    duracao +
    ' minutos';

  area.appendChild(info);

  unicos.forEach(
    function(item) {

      const botao =
        document.createElement(
          'button'
        );

      botao.type =
        'button';

      botao.className =
        'horario';

      botao.textContent =
        minutosParaHora(
          item.inicio
        );

      botao.title =
        'Término previsto: ' +
        minutosParaHora(
          item.fim
        );

      botao.onclick =
        function() {

          selecionarHorario(
            minutosParaHora(
              item.inicio
            ),
            botao
          );

        };

      area.appendChild(
        botao
      );

    }
  );

}


function encontrarConflito(
  inicio,
  fim,
  agenda
) {

  return agenda.find(
    function(item) {

      return (
        inicio < item.fim &&
        fim > item.inicio
      );

    }
  ) || null;

}


/* =====================================================
   SELECIONAR HORÁRIO
   ===================================================== */

function selecionarHorario(
  hora,
  botao
) {

  document
    .querySelectorAll(
      '#areaHorarios .horario'
    )
    .forEach(
      function(item) {

        item.classList.remove(
          'selecionado'
        );

      }
    );

  botao.classList.add(
    'selecionado'
  );

  horarioSelecionado =
    hora;

  atualizarResumo();

}

/* =====================================================
   SALVAR + WHATSAPP
   ===================================================== */

async function salvarAgendamento() {

  const cliente =
    document.getElementById(
      'cliente'
    ).value.trim();

  const whatsapp =
    document.getElementById(
      'whatsapp'
    ).value.trim();

  const data =
    document.getElementById(
      'data'
    ).value;

  const servicoId =
    document.getElementById(
      'servico'
    ).value;

  const observacao =
    document.getElementById(
      'observacao'
    ).value.trim();


  if (!cliente) {

    mostrarMensagem(
      'mensagemModal',
      'Informe o nome da cliente.',
      'erro'
    );

    return;

  }

  if (!whatsapp) {

    mostrarMensagem(
      'mensagemModal',
      'Informe o WhatsApp.',
      'erro'
    );

    return;

  }

  if (!data) {

    mostrarMensagem(
      'mensagemModal',
      'Informe a data.',
      'erro'
    );

    return;

  }

  if (!servicoId) {

    mostrarMensagem(
      'mensagemModal',
      'Selecione o serviço.',
      'erro'
    );

    return;

  }

  if (!horarioSelecionado) {

    mostrarMensagem(
      'mensagemModal',
      'Selecione um horário.',
      'erro'
    );

    return;

  }


  const servico =
    servicos.find(
      function(item) {

        return String(item.id) ===
          String(servicoId);

      }
    );


  if (!servico) {

    mostrarMensagem(
      'mensagemModal',
      'Serviço inválido.',
      'erro'
    );

    return;

  }


  let janelaWhatsApp = null;


  janelaWhatsApp =
    window.open(
      'about:blank',
      '_blank'
    );


  const btn =
    document.getElementById(
      'btnSalvar'
    );

  btn.disabled =
    true;

  btn.textContent =
    'Verificando...';


  try {

    const agendaAtual =
      await buscarAgendamentos(
        data
      );


    const inicioNovo =
      horaParaMinutos(
        horarioSelecionado
      );

    const fimNovo =
      inicioNovo +
      Number(
        servico.duracao
      );


    const conflito =
      encontrarConflito(
        inicioNovo,
        fimNovo,
        agendaAtual.map(
          function(item) {

            const inicio =
              horaParaMinutos(
                item.hora
              );

            const duracao =
              Number(
                item.duracao
              );

            return {

              inicio: inicio,

              fim:
                inicio +
                duracao

            };

          }
        )
      );


    if (conflito) {

      throw new Error(
        'Este horário não está mais disponível. Escolha outro.'
      );

    }


    btn.textContent =
      'Agendando...';


    const dados = {

      acao:
        'agendar',

      cliente:
        cliente,

      whatsapp:
        whatsapp,

      data:
        data,

      hora:
        horarioSelecionado,

      servico:
        servico.nome,

      servicoId:
        servico.id,

      duracao:
        Number(
          servico.duracao
        ),

      observacao:
        observacao

    };


    const resposta =
      await fetch(
        API_URL,
        {

          method:
            'POST',

          headers: {

            'Content-Type':
              'text/plain;charset=utf-8'

          },

          body:
            JSON.stringify(
              dados
            )

        }
      );


    if (!resposta.ok) {

      throw new Error(
        'HTTP ' +
        resposta.status
      );

    }


    const resultado =
      await resposta.json();


    if (
      !resultado.sucesso
    ) {

      throw new Error(
        resultado.erro ||
        'Não foi possível realizar o agendamento.'
      );

    }


    const dataFormatada =
      formatarDataBR(data);


    const termino =
      minutosParaHora(
        inicioNovo +
        Number(
          servico.duracao
        )
      );


    let mensagem =

      'Olá, ' +
      cliente +
      '! 💕\n\n' +

      'Seu agendamento no ' +
      NOME_SALAO +
      ' foi realizado com sucesso! ✨\n\n' +

      '📅 *Data:* ' +
      dataFormatada +
      '\n' +

      '🕐 *Horário:* ' +
      horarioSelecionado +
      '\n' +

      '⏰ *Término previsto:* ' +
      termino +
      '\n' +

      '💅 *Serviço:* ' +
      servico.nome +
      '\n' +

      '⏱️ *Duração:* ' +
      servico.duracao +
      ' minutos';


    if (
      servico.preco > 0
    ) {

      mensagem +=
        '\n' +
        '💰 *Valor:* R$ ' +
        servico.preco
          .toFixed(2)
          .replace('.',',');

    }


    if (observacao) {

      mensagem +=
        '\n\n' +
        '📝 *Observação:* ' +
        observacao;

    }


    mensagem +=

      '\n\n' +

      'Até lá! 💖\n' +

      NOME_SALAO;


    const numero =
      prepararWhatsApp(
        whatsapp
      );


    if (!numero) {

      if (janelaWhatsApp) {

        janelaWhatsApp.close();

      }

      mostrarMensagem(
        'mensagemPrincipal',
        'Agendamento realizado, mas o WhatsApp informado é inválido.',
        'erro'
      );

    } else {

      const urlWhatsApp =
        'https://wa.me/' +
        numero +
        '?text=' +
        encodeURIComponent(
          mensagem
        );


      if (janelaWhatsApp) {

        janelaWhatsApp.location.href =
          urlWhatsApp;

      } else {

        window.location.href =
          urlWhatsApp;

      }

    }


    mostrarMensagem(
      'mensagemPrincipal',
      'Agendamento realizado com sucesso.',
      'sucesso'
    );


    fecharModal();


    document.getElementById(
      'dataAgenda'
    ).value =
      data;


    carregarAgenda();


  } catch (erro) {

    console.error(
      'Erro ao salvar:',
      erro
    );


    if (janelaWhatsApp) {

      janelaWhatsApp.close();

    }


    mostrarMensagem(
      'mensagemModal',
      erro.message ||
      'Erro ao realizar agendamento.',
      'erro'
    );


  } finally {

    btn.disabled =
      false;

    btn.textContent =
      'Agendar Cliente';

  }

}


/* =====================================================
   WHATSAPP
   ===================================================== */

function prepararWhatsApp(
  numero
) {

  let telefone =
    String(
      numero || ''
    ).replace(
      /\D/g,
      ''
    );


  if (!telefone) {

    return '';

  }


  if (
    telefone.length === 10 ||
    telefone.length === 11
  ) {

    telefone =
      '55' +
      telefone;

  }


  if (
    telefone.startsWith('55') &&
    (
      telefone.length === 12 ||
      telefone.length === 13
    )
  ) {

    return telefone;

  }


  return '';

}


/* =====================================================
   AGENDA
   ===================================================== */

async function buscarAgendamentos(
  data
) {

  const url =
    API_URL +
    '?acao=agendamentos' +
    '&data=' +
    encodeURIComponent(data) +
    '&_=' +
    Date.now();


  const resposta =
    await fetch(
      url,
      {
        cache: 'no-store'
      }
    );


  if (!resposta.ok) {

    throw new Error(
      'HTTP ' +
      resposta.status
    );

  }


  const dados =
    await resposta.json();


  if (
    Array.isArray(dados)
  ) {

    return dados;

  }


  if (
    dados &&
    Array.isArray(
      dados.agendamentos
    )
  ) {

    return dados.agendamentos;

  }


  throw new Error(
    'Resposta inválida dos agendamentos.'
  );

}


async function carregarAgenda() {

  const data =
    document.getElementById(
      'dataAgenda'
    ).value;


  const area =
    document.getElementById(
      'listaAgendamentos'
    );


  if (!data) {

    return;

  }


  area.innerHTML =
    '<div class="carregando">' +
    'Carregando agendamentos...' +
    '</div>';


  try {

    const dados =
      await buscarAgendamentos(
        data
      );

    renderizarAgenda(
      dados
    );

  } catch (erro) {

    area.innerHTML =
      '<div class="sem-horarios">' +
      'Erro ao carregar a agenda.<br><br>' +
      '<small>' +
      escapeHtml(
        erro.message
      ) +
      '</small>' +
      '</div>';

  }

}


function renderizarAgenda(
  agendamentos
) {

  const area =
    document.getElementById(
      'listaAgendamentos'
    );


  if (
    !agendamentos ||
    agendamentos.length === 0
  ) {

    area.innerHTML =
      '<h3>Agendamentos do dia</h3>' +
      '<div class="carregando">' +
      'Nenhum agendamento para esta data.' +
      '</div>';

    return;

  }


  agendamentos.sort(
    function(a,b) {

      return (
        horaParaMinutos(a.hora) -
        horaParaMinutos(b.hora)
      );

    }
  );


  let html =
    '<h3>Agendamentos do dia</h3>';


  agendamentos.forEach(
    function(item) {

      const inicio =
        horaParaMinutos(
          item.hora
        );


      const duracao =
        Number(
          item.duracao || 0
        );


      const fim =
        inicio +
        duracao;


      html +=

        '<div class="agendamento">' +

        '<div class="agendamento-topo">' +

        '<div>' +

        '<strong>' +

        escapeHtml(
          item.hora
        ) +

        ' - ' +

        escapeHtml(
          item.cliente
        ) +

        '</strong>' +

        '</div>' +

        '<button ' +
        'class="btn-cancelar" ' +
        'onclick="cancelarAgendamento(\'' +
        escapeHtmlJS(item.id) +
        '\')">' +

        'Cancelar' +

        '</button>' +

        '</div>' +

        '<div class="info">' +

        '<strong>Serviço:</strong> ' +

        escapeHtml(
          item.servico
        ) +

        ' (' +

        duracao +

        ' min)' +

        '</div>' +

        '<div class="info">' +

        '<strong>Horário:</strong> ' +

        escapeHtml(
          item.hora
        ) +

        ' até ' +

        minutosParaHora(
          fim
        ) +

        '</div>' +

        '<div class="info">' +

        '<strong>WhatsApp:</strong> ' +

        escapeHtml(
          item.whatsapp
        ) +

        '</div>' +

        (
          item.observacao
          ?
          '<div class="info">' +
          '<strong>Observação:</strong> ' +
          escapeHtml(
            item.observacao
          ) +
          '</div>'
          :
          ''
        ) +

        '</div>';

    }
  );


  area.innerHTML =
    html;

}


/* =====================================================
   CANCELAR
   ===================================================== */

async function cancelarAgendamento(
  id
) {

  if (
    !confirm(
      'Deseja realmente cancelar este agendamento?'
    )
  ) {

    return;

  }


  try {

    const resposta =
      await fetch(
        API_URL,
        {

          method:
            'POST',

          headers: {

            'Content-Type':
              'text/plain;charset=utf-8'

          },

          body:
            JSON.stringify({

              acao:
                'cancelar',

              id:
                id

            })

        }
      );


    const resultado =
      await resposta.json();


    if (
      !resultado.sucesso
    ) {

      throw new Error(
        resultado.erro ||
        'Erro ao cancelar.'
      );

    }


    mostrarMensagem(
      'mensagemPrincipal',
      'Agendamento cancelado com sucesso.',
      'sucesso'
    );


    carregarAgenda();


  } catch (erro) {

    mostrarMensagem(
      'mensagemPrincipal',
      erro.message,
      'erro'
    );

  }

}


/* =====================================================
   UTILITÁRIOS
   ===================================================== */

function horaParaMinutos(
  hora
) {

  if (!hora) {

    return -1;

  }


  const partes =
    String(
      hora
    ).split(':');


  if (
    partes.length < 2
  ) {

    return -1;

  }


  const h =
    Number(
      partes[0]
    );

  const m =
    Number(
      partes[1]
    );


  if (
    !Number.isFinite(h) ||
    !Number.isFinite(m)
  ) {

    return -1;

  }


  return h * 60 + m;

}


function minutosParaHora(
  minutos
) {

  const valor =
    Number(
      minutos
    );


  if (
    !Number.isFinite(valor)
  ) {

    return '';

  }


  return (
    String(
      Math.floor(
        valor / 60
      )
    ).padStart(2,'0') +
    ':' +
    String(
      valor % 60
    ).padStart(2,'0')
  );

}


function formatarDataBR(
  data
) {

  const partes =
    String(
      data
    ).split('-');


  if (
    partes.length !== 3
  ) {

    return data;

  }


  return (
    partes[2] +
    '/' +
    partes[1] +
    '/' +
    partes[0]
  );

}


function mostrarMensagem(
  id,
  texto,
  tipo
) {

  const elemento =
    document.getElementById(
      id
    );


  if (!elemento) {

    return;

  }


  elemento.textContent =
    texto;

  elemento.className =
    'mensagem ' +
    tipo;


  setTimeout(
    function() {

      esconderMensagem(
        id
      );

    },
    5000
  );


}


function esconderMensagem(
  id
) {

  const elemento =
    document.getElementById(
      id
    );


  if (!elemento) {

    return;

  }


  elemento.className =
    'mensagem';

  elemento.textContent =
    '';

}


function escapeHtml(
  texto
) {

  return String(
    texto || ''
  )

  .replace(
    /&/g,
    '&amp;'
  )

  .replace(
    /</g,
    '&lt;'
  )

  .replace(
    />/g,
    '&gt;'
  )

  .replace(
    /"/g,
    '&quot;'
  )

  .replace(
    /'/g,
    '&#039;'
  );

}


function escapeHtmlJS(
  texto
) {

  return String(
    texto || ''
  )

  .replace(
    /\\/g,
    '\\\\'
  )

  .replace(
    /'/g,
    "\\'"
  )

  .replace(
    /"/g,
    '\\"'
  );

}

document
  .getElementById(
    'modal'
  )
  .addEventListener(
    'click',
    function(event) {

      if (
        event.target === this
      ) {

        fecharModal();

      }

    }
  );
