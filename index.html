<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Agenda - Salão Janaina</title>

<style>

/* =====================================================
   RESET / BASE
   ===================================================== */

* {
  box-sizing: border-box;
}

:root {
  --primary: #8e4168;
  --primary-dark: #68304d;
  --primary-light: #c66d9c;
  --pink-soft: #f8edf3;
  --pink-light: #fdf7fa;
  --text: #2f2930;
  --text-soft: #746d73;
  --border: #eadfe5;
  --white: #ffffff;
  --success-bg: #eaf8ef;
  --success: #18713a;
  --error-bg: #fff0f0;
  --error: #a52222;
  --shadow-sm: 0 4px 16px rgba(76, 32, 56, .06);
  --shadow-md: 0 12px 35px rgba(76, 32, 56, .10);
  --shadow-lg: 0 24px 70px rgba(43, 20, 34, .18);
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    Helvetica,
    sans-serif;
  background:
    radial-gradient(
      circle at top left,
      rgba(198,109,156,.12),
      transparent 32%
    ),
    linear-gradient(
      135deg,
      #fbf8fa 0%,
      #f8f4f7 50%,
      #f5f0f4 100%
    );
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}

button,
input,
select,
textarea {
  font-family: inherit;
}

button {
  border: 0;
  cursor: pointer;
}

button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline: 3px solid rgba(198,109,156,.22);
  outline-offset: 2px;
}


/* =====================================================
   HEADER
   ===================================================== */

header {
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(
      circle at 15% 20%,
      rgba(255,255,255,.16),
      transparent 28%
    ),
    radial-gradient(
      circle at 85% 80%,
      rgba(255,255,255,.10),
      transparent 30%
    ),
    linear-gradient(
      135deg,
      #67304d 0%,
      #8e4168 48%,
      #c66d9c 100%
    );
  color: white;
  padding: 34px 20px 38px;
  text-align: center;
  box-shadow:
    0 8px 30px rgba(72, 29, 52, .18);
}

header::before {
  content: "";
  position: absolute;
  width: 260px;
  height: 260px;
  right: -90px;
  top: -150px;
  border-radius: 50%;
  background: rgba(255,255,255,.08);
}

header::after {
  content: "";
  position: absolute;
  width: 180px;
  height: 180px;
  left: -80px;
  bottom: -130px;
  border-radius: 50%;
  background: rgba(255,255,255,.06);
}

header h1 {
  position: relative;
  z-index: 1;
  margin: 0;
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(30px, 5vw, 42px);
  font-weight: 600;
  letter-spacing: -.5px;
}

header p {
  position: relative;
  z-index: 1;
  margin: 8px 0 0;
  color: rgba(255,255,255,.88);
  font-size: 14px;
  letter-spacing: .7px;
}


/* =====================================================
   CONTAINER
   ===================================================== */

.container {
  position: relative;
  width: 100%;
  max-width: 1120px;
  margin: 0 auto;
  padding: 30px 20px 60px;
}


/* =====================================================
   TOPO
   ===================================================== */

.topo {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  margin-bottom: 24px;
}

.topo h2 {
  margin: 0;
  color: var(--primary-dark);
  font-family: Georgia, "Times New Roman", serif;
  font-size: 30px;
  font-weight: 600;
}

.topo h2::after {
  content: "";
  display: block;
  width: 42px;
  height: 3px;
  margin-top: 8px;
  border-radius: 10px;
  background: linear-gradient(
    90deg,
    var(--primary),
    var(--primary-light)
  );
}


/* =====================================================
   BOTÕES
   ===================================================== */

.btn-principal {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 48px;
  padding: 13px 20px;
  border-radius: 12px;
  background:
    linear-gradient(
      135deg,
      var(--primary),
      var(--primary-light)
    );
  color: white;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: .1px;
  box-shadow:
    0 8px 20px rgba(142,65,104,.22);
  transition:
    transform .2s ease,
    box-shadow .2s ease,
    filter .2s ease;
}

.btn-principal:hover {
  transform: translateY(-2px);
  box-shadow:
    0 12px 26px rgba(142,65,104,.28);
  filter: brightness(.98);
}

.btn-principal:active {
  transform: translateY(0);
}


/* =====================================================
   CARDS
   ===================================================== */

.card {
  position: relative;
  background: rgba(255,255,255,.92);
  border: 1px solid rgba(234,223,229,.85);
  border-radius: 18px;
  padding: 24px;
  margin-bottom: 20px;
  box-shadow: var(--shadow-sm);
  backdrop-filter: blur(10px);
}

.card h3 {
  margin: 0 0 20px;
  color: var(--primary-dark);
  font-size: 17px;
  font-weight: 700;
}

.card h3::before {
  content: "";
  display: inline-block;
  width: 4px;
  height: 18px;
  margin-right: 9px;
  vertical-align: -3px;
  border-radius: 5px;
  background: linear-gradient(
    180deg,
    var(--primary-light),
    var(--primary)
  );
}


/* =====================================================
   FILTRO
   ===================================================== */

.filtro {
  display: flex;
  align-items: flex-end;
  gap: 15px;
  flex-wrap: wrap;
}

.filtro > div {
  width: 100%;
  max-width: 280px !important;
}


/* =====================================================
   LABEL
   ===================================================== */

label {
  display: block;
  margin-bottom: 8px;
  color: #504950;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .3px;
  text-transform: uppercase;
}


/* =====================================================
   CAMPOS
   ===================================================== */

input,
select,
textarea {
  width: 100%;
  padding: 13px 14px;
  border: 1px solid var(--border);
  border-radius: 11px;
  outline: none;
  background: #fff;
  color: var(--text);
  font-size: 14px;
  transition:
    border-color .2s ease,
    box-shadow .2s ease,
    background .2s ease;
}

input::placeholder,
textarea::placeholder {
  color: #aaa2a8;
}

input:hover,
select:hover,
textarea:hover {
  border-color: #d9c7d1;
}

input:focus,
select:focus,
textarea:focus {
  border-color: var(--primary-light);
  background: #fff;
  box-shadow:
    0 0 0 4px rgba(198,109,156,.10);
}

input[type="date"] {
  color-scheme: light;
}

textarea {
  min-height: 100px;
  resize: vertical;
  line-height: 1.5;
}

.campo {
  margin-bottom: 18px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 18px;
}


/* =====================================================
   HORÁRIOS
   ===================================================== */

.horarios {
  display: grid;
  grid-template-columns:
    repeat(auto-fill, minmax(105px, 1fr));
  gap: 10px;
  margin-top: 10px;
}

.horario {
  min-height: 48px;
  padding: 12px 8px;
  border-radius: 11px;
  background: var(--pink-soft);
  color: var(--primary-dark);
  border: 1px solid #efd9e5;
  font-size: 14px;
  font-weight: 700;
  transition:
    transform .18s ease,
    background .18s ease,
    border-color .18s ease,
    box-shadow .18s ease;
}

.horario:hover {
  transform: translateY(-1px);
  background: #f2dce8;
  border-color: #dcaec5;
  box-shadow:
    0 5px 12px rgba(142,65,104,.10);
}

.horario.selecionado {
  background:
    linear-gradient(
      135deg,
      var(--primary-dark),
      var(--primary)
    );
  color: white;
  border-color: var(--primary);
  box-shadow:
    0 7px 18px rgba(142,65,104,.22);
}

.horario.ocupado {
  background: #f1f0f1;
  color: #aaa5a8;
  border-color: #e7e4e6;
  cursor: not-allowed;
  text-decoration: line-through;
  box-shadow: none;
}

.horario.informacao {
  min-height: auto;
  padding: 10px 13px;
  background: #fff9fc;
  color: var(--primary);
  border: 1px dashed #d9a8c0;
  cursor: default;
  font-size: 12px;
  grid-column: 1 / -1;
  text-decoration: none;
  text-align: left;
}

.horario.informacao:hover {
  transform: none;
  background: #fff9fc;
  border-color: #d9a8c0;
  box-shadow: none;
}


/* =====================================================
   MENSAGENS
   ===================================================== */

.mensagem {
  padding: 13px 15px;
  border-radius: 11px;
  margin-bottom: 18px;
  display: none;
  font-size: 14px;
  line-height: 1.5;
  border: 1px solid transparent;
}

.mensagem.erro {
  display: block;
  background: var(--error-bg);
  color: var(--error);
  border-color: #f4cccc;
}

.mensagem.sucesso {
  display: block;
  background: var(--success-bg);
  color: var(--success);
  border-color: #c8ead3;
}

.carregando {
  text-align: center;
  color: var(--text-soft);
  padding: 25px 15px;
  font-size: 14px;
}

.sem-horarios {
  background: #fff5f5;
  color: #a33;
  padding: 16px;
  border: 1px solid #f1d5d5;
  border-radius: 11px;
  text-align: center;
  font-size: 14px;
}


/* =====================================================
   AGENDA
   ===================================================== */

.agendamento {
  position: relative;
  border: 1px solid #eee5e9;
  border-left: 4px solid var(--primary);
  padding: 17px;
  border-radius: 13px;
  margin-bottom: 12px;
  background:
    linear-gradient(
      135deg,
      #fff 0%,
      #fdf9fb 100%
    );
  transition:
    transform .18s ease,
    box-shadow .18s ease,
    border-color .18s ease;
}

.agendamento:hover {
  transform: translateY(-1px);
  border-color: #e5d2dc;
  box-shadow:
    0 8px 22px rgba(76,32,56,.07);
}

.agendamento:last-child {
  margin-bottom: 0;
}

.agendamento-topo {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.agendamento strong {
  color: var(--primary-dark);
}

.agendamento-topo strong {
  font-size: 15px;
}

.info {
  margin-top: 8px;
  font-size: 13px;
  line-height: 1.5;
  color: var(--text-soft);
}

.info strong {
  color: #514950;
}

.btn-cancelar {
  background: #fff0f0;
  color: #a00000;
  padding: 8px 12px;
  border: 1px solid #f4d4d4;
  border-radius: 9px;
  font-size: 12px;
  font-weight: 700;
  transition:
    background .18s ease,
    transform .18s ease;
}

.btn-cancelar:hover {
  background: #ffe0e0;
  transform: translateY(-1px);
}


/* =====================================================
   MODAL
   ===================================================== */

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background:
    rgba(36, 18, 29, .68);
  z-index: 999;
  padding: 20px;
  overflow-y: auto;
  backdrop-filter: blur(5px);
}

.modal.ativo {
  display: flex;
  align-items: flex-start;
  justify-content: center;
}

.modal-conteudo {
  position: relative;
  background:
    linear-gradient(
      180deg,
      #fff 0%,
      #fffafd 100%
    );
  width: 100%;
  max-width: 680px;
  margin: 25px auto;
  border: 1px solid rgba(255,255,255,.5);
  border-radius: 22px;
  padding: 28px;
  box-shadow: var(--shadow-lg);
  animation: aparecerModal .22s ease-out;
}

@keyframes aparecerModal {
  from {
    opacity: 0;
    transform: translateY(15px) scale(.98);
  }

  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 25px;
  padding-bottom: 18px;
  border-bottom: 1px solid #eee3e9;
}

.modal-header h2 {
  margin: 0;
  color: var(--primary-dark);
  font-family: Georgia, "Times New Roman", serif;
  font-size: 25px;
  font-weight: 600;
}

.fechar {
  flex: 0 0 auto;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: #f5e9ef;
  color: var(--primary-dark);
  font-size: 22px;
  line-height: 1;
  transition:
    background .18s ease,
    transform .18s ease;
}

.fechar:hover {
  background: #ead7e1;
  transform: rotate(90deg);
}

.resumo {
  background:
    linear-gradient(
      135deg,
      #fbf0f6,
      #fff8fb
    );
  border: 1px solid #efd9e5;
  border-radius: 12px;
  padding: 14px;
  margin-top: 15px;
  color: var(--primary-dark);
  font-size: 13px;
  line-height: 1.65;
}

.acoes {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  margin-top: 25px;
  padding-top: 20px;
  border-top: 1px solid #eee3e9;
}

.btn-secundario {
  background: #f1eff0;
  color: #4d484b;
  padding: 12px 18px;
  border: 1px solid #e5e0e3;
  border-radius: 10px;
  font-weight: 700;
  transition:
    background .18s ease,
    transform .18s ease;
}

.btn-secundario:hover {
  background: #e8e4e6;
  transform: translateY(-1px);
}

.btn-salvar {
  background:
    linear-gradient(
      135deg,
      var(--primary-dark),
      var(--primary)
    );
  color: white;
  padding: 12px 20px;
  border-radius: 10px;
  font-weight: 700;
  box-shadow:
    0 7px 18px rgba(142,65,104,.18);
  transition:
    transform .18s ease,
    box-shadow .18s ease,
    filter .18s ease;
}

.btn-salvar:hover {
  transform: translateY(-1px);
  box-shadow:
    0 10px 22px rgba(142,65,104,.25);
  filter: brightness(.98);
}

.btn-salvar:disabled {
  background: #aaa;
  box-shadow: none;
  cursor: not-allowed;
  transform: none;
}


/* =====================================================
   RESPONSIVO
   ===================================================== */

@media (max-width: 760px) {

  header {
    padding: 28px 18px 32px;
  }

  .container {
    padding:
      22px 14px 45px;
  }

  .topo {
    align-items: stretch;
    flex-direction: column;
    gap: 15px;
  }

  .topo h2 {
    font-size: 27px;
  }

  .topo .btn-principal {
    width: 100%;
  }

  .card {
    padding: 18px;
    border-radius: 15px;
  }

  .grid {
    grid-template-columns: 1fr;
    gap: 0;
  }

  .modal {
    padding: 10px;
  }

  .modal-conteudo {
    margin: 5px auto;
    padding: 20px 17px;
    border-radius: 17px;
  }

  .modal-header h2 {
    font-size: 22px;
  }

  .acoes {
    flex-direction: column-reverse;
  }

  .acoes button {
    width: 100%;
  }

}

@media (max-width: 480px) {

  header h1 {
    font-size: 31px;
  }

  header p {
    font-size: 13px;
  }

  .horarios {
    grid-template-columns:
      repeat(3, 1fr);
    gap: 8px;
  }

  .horario {
    min-height: 44px;
    padding: 10px 5px;
    font-size: 13px;
  }

  .horario.informacao {
    font-size: 11px;
  }

  .agendamento {
    padding: 14px;
  }

  .agendamento-topo {
    align-items: flex-start;
  }

  .btn-cancelar {
    width: 100%;
  }

}


/* =====================================================
   BARRA DE ROLAGEM
   ===================================================== */

::-webkit-scrollbar {
  width: 9px;
}

::-webkit-scrollbar-track {
  background: #f5f0f3;
}

::-webkit-scrollbar-thumb {
  background: #cda1b7;
  border-radius: 20px;
}

::-webkit-scrollbar-thumb:hover {
  background: #a96b8c;
}

</style>

</head>


<body>


<header>

<h1>Salão Janaina</h1>

<p>Agenda de clientes</p>

</header>


<div class="container">


<div class="topo">

<h2>Agenda</h2>

<button
  class="btn-principal"
  onclick="abrirNovoAgendamento()">

  + Novo Agendamento

</button>

</div>


<div
  id="mensagemPrincipal"
  class="mensagem">
</div>


<div class="card">

<h3>Agendamentos do dia</h3>

<div class="filtro">

<div style="width:100%;max-width:250px">

<label for="dataAgenda">
Data
</label>

<input
  type="date"
  id="dataAgenda"
  onchange="carregarAgenda">

</div>

</div>

</div>


<div
  id="listaAgendamentos"
  class="card">

<div class="carregando">
Carregando...
</div>

</div>


</div>


<!-- =====================================================
     MODAL
     ===================================================== -->

<div
  id="modal"
  class="modal">

<div class="modal-conteudo">


<div class="modal-header">

<h2>Novo Agendamento</h2>

<button
  class="fechar"
  onclick="fecharModal()">

  ×

</button>

</div>


<div
  id="mensagemModal"
  class="mensagem">
</div>


<div class="campo">

<label for="cliente">
Nome da cliente *
</label>

<input
  type="text"
  id="cliente"
  placeholder="Digite o nome da cliente">

</div>


<div class="campo">

<label for="whatsapp">
WhatsApp *
</label>

<input
  type="tel"
  id="whatsapp"
  placeholder="(31) 99999-9999">

</div>


<div class="grid">


<div class="campo">

<label for="data">
Data *
</label>

<input
  type="date"
  id="data"
  onchange="atualizarHorarios()">

</div>


<div class="campo">

<label for="servico">
Serviço *
</label>

<select
  id="servico"
  onchange="atualizarHorarios()">

<option value="">
Selecione o serviço
</option>

</select>

</div>

</div>


<div class="campo">

<label>
Horários disponíveis *
</label>

<div
  id="areaHorarios"
  class="horarios">

<div class="carregando">
Selecione a data e o serviço.
</div>

</div>

</div>


<div class="campo">

<label for="observacao">
Observação
</label>

<textarea
  id="observacao"
  placeholder="Observações da cliente..."></textarea>

</div>


<div
  id="resumo"
  class="resumo"
  style="display:none">
</div>


<div class="acoes">

<button
  class="btn-secundario"
  onclick="fecharModal()">

  Cancelar

</button>


<button
  id="btnSalvar"
  class="btn-salvar"
  onclick="salvarAgendamento()">

  Agendar Cliente

</button>

</div>


</div>

</div>


<script>


/* =====================================================
   CONFIGURAÇÃO
   ===================================================== */

const API_URL =
'https://script.google.com/macros/s/AKfycbzGWzCjQsNGfPfFZuRp2Xw3TgqKQ2lslr_bT7sS2_p7YZOqhF_zwTU5KCl_jGqGYrZj/exec';


const NOME_SALAO =
'Salão Janaina';


const INICIO_EXPEDIENTE =
8 * 60;


const FIM_EXPEDIENTE =
18 * 60;


let servicos = [];

let agendamentosDoDia = [];

let horarioSelecionado = '';

let servicoSelecionado = null;


/* =====================================================
   INICIALIZAÇÃO
   ===================================================== */

document.addEventListener(
  'DOMContentLoaded',
  async function() {

    const hoje =
      obterDataHoje();

    document.getElementById(
      'dataAgenda'
    ).value = hoje;

    document.getElementById(
      'dataAgenda'
    ).min = hoje;

    document.getElementById(
      'data'
    ).min = hoje;

    await carregarServicos();

    carregarAgenda();

  }
);


/* =====================================================
   DATA
   ===================================================== */

function obterDataHoje() {

  const agora = new Date();

  return (
    agora.getFullYear() +
    '-' +
    String(
      agora.getMonth() + 1
    ).padStart(2,'0') +
    '-' +
    String(
      agora.getDate()
    ).padStart(2,'0')
  );

}


/* =====================================================
   MODAL
   ===================================================== */

async function abrirNovoAgendamento() {

  limparFormulario();

  const dataAgenda =
    document.getElementById(
      'dataAgenda'
    ).value;

  document.getElementById(
    'data'
  ).value =
    dataAgenda ||
    obterDataHoje();

  document.getElementById(
    'modal'
  ).classList.add('ativo');

  if (servicos.length === 0) {

    await carregarServicos();

  }

  atualizarHorarios();

}


function fecharModal() {

  document.getElementById(
    'modal'
  ).classList.remove('ativo');

}


function limparFormulario() {

  document.getElementById(
    'cliente'
  ).value = '';

  document.getElementById(
    'whatsapp'
  ).value = '';

  document.getElementById(
    'observacao'
  ).value = '';

  document.getElementById(
    'servico'
  ).value = '';

  horarioSelecionado = '';

  servicoSelecionado = null;

  document.getElementById(
    'resumo'
  ).style.display = 'none';

  document.getElementById(
    'areaHorarios'
  ).innerHTML =
    '<div class="carregando">' +
    'Selecione a data e o serviço.' +
    '</div>';

  esconderMensagem(

async function carregarServicos() {

  try {

    const resposta =
      await fetch(
        API_URL +
        '?acao=servicos&_=' +
        Date.now(),
        {
          cache: 'no-store'
        }
      );

    if (!resposta.ok) {

      throw new Error(
        'HTTP ' +
        resposta.status
      );

    }

    const dados =
      await resposta.json();

    let lista = dados;

    if (
      dados &&
      Array.isArray(
        dados.servicos
      )
    ) {

      lista =
        dados.servicos;

    }

    if (
      !Array.isArray(lista)
    ) {

      throw new Error(
        'Resposta inválida dos serviços.'
      );

    }

    servicos =
      lista.map(
        function(item) {

          return {

            id:
              String(
                item.id || ''
              ),

            nome:
              String(
                item.nome ||
                item.servico ||
                ''
              ),

            duracao:
              Number(
                item.duracao
              ),

            preco:
              Number(
                item.preco || 0
              )

          };

        }
      )
      .filter(
        function(item) {

          return (
            item.id &&
            item.nome &&
            Number.isFinite(
              item.duracao
            ) &&
            item.duracao > 0
          );

        }
      );

    preencherSelectServicos();

  } catch (erro) {

    console.error(erro);

    mostrarMensagem(
      'mensagemModal',
      'Erro ao carregar serviços: ' +
      erro.message,
      'erro'
    );

  }

}


function preencherSelectServicos() {

  const select =
    document.getElementById(
      'servico'
    );

  select.innerHTML =
    '<option value="">' +
    'Selecione o serviço' +
    '</option>';

  servicos.forEach(
    function(servico) {

      const option =
        document.createElement(
          'option'
        );

      option.value =
        servico.id;

      let texto =
        servico.nome +
        ' - ' +

      ) {

        texto +=

      }

      option.textContent =

      select.appendChild(
        option

    }
  );

}

function renderizarHorarios(
  servico,
  agendamentos
) {

  const area =
    document.getElementById(
      'areaHorarios'
    );

  const duracao =
    Number(
      servico.duracao
    );

  const possiveis = [];

  let cursor =
    INICIO_EXPEDIENTE;

  const agenda =
    agendamentos
      .map(
        function(item) {

          const inicio =
            horaParaMinutos(
              item.hora
            );

          const d =
            Number(
              item.duracao
            );

          return {

            inicio: inicio,

            fim:
              inicio +
              d

          };

        }
      )
      .filter(
        function(item) {

          return (
            item.inicio >= 0 &&
            item.fim > item.inicio
          );

        }
      )
      .sort(
        function(a,b) {

          return a.inicio -
            b.inicio;

        }
      );

  while (
    cursor +
    duracao <=
    FIM_EXPEDIENTE
  ) {

    const conflito =
      encontrarConflito(
        cursor,
        cursor + duracao,
        agenda
      );

    if (!conflito) {

      possiveis.push({
        inicio: cursor,
        fim:
          cursor + duracao
      });

      cursor += duracao;

    } else {

      cursor =
        Math.max(
          cursor + 1,
          conflito.fim
        );

    }

  }

  const unicos = [];

  possiveis.forEach(
    function(item) {

      const existe =
        unicos.some(
          function(x) {

            return x.inicio ===
              item.inicio;

          }
        );

      if (!existe) {

        unicos.push(item);

      }

    }
  );

  if (unicos.length === 0) {

    area.innerHTML =
      '<div class="sem-horarios">' +
      'Não há horários disponíveis para este serviço nesta data.' +
      '</div>';

    return;

  }

  area.innerHTML = '';

  const info =
    document.createElement(
      'div'
    );

  info.className =
    'horario informacao';

  info.textContent =
    'Duração: ' +
    duracao +
    ' minutos';

  area.appendChild(info);

  unicos.forEach(
    function(item) {

      const botao =
        document.createElement(
          'button'
        );

      botao.type =
        'button';

      botao.className =
        'horario';

      botao.textContent =
        minutosParaHora(
          item.inicio
        );

      botao.title =
        'Término previsto: ' +
        minutosParaHora(
          item.fim
        );

      botao.onclick =
        function() {

          selecionarHorario(
            minutosParaHora(
              item.inicio
            ),
            botao
          );

        };

      area.appendChild(
        botao
      );

    }
  );

}


function encontrarConflito(
  inicio,
  fim,
  agenda
) {

  return agenda.find(
    function(item) {

      return (
        inicio < item.fim &&
        fim > item.inicio
      );

    }
  ) || null;

}


/* =====================================================
   SELECIONAR HORÁRIO

function selecionarHorario(
  hora,
  botao

  document
    .querySelectorAll(

    )
    .forEach(
      function(item) {

    ).value.trim();

    );

  }

  if (!whatsapp) {

    mostrarMensagem(
      'mensagemModal',

      'erro'
    );

    return;

  }

  if (!data) {

    mostrarMensagem(
      'mensagemModal',
      'Informe a data.',
      'erro'
    );

    return;

  }

  if (!servicoId) {

    mostrarMensagem(
      'mensagemModal',
      'Selecione o serviço.',
      'erro'
    );

    return;

  }

  if (!horarioSelecionado) {

    mostrarMensagem(
      'mensagemModal',
      'Selecione um horário.',
      'erro'
    );

    return;

  }

  const servico =
    servicos.find(
      function(item) {

        return String(item.id) ===
          String(servicoId);

      }
    );

  if (!servico) {

    mostrarMensagem(
      'mensagemModal',
      'Serviço inválido.',
      'erro'
    );

    return;

  }

  let janelaWhatsApp = null;

  janelaWhatsApp =
    window.open(
      'about:blank',
      '_blank'
    );

  const btn =
    document.getElementById(
      'btnSalvar'
    );

  btn.disabled =
    true;

  btn.textContent =
    'Verificando...';

  try {

    const agendaAtual =

        data
      );

    const inicioNovo =
      horaParaMinutos(
        horarioSelecionado
      );

    const fimNovo =
      inicioNovo +
      Number(
        servico.duracao
      );

    const conflito =
      encontrarConflito(
        inicioNovo,
        fimNovo,
        agendaAtual.map(
          function(item) {

            const inicio =
              horaParaMinutos(
                item.hora
              );

            const duracao =
              Number(
                item.duracao
              );

            return {

              inicio: inicio,

              fim:
                inicio +
                duracao

            };

          }
        )
      );

    if (conflito) {

      throw new Error(
        'Este horário não está mais disponível. Escolha outro.'
      );

    }

    btn.textContent =
      'Agendando...';

    const dados = {

      acao:

      cliente:

      whatsapp:
        whatsapp,

      data:

      hora:
        horarioSelecionado,

      servico:

      servicoId:

      duracao:

    const resposta =

        resposta.status

    ) {

      false;

    btn.textContent =
      'Agendar Cliente';

  }

/* =====================================================
   WHATSAPP
   ===================================================== */

function prepararWhatsApp(
  numero
) {

  let telefone =
    String(
      numero || ''
    ).replace(
      /\D/g,
      ''
    );

  if (!telefone) {

    return '';

  }

  if (
    telefone.length === 10 ||
    telefone.length === 11
  ) {

    telefone =
      '55' +
      telefone;

  }

  if (
    telefone.startsWith('55') &&
    (
      telefone.length === 12 ||
      telefone.length === 13
    )
  ) {

    return telefone;

  }

  return '';

}


/* =====================================================
   AGENDA
   ===================================================== */

async function buscarAgendamentos(
  data
) {

  const url =
    API_URL +
    '?acao=agendamentos' +
    '&data=' +
    encodeURIComponent(data) +
    '&_=' +
    Date.now();

  const resposta =
    await fetch(
      url,
      {
        cache: 'no-store'
      }
    );

  if (!resposta.ok) {

    throw new Error(
      'HTTP ' +
      resposta.status
    );

  }

  const dados =
    await resposta.json();

  if (
    Array.isArray(dados)
  ) {

    return dados;

  }

  if (
    dados &&
    Array.isArray(
      dados.agendamentos
    )
  ) {

    return dados.agendamentos;

  }

  throw new Error(
    'Resposta inválida dos agendamentos.'
  );

}

  const data =
    document.getElementById(
      'dataAgenda'
    ).value;

      'listaAgendamentos'
    );

    area.innerHTML =

      'Erro ao carregar a agenda.<br><br>' +
      '<small>' +
      escapeHtml(
        erro.message
      ) +
      '</small>' +
      '</div>';

  }

}

) {

  ) {

      '</div>';

    return;

  }

  agendamentos.sort(
    function(a,b) {

      return (
        horaParaMinutos(a.hora) -
        horaParaMinutos(b.hora)
      );

    }
  );

  let html =
    '<h3>Agendamentos do dia</h3>';

  agendamentos.forEach(
    function(item) {

      const inicio =
        horaParaMinutos(
          item.hora
        );

      const duracao =
        Number(
          item.duracao || 0
        );

      const fim =
        inicio +
        duracao;

      html +=

        '<div class="agendamento">' +

        '<div class="agendamento-topo">' +

        '<div>' +

        '<strong>' +

        escapeHtml(
          item.hora
        ) +

        ' - ' +

        escapeHtml(
          item.cliente
        ) +

        '</strong>' +

        '</div>' +

        '<button ' +
        'class="btn-cancelar" ' +
        'onclick="cancelarAgendamento(\'' +
        escapeHtmlJS(item.id) +
        '\')">' +

        'Cancelar' +

        '</button>' +

        '</div>' +

        '<div class="info">' +

        '<strong>Serviço:</strong> ' +

        escapeHtml(
          item.servico
        ) +

        ' (' +

        duracao +

        ' min)' +

        '</div>' +

        '<div class="info">' +

        '<strong>Horário:</strong> ' +

        escapeHtml(
          item.hora
        ) +

        ' até ' +

        minutosParaHora(
          fim
        ) +

        '</div>' +

        '<div class="info">' +

        '<strong>WhatsApp:</strong> ' +

        escapeHtml(
          item.whatsapp
        ) +

        '</div>' +

        (
          item.observacao
          ?
          '<div class="info">' +
          '<strong>Observação:</strong> ' +
          escapeHtml(
            item.observacao
          ) +
          '</div>'
          :
          ''
        ) +

        '</div>';

    }
  );

  area.innerHTML =
    html;

/* =====================================================
   UTILITÁRIOS
   ===================================================== */

function horaParaMinutos(
  hora
) {

  if (!hora) {

    return -1;

  }

  const partes =
    String(
      hora
    ).split(':');

  if (
    partes.length < 2
  ) {

    return -1;

  }

  const h =
    Number(
      partes[0]
    );

  const m =
    Number(
      partes[1]
    );

  if (
    !Number.isFinite(h) ||
    !Number.isFinite(m)
  ) {

    return -1;

  }

  return h * 60 + m;

}


function minutosParaHora(
  minutos
) {

  const valor =
    Number(
      minutos
    );

  if (
    !Number.isFinite(valor)
  ) {

    return '';

  }

  return (
    String(
      Math.floor(
        valor / 60
      )
    ).padStart(2,'0') +
    ':' +
    String(
      valor % 60
    ).padStart(2,'0')
  );

}


function formatarDataBR(
  data
) {

  const partes =
    String(
      data
    ).split('-');

  if (
    partes.length !== 3
  ) {

    return data;

  }

  return (
    partes[2] +
    '/' +
    partes[1] +
    '/' +
    partes[0]
  );

}


function mostrarMensagem(
  id,
  texto,
  tipo
) {

  const elemento =
    document.getElementById(
      id
    );

  if (!elemento) {

    return;

  }

  elemento.textContent =
    texto;

  elemento.className =
    'mensagem ' +
    tipo;

  setTimeout(
    function() {

      esconderMensagem(
        id
      );

    },
    5000
  );

}


function esconderMensagem(
  id
) {

  const elemento =
    document.getElementById(
      id
    );

  if (!elemento) {

    return;

  }

  elemento.className =
    'mensagem';

  elemento.textContent =
    '';

}


function escapeHtml(
  texto
) {

  return String(
    texto || ''
  )

  .replace(
    /&/g,
    '&amp;'
  )

  .replace(
    /</g,
    '&lt;'
  )

  .replace(
    />/g,
    '&gt;'
  )

  .replace(
    /"/g,
    '&quot;'
  )

  .replace(
    /'/g,
    '&#039;'
  );

}


function escapeHtmlJS(
  texto
) {

  return String(
    texto || ''
  )

  .replace(
    /\\/g,
    '\\\\'
  )

  .replace(
    /'/g,
    "\\'"
  )

  .replace(
    /"/g,
    '\\"'
  );

}


/* =====================================================
   FECHAR CLICANDO FORA
   ===================================================== */

document
  .getElementById(
    'modal'
  )
  .addEventListener(
    'click',
    function(event) {

      if (
        event.target === this
      ) {

        fecharModal();

      }

    }
  );

</script>
