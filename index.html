<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Agenda do Salão</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: #f8f5f2;
  color: #333;
}

header {
  background: linear-gradient(135deg, #8e5a72, #b87998);
  color: white;
  padding: 22px;
  box-shadow: 0 3px 12px rgba(0,0,0,.12);
}

.topo {
  max-width: 1200px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header h1 {
  font-size: 25px;
}

header p {
  margin-top: 5px;
  font-size: 14px;
  opacity: .9;
}

.container {
  max-width: 1200px;
  margin: 25px auto;
  padding: 0 15px;
}

button {
  border: none;
  border-radius: 9px;
  padding: 12px 18px;
  font-weight: bold;
  cursor: pointer;
}

.btn-principal {
  background: #9b627d;
  color: white;
}

.btn-secundario {
  background: #eee;
  color: #444;
}

.controles {
  background: white;
  padding: 18px;
  border-radius: 14px;
  display: flex;
  gap: 15px;
  align-items: end;
  flex-wrap: wrap;
  margin-bottom: 20px;
  box-shadow: 0 3px 15px rgba(0,0,0,.06);
}

.campo {
  display: flex;
  flex-direction: column;
  gap: 7px;
  flex: 1;
  min-width: 180px;
}

label {
  font-size: 13px;
  font-weight: bold;
  color: #555;
}

input,
select,
textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 9px;
  font-size: 15px;
  background: white;
}

textarea {
  resize: vertical;
  min-height: 80px;
}

.resumo {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  margin-bottom: 20px;
}

.card-resumo {
  background: white;
  padding: 18px;
  border-radius: 14px;
  box-shadow: 0 3px 15px rgba(0,0,0,.06);
}

.numero {
  font-size: 28px;
  font-weight: bold;
  color: #9b627d;
}

.card-resumo span {
  color: #777;
  font-size: 13px;
}

.agenda {
  background: white;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 3px 15px rgba(0,0,0,.06);
}

.agenda-titulo {
  padding: 18px;
  border-bottom: 1px solid #eee;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.lista {
  padding: 15px;
}

.agendamento {
  border: 1px solid #eee;
  border-left: 5px solid #a56583;
  border-radius: 10px;
  padding: 15px;
  margin-bottom: 12px;
  display: grid;
  grid-template-columns: 80px 1fr auto;
  gap: 15px;
  align-items: center;
}

.horario {
  font-size: 21px;
  font-weight: bold;
  color: #9b627d;
}

.cliente {
  font-weight: bold;
  font-size: 16px;
}

.detalhes {
  color: #666;
  font-size: 13px;
  line-height: 1.6;
  margin-top: 5px;
}

.btn-cancelar {
  background: #dc5a5a;
  color: white;
  padding: 8px 11px;
  font-size: 12px;
}

.vazio,
.loading {
  text-align: center;
  padding: 40px;
  color: #888;
}

.modal-fundo {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  display: none;
  justify-content: center;
  align-items: center;
  padding: 15px;
  z-index: 1000;
}

.modal-fundo.aberto {
  display: flex;
}

.modal {
  background: white;
  width: 100%;
  max-width: 600px;
  max-height: 90vh;
  overflow-y: auto;
  border-radius: 16px;
  padding: 25px;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 20px;
}

.modal-header h2 {
  color: #8e5a72;
}

.fechar {
  background: #eee;
  width: 35px;
  height: 35px;
  padding: 0;
  border-radius: 50%;
  font-size: 20px;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

.campo-completo {
  grid-column: 1 / -1;
}

/* ============================= */
/* HORÁRIOS */
/* ============================= */

.horarios {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-top: 5px;
}

.btn-horario {
  background: white;
  color: #8e5a72;
  border: 1px solid #d8c5ce;
  padding: 13px 8px;
}

.btn-horario:hover {
  background: #f7edf2;
}

.btn-horario.selecionado {
  background: #9b627d;
  color: white;
}

.btn-horario.ocupado {
  background: #eeeeee;
  color: #aaa;
  border-color: #ddd;
  cursor: not-allowed;
  text-decoration: line-through;
}

.horarios-info {
  grid-column: 1 / -1;
  text-align: center;
  padding: 15px;
  background: #f8f5f2;
  border-radius: 9px;
  color: #777;
}

.erro,
.sucesso {
  display: none;
  padding: 12px 15px;
  border-radius: 8px;
  margin-bottom: 15px;
}

.erro {
  background: #ffe5e5;
  color: #a33;
}

.sucesso {
  background: #e4f7e9;
  color: #26733a;
}

.acoes-modal {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 20px;
}

@media(max-width:700px) {

  .topo {
    flex-direction: column;
    align-items: flex-start;
    gap: 15px;
  }

  .resumo {
    grid-template-columns: 1fr;
  }

  .form-grid {
    grid-template-columns: 1fr;
  }

  .campo-completo {
    grid-column: auto;
  }

  .agendamento {
    grid-template-columns: 65px 1fr;
  }

  .agendamento .acao {
    grid-column: 1 / -1;
  }

  .horarios {
    grid-template-columns: repeat(3, 1fr);
  }

}

</style>
</head>


<body>

<header>

  <div class="topo">

    <div>
      <h1>💇 Agenda do Salão</h1>
      <p>Painel de agendamentos</p>
    </div>

    <button
      class="btn-principal"
      onclick="abrirModal()"
    >
      + Novo agendamento
    </button>

  </div>

</header>


<main class="container">

  <div id="mensagemErro" class="erro"></div>

  <div id="mensagemSucesso" class="sucesso"></div>


  <section class="controles">

    <div class="campo">

      <label>Data da agenda</label>

      <input
        type="date"
        id="dataAgenda"
        onchange="carregarAgenda()"
      >

    </div>


    <button
      class="btn-secundario"
      onclick="dataHoje()"
    >
      Hoje
    </button>


    <button
      class="btn-secundario"
      onclick="carregarAgenda()"
    >
      🔄 Atualizar
    </button>

  </section>


  <section class="resumo">

    <div class="card-resumo">
      <div
        class="numero"
        id="totalAgendamentos"
      >
        0
      </div>

      <span>Agendamentos</span>
    </div>


    <div class="card-resumo">

      <div
        class="numero"
        id="totalHoras"
      >
        0h
      </div>

      <span>Tempo agendado</span>

    </div>


    <div class="card-resumo">

      <div
        class="numero"
        id="proximoHorario"
      >
        --:--
      </div>

      <span>Próximo horário</span>

    </div>

  </section>


  <section class="agenda">

    <div class="agenda-titulo">

      <h2>
        Agenda de
        <span id="dataTitulo"></span>
      </h2>

      <button
        class="btn-principal"
        onclick="abrirModal()"
      >
        + Agendar cliente
      </button>

    </div>


    <div
      id="listaAgendamentos"
      class="lista"
    >
      <div class="loading">
        Carregando...
      </div>
    </div>

  </section>

</main>


<!-- ============================= -->
<!-- MODAL -->
<!-- ============================= -->

<div
  id="modalFundo"
  class="modal-fundo"
>

  <div class="modal">

    <div class="modal-header">

      <h2>Novo agendamento</h2>

      <button
        class="fechar"
        onclick="fecharModal()"
      >
        ×
      </button>

    </div>


    <form id="formAgendamento">

      <div class="form-grid">


        <div class="campo campo-completo">

          <label>
            Nome da cliente
          </label>

          <input
            type="text"
            id="cliente"
            required
            placeholder="Nome da cliente"
          >

        </div>


        <div class="campo">

          <label>
            WhatsApp
          </label>

          <input
            type="tel"
            id="whatsapp"
            required
            placeholder="(31) 99999-9999"
          >

        </div>


        <div class="campo">

          <label>
            Data
          </label>

          <input
            type="date"
            id="data"
            required
            onchange="carregarHorarios()"
          >

        </div>


        <!-- SERVIÇO -->

        <div class="campo campo-completo">

          <label>
            Serviço
          </label>

          <select
            id="servico"
            required
            onchange="servicoSelecionado()"
          >

            <option value="">
              Selecione o serviço
            </option>

          </select>

        </div>


        <!-- HORÁRIOS -->

        <div class="campo campo-completo">

          <label>
            Horário disponível
          </label>

          <input
            type="hidden"
            id="hora"
            required
          >

          <div
            id="horarios"
            class="horarios"
          >

            <div class="horarios-info">
              Selecione uma data.
            </div>

          </div>

        </div>


        <div class="campo">

          <label>
            Duração
          </label>

          <input
            type="text"
            id="duracao"
            readonly
          >

        </div>


        <div class="campo">

          <label>
            Preço
          </label>

          <input
            type="text"
            id="preco"
            readonly
          >

        </div>


        <div class="campo campo-completo">

          <label>
            Observação
          </label>

          <textarea
            id="observacao"
            placeholder="Observação..."
          ></textarea>

        </div>

      </div>


      <div class="acoes-modal">

        <button
          type="button"
          class="btn-secundario"
          onclick="fecharModal()"
        >
          Fechar
        </button>

        <button
          type="submit"
          class="btn-principal"
        >
          Salvar agendamento
        </button>

      </div>

    </form>

  </div>

</div>


<script>

/* ========================================================= */
/* API */
/* ========================================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbxlDNqWDBZZ_BQiECAgMFgd1iZKmv-T1AVBOg2bTnvJdPj7NGolqTbQYdUljRORD3DK/exec";


let servicos = [];

let agendamentos = [];


/* ========================================================= */
/* INICIAR */
/* ========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  async function() {

    dataHoje();

    await carregarServicos();

    await carregarAgenda();

  }
);


/* ========================================================= */
/* DATA HOJE */
/* ========================================================= */

function dataHoje() {

  const agora =
    new Date();

  const ano =
    agora.getFullYear();

  const mes =
    String(
      agora.getMonth() + 1
    ).padStart(2,"0");

  const dia =
    String(
      agora.getDate()
    ).padStart(2,"0");

  const data =
    `${ano}-${mes}-${dia}`;


  document.getElementById(
    "dataAgenda"
  ).value = data;


  document.getElementById(
    "data"
  ).value = data;


  atualizarTitulo(data);

}


/* ========================================================= */
/* TÍTULO */
/* ========================================================= */

function atualizarTitulo(data) {

  if (!data) return;

  const partes =
    data.split("-");

  document.getElementById(
    "dataTitulo"
  ).textContent =
    `${partes[2]}/${partes[1]}/${partes[0]}`;

}


/* ========================================================= */
/* SERVIÇOS */
/* ========================================================= */

async function carregarServicos() {

  try {

    const resposta =
      await fetch(
        `${API_URL}?acao=servicos`
      );

    const dados =
      await resposta.json();

    if (!Array.isArray(dados)) {

      throw new Error(
        "A API não retornou os serviços."
      );

    }

    servicos =
      dados;


    const select =
      document.getElementById(
        "servico"
      );


    select.innerHTML =
      `<option value="">
        Selecione o serviço
      </option>`;


    servicos.forEach(
      servico => {

        const option =
          document.createElement(
            "option"
          );

        option.value =
          servico.id;

        option.textContent =
          `${servico.nome} - ${formatarMoeda(servico.preco)}`;

        select.appendChild(
          option
        );

      }
    );

  } catch(erro) {

    mostrarErro(
      "Erro ao carregar serviços: " +
      erro.message
    );

  }

}


/* ========================================================= */
/* SERVIÇO SELECIONADO */
/* ========================================================= */

function servicoSelecionado() {

  const id =
    document.getElementById(
      "servico"
    ).value;


  const servico =
    servicos.find(
      item =>
        String(item.id) ===
        String(id)
    );


  if (!servico) {

    document.getElementById(
      "duracao"
    ).value = "";

    document.getElementById(
      "preco"
    ).value = "";

    document.getElementById(
      "hora"
    ).value = "";
