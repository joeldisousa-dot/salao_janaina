<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Agenda - Salão Janaina</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f8f5f7;
  color: #333;
}

header {
  background: linear-gradient(135deg,#8e4168,#c66d9c);
  color: white;
  padding: 25px 20px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 27px;
}

header p {
  margin: 7px 0 0;
  opacity: .9;
}

.container {
  width: 100%;
  max-width: 1000px;
  margin: 25px auto;
  padding: 0 15px;
}

.topo {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 20px;
}

.topo h2 {
  margin: 0;
  color: #713253;
}

button {
  border: 0;
  cursor: pointer;
  font-family: inherit;
}

.btn-principal {
  background: #8e4168;
  color: white;
  padding: 13px 20px;
  border-radius: 10px;
  font-size: 15px;
  font-weight: bold;
}

.btn-principal:hover {
  background: #713253;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 3px 15px rgba(0,0,0,.07);
}

.card h3 {
  margin-top: 0;
  color: #713253;
}

.filtro {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

label {
  display: block;
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 7px;
  color: #555;
}

input,
select,
textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 9px;
  font-size: 15px;
  outline: none;
  background: white;
}

input:focus,
select:focus,
textarea:focus {
  border-color: #b65f8d;
}

textarea {
  min-height: 80px;
  resize: vertical;
}

.campo {
  margin-bottom: 16px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 15px;
}


/* =====================================================
   HORÁRIOS
   ===================================================== */

.horarios {
  display: grid;
  grid-template-columns: repeat(auto-fill,minmax(95px,1fr));
  gap: 10px;
  margin-top: 10px;
}

.horario {
  padding: 12px 8px;
  border-radius: 10px;
  background: #f4e6ee;
  color: #713253;
  border: 2px solid transparent;
  font-size: 15px;
  font-weight: bold;
}

.horario:hover {
  background: #e8cadb;
}

.horario.selecionado {
  background: #8e4168;
  color: white;
  border-color: #713253;
}

.horario.ocupado {
  background: #eeeeee;
  color: #aaa;
  cursor: not-allowed;
  text-decoration: line-through;
}

.horario.informacao {
  background: #fff8fb;
  color: #8e4168;
  border: 1px dashed #d89abc;
  cursor: default;
  font-size: 13px;
  grid-column: 1 / -1;
  text-decoration: none;
}


/* =====================================================
   MENSAGENS
   ===================================================== */

.mensagem {
  padding: 12px;
  border-radius: 9px;
  margin-bottom: 15px;
  display: none;
}

.mensagem.erro {
  display: block;
  background: #ffe4e4;
  color: #a00000;
}

.mensagem.sucesso {
  display: block;
  background: #e2f7e8;
  color: #176b2d;
}

.carregando {
  text-align: center;
  color: #777;
  padding: 15px;
}

.sem-horarios {
  background: #fff4f4;
  color: #a33;
  padding: 15px;
  border-radius: 10px;
  text-align: center;
}


/* =====================================================
   AGENDA
   ===================================================== */

.agendamento {
  border: 1px solid #eee;
  border-left: 5px solid #8e4168;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 12px;
  background: #fff;
}

.agendamento-topo {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}

.agendamento strong {
  color: #713253;
}

.info {
  margin-top: 7px;
  font-size: 14px;
  color: #555;
}

.btn-cancelar {
  background: #ffe1e1;
  color: #a00000;
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: bold;
}

.btn-cancelar:hover {
  background: #ffcaca;
}


/* =====================================================
   MODAL
   ===================================================== */

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  z-index: 999;
  padding: 20px;
  overflow-y: auto;
}

.modal.ativo {
  display: flex;
  align-items: flex-start;
  justify-content: center;
}

.modal-conteudo {
  background: white;
  width: 100%;
  max-width: 650px;
  margin: 20px auto;
  border-radius: 18px;
  padding: 25px;
  box-shadow: 0 10px 40px rgba(0,0,0,.2);
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.modal-header h2 {
  margin: 0;
  color: #713253;
}

.fechar {
  width: 35px;
  height: 35px;
  border-radius: 50%;
  background: #f2e6ed;
  color: #713253;
  font-size: 20px;
}

.fechar:hover {
  background: #e5cedb;
}

.resumo {
  background: #f8f1f5;
  border-radius: 10px;
  padding: 12px;
  margin-top: 15px;
  color: #713253;
  font-size: 14px;
}

.acoes {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  margin-top: 20px;
}

.btn-secundario {
  background: #eee;
  color: #444;
  padding: 12px 18px;
  border-radius: 9px;
  font-weight: bold;
}

.btn-salvar {
  background: #8e4168;
  color: white;
  padding: 12px 20px;
  border-radius: 9px;
  font-weight: bold;
}

.btn-salvar:hover {
  background: #713253;
}

.btn-salvar:disabled {
  background: #aaa;
  cursor: not-allowed;
}


/* =====================================================
   RESPONSIVO
   ===================================================== */

@media (max-width:600px) {

  .grid {
    grid-template-columns: 1fr;
  }

  .topo {
    align-items: stretch;
    flex-direction: column;
  }

  .topo .btn-principal {
    width: 100%;
  }

  .modal {
    padding: 10px;
  }

  .modal-conteudo {
    margin: 5px auto;
    padding: 18px;
  }

  .horarios {
    grid-template-columns: repeat(3,1fr);
  }

}

</style>

</head>


<body>


<header>

<h1>Salão Janaina</h1>

<p>Agenda de clientes</p>

</header>


<div class="container">


<div class="topo">

<h2>Agenda</h2>

<button
  class="btn-principal"
  onclick="abrirNovoAgendamento()">

  + Novo Agendamento

</button>

</div>


<div
  id="mensagemPrincipal"
  class="mensagem">
</div>


<div class="card">

<h3>Agendamentos do dia</h3>

<div class="filtro">

<div style="width:100%;max-width:250px">

<label for="dataAgenda">
Data
</label>

<input
  type="date"
  id="dataAgenda"
  onchange="carregarAgenda">

</div>

</div>

</div>


<div
  id="listaAgendamentos"
  class="card">

<div class="carregando">
Carregando...
</div>

</div>


</div>


<!-- =====================================================
     MODAL
     ===================================================== -->

<div
  id="modal"
  class="modal">

<div class="modal-conteudo">


<div class="modal-header">

<h2>Novo Agendamento</h2>

<button
  class="fechar"
  onclick="fecharModal()">

  ×

</button>

</div>


<div
  id="mensagemModal"
  class="mensagem">
</div>


<div class="campo">

<label for="cliente">
Nome da cliente *
</label>

<input
  type="text"
  id="cliente"
  placeholder="Digite o nome da cliente">

</div>


<div class="campo">

<label for="whatsapp">
WhatsApp *
</label>

<input
  type="tel"
  id="whatsapp"
  placeholder="(31) 99999-9999">

</div>


<div class="grid">


<div class="campo">

<label for="data">
Data *
</label>

<input
  type="date"
  id="data"
  onchange="atualizarHorarios()">

</div>


<div class="campo">

<label for="servico">
Serviço *
</label>

<select
  id="servico"
  onchange="atualizarHorarios()">

<option value="">
Selecione o serviço
</option>

</select>

</div>

</div>


<div class="campo">

<label>
Horários disponíveis *
</label>

<div
  id="areaHorarios"
  class="horarios">

<div class="carregando">
Selecione a data e o serviço.
</div>

</div>

</div>


<div class="campo">

<label for="observacao">
Observação
</label>

<textarea
  id="observacao"
  placeholder="Observações da cliente..."></textarea>

</div>


<div
  id="resumo"
  class="resumo"
  style="display:none">
</div>


<div class="acoes">

<button
  class="btn-secundario"
  onclick="fecharModal()">

  Cancelar

</button>


<button
  id="btnSalvar"
  class="btn-salvar"
  onclick="salvarAgendamento()">

  Agendar Cliente

</button>

</div>


</div>

</div>


<script>


/* =====================================================
   CONFIGURAÇÃO
   ===================================================== */

const API_URL =
'https://script.google.com/macros/s/AKfycbzGWzCjQsNGfPfFZuRp2Xw3TgqKQ2lslr_bT7sS2_p7YZOqhF_zwTU5KCl_jGqGYrZj/exec';


const NOME_SALAO =
'Salão Janaina';


const INICIO_EXPEDIENTE =
8 * 60;


const FIM_EXPEDIENTE =
18 * 60;


let servicos = [];

let agendamentosDoDia = [];

let horarioSelecionado = '';

let servicoSelecionado = null;


/* =====================================================
   INICIALIZAÇÃO
   ===================================================== */

document.addEventListener(
  'DOMContentLoaded',
  async function() {

    const hoje =
      obterDataHoje();

    document.getElementById(
      'dataAgenda'
    ).value = hoje;

    document.getElementById(
      'dataAgenda'
    ).min = hoje;

    document.getElementById(
      'data'
    ).min = hoje;

    await carregarServicos();

    carregarAgenda();

  }
);


/* =====================================================
   DATA
   ===================================================== */

function obterDataHoje() {

  const agora = new Date();

  return (
    agora.getFullYear() +
    '-' +
    String(
      agora.getMonth() + 1
    ).padStart(2,'0') +
    '-' +
    String(
      agora.getDate()
    ).padStart(2,'0')
  );

}


/* =====================================================
   MODAL
   ===================================================== */

async function abrirNovoAgendamento() {

  limparFormulario();

  const dataAgenda =
    document.getElementById(
      'dataAgenda'
    ).value;

  document.getElementById(
    'data'
  ).value =
    dataAgenda ||
    obterDataHoje();

  document.getElementById(
    'modal'
  ).classList.add('ativo');

  if (servicos.length === 0) {

    await carregarServicos();

  }

  atualizarHorarios();

}


function fecharModal() {

  document.getElementById(
    'modal'
  ).classList.remove('ativo');

}


function limparFormulario() {

  document.getElementById(
    'cliente'
  ).value = '';

  document.getElementById(
    'whatsapp'
  ).value = '';

  document.getElementById(
    'observacao'
  ).value = '';

  document.getElementById(
    'servico'
  ).value = '';

  horarioSelecionado = '';

  servicoSelecionado = null;

  document.getElementById(
    'resumo'
  ).style.display = 'none';

  document.getElementById(
    'areaHorarios'
  ).innerHTML =
    '<div class="carregando">' +
    'Selecione a data e o serviço.' +
    '</div>';

  esconderMensagem(
    'mensagemModal'
  );

}


/* =====================================================
   SERVIÇOS
   ===================================================== */

async function carregarServicos() {

  try {

    const resposta =
      await fetch(
        API_URL +
        '?acao=servicos&_=' +
        Date.now(),
        {
          cache: 'no-store'
        }
      );

    if (!resposta.ok) {

      throw new Error(
        'HTTP ' +
        resposta.status
      );

    }

    const dados =
      await resposta.json();

    let lista = dados;

    if (
      dados &&
      Array.isArray(
        dados.servicos
      )
    ) {

      lista =
        dados.servicos;

    }

    if (
      !Array.isArray(lista)
    ) {

      throw new Error(
        'Resposta inválida dos serviços.'
      );

    }

    servicos =
      lista.map(
        function(item) {

          return {

            id:
              String(
                item.id || ''
              ),

            nome:
              String(
                item.nome ||
                item.servico ||
                ''
              ),

            duracao:
              Number(
                item.duracao
              ),

            preco:
              Number(
                item.preco || 0
              )

          };

        }
      )
      .filter(
        function(item) {

          return (
            item.id &&
            item.nome &&
            Number.isFinite(
              item.duracao
            ) &&
            item.duracao > 0
          );

        }
      );

    preencherSelectServicos();

  } catch (erro) {

    console.error(erro);

    mostrarMensagem(
      'mensagemModal',
      'Erro ao carregar serviços: ' +
      erro.message,
      'erro'
    );

  }

}


function preencherSelectServicos() {

  const select =
    document.getElementById(
      'servico'
    );

  select.innerHTML =
    '<option value="">' +
    'Selecione o serviço' +
    '</option>';

  servicos.forEach(
    function(servico) {

      const option =
        document.createElement(
          'option'
        );

      option.value =
        servico.id;

      let texto =
        servico.nome +
        ' - ' +
        servico.duracao +
        ' min';

      if (
        servico.preco > 0
      ) {

        texto +=
          ' - R$ ' +
          servico.preco
            .toFixed(2)
            .replace('.',',');

      }

      option.textContent =
        texto;

      select.appendChild(
        option
      );

    }
  );

}


/* =====================================================
   HORÁRIOS
   ===================================================== */

async function atualizarHorarios() {

  horarioSelecionado = '';

  servicoSelecionado = null;

  document.getElementById(
    'resumo'
  ).style.display = 'none';

  const data =
    document.getElementById(
      'data'
    ).value;

  const servicoId =
    document.getElementById(
      'servico'
    ).value;

  const area =
    document.getElementById(
      'areaHorarios'
    );

  if (!data) {

    area.innerHTML =
      '<div class="carregando">' +
      'Selecione uma data.' +
      '</div>';

    return;

  }

  if (!servicoId) {

    area.innerHTML =
      '<div class="carregando">' +
      'Selecione o serviço.' +
      '</div>';

    return;

  }

  const servico =
    servicos.find(
      function(item) {

        return String(item.id) ===
          String(servicoId);

      }
    );

  if (!servico) {

    return;

  }

  servicoSelecionado =
    servico;

  area.innerHTML =
    '<div class="carregando">' +
    'Calculando horários...' +
    '</div>';

  try {

    const agendamentos =
      await buscarAgendamentos(
        data
      );

    agendamentosDoDia =
      agendamentos;

    renderizarHorarios(
      servico,
      agendamentos
    );

  } catch (erro) {

    area.innerHTML =
      '<div class="sem-horarios">' +
      'Erro ao carregar horários.<br><br>' +
      escapeHtml(
        erro.message
      ) +
      '</div>';

  }

}


/*
 * Gera os horários possíveis.
 *
 * Os horários são analisados minuto a minuto
 * internamente, mas NÃO mostramos todos os
 * minutos na tela.
 *
 * Mostramos apenas os pontos em que o horário
 * realmente pode começar considerando:
 *
 * - expediente;
 * - duração do serviço;
 * - agendamentos existentes.
 */

function renderizarHorarios(
  servico,
  agendamentos
) {

  const area =
    document.getElementById(
      'areaHorarios'
    );

  const duracao =
    Number(
      servico.duracao
    );

  const possiveis = [];

  /*
   * Primeiro horário sempre começa
   * no início do expediente.
   */

  let cursor =
    INICIO_EXPEDIENTE;


  /*
   * Ordena os agendamentos.
   */

  const agenda =
    agendamentos
      .map(
        function(item) {

          const inicio =
            horaParaMinutos(
              item.hora
            );

          const d =
            Number(
              item.duracao
            );

          return {

            inicio: inicio,

            fim:
              inicio +
              d

          };

        }
      )
      .filter(
        function(item) {

          return (
            item.inicio >= 0 &&
            item.fim > item.inicio
          );

        }
      )
      .sort(
        function(a,b) {

          return a.inicio -
            b.inicio;

        }
      );


  /*
   * Sem agendamentos:
   *
   * mostra somente o primeiro horário.
   *
   * Depois que o usuário escolher,
   * o próximo horário possível será
   * calculado normalmente.
   *
   * Para uma agenda já ocupada,
   * avançamos para o final de cada
   * agendamento.
   */

  while (
    cursor +
    duracao <=
    FIM_EXPEDIENTE
  ) {

    const conflito =
      encontrarConflito(
        cursor,
        cursor + duracao,
        agenda
      );

    if (!conflito) {

      possiveis.push({
        inicio: cursor,
        fim:
          cursor + duracao
      });

      /*
       * O próximo horário possível
       * é o término deste serviço.
       *
       * Assim não aparecem:
       *
       * 10:01
       * 10:02
       * 10:03...
       */

      cursor += duracao;

    } else {

      /*
       * Se houver conflito, pula diretamente
       * para o final do agendamento que bloqueia
       * o horário.
       */

      cursor =
        Math.max(
          cursor + 1,
          conflito.fim
        );

    }

  }


  /*
   * Remove duplicados.
   */

  const unicos = [];

  possiveis.forEach(
    function(item) {

      const existe =
        unicos.some(
          function(x) {

            return x.inicio ===
              item.inicio;

          }
        );

      if (!existe) {

        unicos.push(item);

      }

    }
  );


  if (unicos.length === 0) {

    area.innerHTML =
      '<div class="sem-horarios">' +
      'Não há horários disponíveis para este serviço nesta data.' +
      '</div>';

    return;

  }


  area.innerHTML = '';


  const info =
    document.createElement(
      'div'
    );

  info.className =
    'horario informacao';

  info.textContent =
    'Duração: ' +
    duracao +
    ' minutos';

  area.appendChild(info);


  unicos.forEach(
    function(item) {

      const botao =
        document.createElement(
          'button'
        );

      botao.type =
        'button';

      botao.className =
        'horario';

      botao.textContent =
        minutosParaHora(
          item.inicio
        );

      botao.title =
        'Término previsto: ' +
        minutosParaHora(
          item.fim
        );

      botao.onclick =
        function() {

          selecionarHorario(
            minutosParaHora(
              item.inicio
            ),
            botao
          );

        };

      area.appendChild(
        botao
      );

    }
  );

}


function encontrarConflito(
  inicio,
  fim,
  agenda
) {

  return agenda.find(
    function(item) {

      return (
        inicio < item.fim &&
        fim > item.inicio
      );

    }
  ) || null;

}


/* =====================================================
   SELECIONAR HORÁRIO
   ===================================================== */

function selecionarHorario(
  hora,
  botao
) {

  document
    .querySelectorAll(
      '#areaHorarios .horario'
    )
    .forEach(
      function(item) {

        item.classList.remove(
          'selecionado'
        );

      }
    );

  botao.classList.add(
    'selecionado'
  );

  horarioSelecionado =
    hora;

  atualizarResumo();

}


/* =====================================================
   RESUMO
   ===================================================== */

function atualizarResumo() {

  const data =
    document.getElementById(
      'data'
    ).value;

  const servicoId =
    document.getElementById(
      'servico'
    ).value;

  const resumo =
    document.getElementById(
      'resumo'
    );

  if (
    !data ||
    !servicoId ||
    !horarioSelecionado
  ) {

    resumo.style.display =
      'none';

    return;

  }

  const servico =
    servicos.find(
      function(item) {

        return String(item.id) ===
          String(servicoId);

      }
    );

  if (!servico) {

    resumo.style.display =
      'none';

    return;

  }

  const inicio =
    horaParaMinutos(
      horarioSelecionado
    );

  const fim =
    inicio +
    Number(
      servico.duracao
    );

  resumo.innerHTML =

    '<strong>Resumo:</strong><br>' +

    'Data: ' +
    formatarDataBR(data) +

    '<br>' +

    'Horário: ' +
    horarioSelecionado +

    '<br>' +

    'Término: ' +
    minutosParaHora(fim) +

    '<br>' +

    'Serviço: ' +
    escapeHtml(
      servico.nome
    ) +

    '<br>' +

    'Duração: ' +
    servico.duracao +
    ' minutos';

  resumo.style.display =
    'block';

}


/* =====================================================
   SALVAR + WHATSAPP
   ===================================================== */

async function salvarAgendamento() {

  const cliente =
    document.getElementById(
      'cliente'
    ).value.trim();

  const whatsapp =
    document.getElementById(
      'whatsapp'
    ).value.trim();

  const data =
    document.getElementById(
      'data'
    ).value;

  const servicoId =
    document.getElementById(
      'servico'
    ).value;

  const observacao =
    document.getElementById(
      'observacao'
    ).value.trim();


  if (!cliente) {

    mostrarMensagem(
      'mensagemModal',
      'Informe o nome da cliente.',
      'erro'
    );

    return;

  }

  if (!whatsapp) {

    mostrarMensagem(
      'mensagemModal',
      'Informe o WhatsApp.',
      'erro'
    );

    return;

  }

  if (!data) {

    mostrarMensagem(
      'mensagemModal',
      'Informe a data.',
      'erro'
    );

    return;

  }

  if (!servicoId) {

    mostrarMensagem(
      'mensagemModal',
      'Selecione o serviço.',
      'erro'
    );

    return;

  }

  if (!horarioSelecionado) {

    mostrarMensagem(
      'mensagemModal',
      'Selecione um horário.',
      'erro'
    );

    return;

  }


  const servico =
    servicos.find(
      function(item) {

        return String(item.id) ===
          String(servicoId);

      }
    );


  if (!servico) {

    mostrarMensagem(
      'mensagemModal',
      'Serviço inválido.',
      'erro'
    );

    return;

  }


  /*
   * =====================================================
   * ABRIMOS UMA ABA DO WHATSAPP ANTES DO FETCH
   * =====================================================
   *
   * Isso evita que o navegador bloqueie o popup,
   * porque window.open acontece diretamente
   * durante o clique do usuário.
   */

  let janelaWhatsApp = null;


  /*
   * Não abrimos ainda se os dados básicos
   * estiverem inválidos.
   *
   * Aqui já passaram pelas validações.
   */

  janelaWhatsApp =
    window.open(
      'about:blank',
      '_blank'
    );


  const btn =
    document.getElementById(
      'btnSalvar'
    );

  btn.disabled =
    true;

  btn.textContent =
    'Verificando...';


  try {

    /*
     * Busca novamente para conferir
     * disponibilidade antes de salvar.
     */

    const agendaAtual =
      await buscarAgendamentos(
        data
      );


    const inicioNovo =
      horaParaMinutos(
        horarioSelecionado
      );

    const fimNovo =
      inicioNovo +
      Number(
        servico.duracao
      );


    const conflito =
      encontrarConflito(
        inicioNovo,
        fimNovo,
        agendaAtual.map(
          function(item) {

            const inicio =
              horaParaMinutos(
                item.hora
              );

            const duracao =
              Number(
                item.duracao
              );

            return {

              inicio: inicio,

              fim:
                inicio +
                duracao

            };

          }
        )
      );


    if (conflito) {

      throw new Error(
        'Este horário não está mais disponível. Escolha outro.'
      );

    }


    btn.textContent =
      'Agendando...';


    /*
     * =====================================================
     * ENVIO PARA O CODE.GS
     * =====================================================
     */

    const dados = {

      acao:
        'agendar',

      cliente:
        cliente,

      whatsapp:
        whatsapp,

      data:
        data,

      hora:
        horarioSelecionado,

      servico:
        servico.nome,

      servicoId:
        servico.id,

      duracao:
        Number(
          servico.duracao
        ),

      observacao:
        observacao

    };


    const resposta =
      await fetch(
        API_URL,
        {

          method:
            'POST',

          headers: {

            'Content-Type':
              'text/plain;charset=utf-8'

          },

          body:
            JSON.stringify(
              dados
            )

        }
      );


    if (!resposta.ok) {

      throw new Error(
        'HTTP ' +
        resposta.status
      );

    }


    const resultado =
      await resposta.json();


    if (
      !resultado.sucesso
    ) {

      throw new Error(
        resultado.erro ||
        'Não foi possível realizar o agendamento.'
      );

    }


    /*
     * =====================================================
     * AGENDAMENTO SALVO!
     * AGORA MONTAMOS A MENSAGEM DO WHATSAPP.
     * =====================================================
     */

    const dataFormatada =
      formatarDataBR(data);


    const termino =
      minutosParaHora(
        inicioNovo +
        Number(
          servico.duracao
        )
      );


    let mensagem =

      'Olá, ' +
      cliente +
      '! 💕\n\n' +

      'Seu agendamento no ' +
      NOME_SALAO +
      ' foi realizado com sucesso! ✨\n\n' +

      '📅 *Data:* ' +
      dataFormatada +
      '\n' +

      '🕐 *Horário:* ' +
      horarioSelecionado +
      '\n' +

      '⏰ *Término previsto:* ' +
      termino +
      '\n' +

      '💅 *Serviço:* ' +
      servico.nome +
      '\n' +

      '⏱️ *Duração:* ' +
      servico.duracao +
      ' minutos';


    if (
      servico.preco > 0
    ) {

      mensagem +=
        '\n' +
        '💰 *Valor:* R$ ' +
        servico.preco
          .toFixed(2)
          .replace('.',',');

    }


    if (observacao) {

      mensagem +=
        '\n\n' +
        '📝 *Observação:* ' +
        observacao;

    }


    mensagem +=

      '\n\n' +

      'Até lá! 💖\n' +

      NOME_SALAO;


    /*
     * Número do WhatsApp.
     */

    const numero =
      prepararWhatsApp(
        whatsapp
      );


    if (!numero) {

      /*
       * O agendamento já foi salvo.
       * Apenas não conseguimos abrir o WhatsApp
       * porque o número é inválido.
       */

      if (janelaWhatsApp) {

        janelaWhatsApp.close();

      }

      mostrarMensagem(
        'mensagemPrincipal',
        'Agendamento realizado, mas o WhatsApp informado é inválido.',
        'erro'
      );

    } else {

      const urlWhatsApp =
        'https://wa.me/' +
        numero +
        '?text=' +
        encodeURIComponent(
          mensagem
        );


      /*
       * Redireciona a aba que já foi aberta.
       */

      if (janelaWhatsApp) {

        janelaWhatsApp.location.href =
          urlWhatsApp;

      } else {

        window.location.href =
          urlWhatsApp;

      }

    }


    mostrarMensagem(
      'mensagemPrincipal',
      'Agendamento realizado com sucesso.',
      'sucesso'
    );


    fecharModal();


    document.getElementById(
      'dataAgenda'
    ).value =
      data;


    carregarAgenda();


  } catch (erro) {

    console.error(
      'Erro ao salvar:',
      erro
    );


    /*
     * Se o agendamento falhou,
     * fechamos a aba vazia.
     */

    if (janelaWhatsApp) {

      janelaWhatsApp.close();

    }


    mostrarMensagem(
      'mensagemModal',
      erro.message ||
      'Erro ao realizar agendamento.',
      'erro'
    );


  } finally {

    btn.disabled =
      false;

    btn.textContent =
      'Agendar Cliente';

  }

}


/* =====================================================
   WHATSAPP
   ===================================================== */

function prepararWhatsApp(
  numero
) {

  let telefone =
    String(
      numero || ''
    ).replace(
      /\D/g,
      ''
    );


  if (!telefone) {

    return '';

  }


  /*
   * Brasil:
   *
   * 31999999999
   *
   * vira:
   *
   * 5531999999999
   */

  if (
    telefone.length === 10 ||
    telefone.length === 11
  ) {

    telefone =
      '55' +
      telefone;

  }


  /*
   * Número brasileiro completo.
   */

  if (
    telefone.startsWith('55') &&
    (
      telefone.length === 12 ||
      telefone.length === 13
    )
  ) {

    return telefone;

  }


  return '';

}


/* =====================================================
   AGENDA
   ===================================================== */

async function buscarAgendamentos(
  data
) {

  const url =
    API_URL +
    '?acao=agendamentos' +
    '&data=' +
    encodeURIComponent(data) +
    '&_=' +
    Date.now();


  const resposta =
    await fetch(
      url,
      {
        cache: 'no-store'
      }
    );


  if (!resposta.ok) {

    throw new Error(
      'HTTP ' +
      resposta.status
    );

  }


  const dados =
    await resposta.json();


  if (
    Array.isArray(dados)
  ) {

    return dados;

  }


  if (
    dados &&
    Array.isArray(
      dados.agendamentos
    )
  ) {

    return dados.agendamentos;

  }


  throw new Error(
    'Resposta inválida dos agendamentos.'
  );

}


async function carregarAgenda() {

  const data =
    document.getElementById(
      'dataAgenda'
    ).value;


  const area =
    document.getElementById(
      'listaAgendamentos'
    );


  if (!data) {

    return;

  }


  area.innerHTML =
    '<div class="carregando">' +
    'Carregando agendamentos...' +
    '</div>';


  try {

    const dados =
      await buscarAgendamentos(
        data
      );

    renderizarAgenda(
      dados
    );

  } catch (erro) {

    area.innerHTML =
      '<div class="sem-horarios">' +
      'Erro ao carregar a agenda.<br><br>' +
      '<small>' +
      escapeHtml(
        erro.message
      ) +
      '</small>' +
      '</div>';

  }

}


function renderizarAgenda(
  agendamentos
) {

  const area =
    document.getElementById(
      'listaAgendamentos'
    );


  if (
    !agendamentos ||
    agendamentos.length === 0
  ) {

    area.innerHTML =
      '<h3>Agendamentos do dia</h3>' +
      '<div class="carregando">' +
      'Nenhum agendamento para esta data.' +
      '</div>';

    return;

  }


  agendamentos.sort(
    function(a,b) {

      return (
        horaParaMinutos(a.hora) -
        horaParaMinutos(b.hora)
      );

    }
  );


  let html =
    '<h3>Agendamentos do dia</h3>';


  agendamentos.forEach(
    function(item) {

      const inicio =
        horaParaMinutos(
          item.hora
        );


      const duracao =
        Number(
          item.duracao || 0
        );


      const fim =
        inicio +
        duracao;


      html +=

        '<div class="agendamento">' +

        '<div class="agendamento-topo">' +

        '<div>' +

        '<strong>' +

        escapeHtml(
          item.hora
        ) +

        ' - ' +

        escapeHtml(
          item.cliente
        ) +

        '</strong>' +

        '</div>' +

        '<button ' +
        'class="btn-cancelar" ' +
        'onclick="cancelarAgendamento(\'' +
        escapeHtmlJS(item.id) +
        '\')">' +

        'Cancelar' +

        '</button>' +

        '</div>' +

        '<div class="info">' +

        '<strong>Serviço:</strong> ' +

        escapeHtml(
          item.servico
        ) +

        ' (' +

        duracao +

        ' min)' +

        '</div>' +

        '<div class="info">' +

        '<strong>Horário:</strong> ' +

        escapeHtml(
          item.hora
        ) +

        ' até ' +

        minutosParaHora(
          fim
        ) +

        '</div>' +

        '<div class="info">' +

        '<strong>WhatsApp:</strong> ' +

        escapeHtml(
          item.whatsapp
        ) +

        '</div>' +

        (
          item.observacao
          ?
          '<div class="info">' +
          '<strong>Observação:</strong> ' +
          escapeHtml(
            item.observacao
          ) +
          '</div>'
          :
          ''
        ) +

        '</div>';

    }
  );


  area.innerHTML =
    html;

}


/* =====================================================
   CANCELAR
   ===================================================== */

async function cancelarAgendamento(
  id
) {

  if (
    !confirm(
      'Deseja realmente cancelar este agendamento?'
    )
  ) {

    return;

  }


  try {

    const resposta =
      await fetch(
        API_URL,
        {

          method:
            'POST',

          headers: {

            'Content-Type':
              'text/plain;charset=utf-8'

          },

          body:
            JSON.stringify({

              acao:
                'cancelar',

              id:
                id

            })

        }
      );


    const resultado =
      await resposta.json();


    if (
      !resultado.sucesso
    ) {

      throw new Error(
        resultado.erro ||
        'Erro ao cancelar.'
      );

    }


    mostrarMensagem(
      'mensagemPrincipal',
      'Agendamento cancelado com sucesso.',
      'sucesso'
    );


    carregarAgenda();


  } catch (erro) {

    mostrarMensagem(
      'mensagemPrincipal',
      erro.message,
      'erro'
    );

  }

}


/* =====================================================
   UTILITÁRIOS
   ===================================================== */

function horaParaMinutos(
  hora
) {

  if (!hora) {

    return -1;

  }


  const partes =
    String(
      hora
    ).split(':');


  if (
    partes.length < 2
  ) {

    return -1;

  }


  const h =
    Number(
      partes[0]
    );

  const m =
    Number(
      partes[1]
    );


  if (
    !Number.isFinite(h) ||
    !Number.isFinite(m)
  ) {

    return -1;

  }


  return h * 60 + m;

}


function minutosParaHora(
  minutos
) {

  const valor =
    Number(
      minutos
    );


  if (
    !Number.isFinite(valor)
  ) {

    return '';

  }


  return (
    String(
      Math.floor(
        valor / 60
      )
    ).padStart(2,'0') +
    ':' +
    String(
      valor % 60
    ).padStart(2,'0')
  );

}


function formatarDataBR(
  data
) {

  const partes =
    String(
      data
    ).split('-');


  if (
    partes.length !== 3
  ) {

    return data;

  }


  return (
    partes[2] +
    '/' +
    partes[1] +
    '/' +
    partes[0]
  );

}


function mostrarMensagem(
  id,
  texto,
  tipo
) {

  const elemento =
    document.getElementById(
      id
    );


  if (!elemento) {

    return;

  }


  elemento.textContent =
    texto;

  elemento.className =
    'mensagem ' +
    tipo;


  setTimeout(
    function() {

      esconderMensagem(
        id
      );

    },
    5000
  );

}


function esconderMensagem(
  id
) {

  const elemento =
    document.getElementById(
      id
    );


  if (!elemento) {

    return;

  }


  elemento.className =
    'mensagem';

  elemento.textContent =
    '';

}


function escapeHtml(
  texto
) {

  return String(
    texto || ''
  )

  .replace(
    /&/g,
    '&amp;'
  )

  .replace(
    /</g,
    '&lt;'
  )

  .replace(
    />/g,
    '&gt;'
  )

  .replace(
    /"/g,
    '&quot;'
  )

  .replace(
    /'/g,
    '&#039;'
  );

}


function escapeHtmlJS(
  texto
) {

  return String(
    texto || ''
  )

  .replace(
    /\\/g,
    '\\\\'
  )

  .replace(
    /'/g,
    "\\'"
  )

  .replace(
    /"/g,
    '\\"'
  );

}


/* =====================================================
   FECHAR CLICANDO FORA
   ===================================================== */

document
  .getElementById(
    'modal'
  )
  .addEventListener(
    'click',
    function(event) {

      if (
        event.target === this
      ) {

        fecharModal();

      }

    }
  );

</script>
