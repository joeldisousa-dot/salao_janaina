<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Agenda - Salão Janaina</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f8f5f7;
  color: #333;
}

header {
  background: linear-gradient(135deg,#8e4168,#c66d9c);
  color: white;
  padding: 25px 20px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 27px;
}

header p {
  margin: 7px 0 0;
  opacity: .9;
}

.container {
  width: 100%;
  max-width: 1000px;
  margin: 25px auto;
  padding: 0 15px;
}

.topo {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 20px;
}

.topo h2 {
  margin: 0;
  color: #713253;
}

button {
  border: 0;
  cursor: pointer;
  font-family: inherit;
}

.btn-principal {
  background: #8e4168;
  color: white;
  padding: 13px 20px;
  border-radius: 10px;
  font-size: 15px;
  font-weight: bold;
}

.btn-principal:hover {
  background: #713253;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 3px 15px rgba(0,0,0,.07);
}

.card h3 {
  margin-top: 0;
  color: #713253;
}

.filtro {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

label {
  display: block;
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 7px;
  color: #555;
}

input,
select,
textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 9px;
  font-size: 15px;
  outline: none;
  background: white;
}

input:focus,
select:focus,
textarea:focus {
  border-color: #b65f8d;
}

textarea {
  min-height: 80px;
  resize: vertical;
}

.campo {
  margin-bottom: 16px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 15px;
}


/* =========================================================
   HORÁRIOS
   ========================================================= */

.horarios {
  display: grid;
  grid-template-columns:
    repeat(auto-fill,minmax(90px,1fr));

  gap: 10px;
  margin-top: 10px;
}

.horario {
  padding: 12px 8px;
  border-radius: 10px;
  background: #f4e6ee;
  color: #713253;
  border: 2px solid transparent;
  font-size: 15px;
  font-weight: bold;
  transition: .15s;
}

.horario:hover {
  background: #e8cadb;
}

.horario.selecionado {
  background: #8e4168;
  color: white;
  border-color: #713253;
}

.horario.ocupado {
  background: #eee;
  color: #aaa;
  cursor: not-allowed;
  text-decoration: line-through;
}


/* =========================================================
   INFORMAÇÃO DA DURAÇÃO
   ========================================================= */

.info-duracao {
  background: #f8f1f5;
  color: #713253;
  border-radius: 9px;
  padding: 10px 12px;
  margin-top: 8px;
  font-size: 14px;
}

.info-duracao strong {
  color: #8e4168;
}


/* =========================================================
   MENSAGENS
   ========================================================= */

.mensagem {
  padding: 12px;
  border-radius: 9px;
  margin-bottom: 15px;
  display: none;
}

.mensagem.erro {
  display: block;
  background: #ffe4e4;
  color: #a00000;
}

.mensagem.sucesso {
  display: block;
  background: #e2f7e8;
  color: #176b2d;
}

.carregando {
  text-align: center;
  color: #777;
  padding: 15px;
}

.sem-horarios {
  background: #fff4f4;
  color: #a33;
  padding: 15px;
  border-radius: 10px;
  text-align: center;
}


/* =========================================================
   AGENDAMENTOS
   ========================================================= */

.agendamento {
  border: 1px solid #eee;
  border-left: 5px solid #8e4168;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 12px;
  background: #fff;
}

.agendamento-topo {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}

.agendamento strong {
  color: #713253;
}

.info {
  margin-top: 7px;
  font-size: 14px;
  color: #555;
}

.btn-cancelar {
  background: #ffe1e1;
  color: #a00000;
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: bold;
}

.btn-cancelar:hover {
  background: #ffcaca;
}


/* =========================================================
   MODAL
   ========================================================= */

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  z-index: 999;
  padding: 20px;
  overflow-y: auto;
}

.modal.ativo {
  display: flex;
  align-items: flex-start;
  justify-content: center;
}

.modal-conteudo {
  background: white;
  width: 100%;
  max-width: 650px;
  margin: 20px auto;
  border-radius: 18px;
  padding: 25px;
  box-shadow: 0 10px 40px rgba(0,0,0,.2);
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.modal-header h2 {
  margin: 0;
  color: #713253;
}

.fechar {
  width: 35px;
  height: 35px;
  border-radius: 50%;
  background: #f2e6ed;
  color: #713253;
  font-size: 20px;
}

.fechar:hover {
  background: #e5cedb;
}

.resumo {
  background: #f8f1f5;
  border-radius: 10px;
  padding: 12px;
  margin-top: 15px;
  color: #713253;
  font-size: 14px;
}

.acoes {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  margin-top: 20px;
}

.btn-secundario {
  background: #eee;
  color: #444;
  padding: 12px 18px;
  border-radius: 9px;
  font-weight: bold;
}

.btn-salvar {
  background: #8e4168;
  color: white;
  padding: 12px 20px;
  border-radius: 9px;
  font-weight: bold;
}

.btn-salvar:hover {
  background: #713253;
}

.btn-salvar:disabled {
  background: #aaa;
  cursor: not-allowed;
}

.preco {
  color: #8e4168;
  font-weight: bold;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width:600px) {

  .grid {
    grid-template-columns: 1fr;
  }

  .topo {
    align-items: stretch;
    flex-direction: column;
  }

  .topo .btn-principal {
    width: 100%;
  }

  .modal {
    padding: 10px;
  }

  .modal-conteudo {
    margin: 5px auto;
    padding: 18px;
  }

  .horarios {
    grid-template-columns:
      repeat(3,1fr);
  }

}

</style>

</head>


<body>


<header>

  <h1>Salão Janaina</h1>

  <p>Agenda de clientes</p>

</header>


<div class="container">


  <div class="topo">

    <h2>Agenda</h2>

    <button
      class="btn-principal"
      onclick="abrirNovoAgendamento()"
    >
      + Novo Agendamento
    </button>

  </div>


  <div
    id="mensagemPrincipal"
    class="mensagem"
  ></div>


  <div class="card">

    <h3>Agendamentos do dia</h3>

    <div class="filtro">

      <div
        style="width:100%;max-width:250px"
      >

        <label for="dataAgenda">
          Data
        </label>

        <input
          type="date"
          id="dataAgenda"
          onchange="carregarAgenda()"
        >

      </div>

    </div>

  </div>


  <div
    id="listaAgendamentos"
    class="card"
  >

    <div class="carregando">
      Carregando...
    </div>

  </div>


</div>



<!-- =======================================================
     MODAL
======================================================== -->

<div
  id="modal"
  class="modal"
>

  <div class="modal-conteudo">


    <div class="modal-header">

      <h2>Novo Agendamento</h2>

      <button
        class="fechar"
        onclick="fecharModal()"
      >
        ×
      </button>

    </div>


    <div
      id="mensagemModal"
      class="mensagem"
    ></div>


    <div class="campo">

      <label for="cliente">
        Nome da cliente *
      </label>

      <input
        type="text"
        id="cliente"
        placeholder="Digite o nome da cliente"
      >

    </div>


    <div class="campo">

      <label for="whatsapp">
        WhatsApp *
      </label>

      <input
        type="tel"
        id="whatsapp"
        placeholder="(31) 99999-9999"
      >

    </div>


    <div class="grid">


      <div class="campo">

        <label for="data">
          Data *
        </label>

        <input
          type="date"
          id="data"
          onchange="atualizarHorarios()"
        >

      </div>


      <div class="campo">

        <label for="servico">
          Serviço *
        </label>

        <select
          id="servico"
          onchange="atualizarHorarios()"
        >

          <option value="">
            Selecione o serviço
          </option>

        </select>


        <div
          id="informacaoDuracao"
          class="info-duracao"
          style="display:none"
        ></div>

      </div>

    </div>


    <div class="campo">

      <label>
        Horários disponíveis *
      </label>

      <div
        id="areaHorarios"
        class="horarios"
      >

        <div class="carregando">
          Selecione a data e o serviço.
        </div>

      </div>

    </div>


    <div class="campo">

      <label for="observacao">
        Observação
      </label>

      <textarea
        id="observacao"
        placeholder="Observações da cliente..."
      ></textarea>

    </div>


    <div
      id="resumo"
      class="resumo"
      style="display:none"
    ></div>


    <div class="acoes">

      <button
        class="btn-secundario"
        onclick="fecharModal()"
      >
        Cancelar
      </button>

      <button
        id="btnSalvar"
        class="btn-salvar"
        onclick="salvarAgendamento()"
      >
        Agendar Cliente
      </button>

    </div>


  </div>

</div>



<script>


/* =========================================================
   CONFIGURAÇÃO
========================================================= */

const API_URL =
  'https://script.google.com/macros/s/AKfycbwp9RPaerz5Qe0k-DVjlUMoEn16Pdw4JYyayCR9-CXW0ImT8XkRUmKjbNmXCzaZQqRc/exec';


/*
 * Horário de funcionamento.
 */
const INICIO_EXPEDIENTE = 8 * 60;
const FIM_EXPEDIENTE = 18 * 60;


/*
 * IMPORTANTE:
 *
 * NÃO existe intervalo fixo de 30 minutos.
 *
 * O intervalo é SEMPRE a duração
 * do serviço selecionado.
 */


let servicos = [];

let agendamentosDoDia = [];

let horarioSelecionado = '';

let carregandoServicos = false;


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

document.addEventListener(
  'DOMContentLoaded',
  async function() {

    const hoje =
      obterDataHoje();


    document.getElementById(
      'dataAgenda'
    ).value = hoje;


    document.getElementById(
      'dataAgenda'
    ).min = hoje;


    document.getElementById(
      'data'
    ).min = hoje;


    await carregarServicos();


    carregarAgenda();

  }
);


/* =========================================================
   DATA DE HOJE
========================================================= */

function obterDataHoje() {

  const agora =
    new Date();


  const ano =
    agora.getFullYear();


  const mes =
    String(
      agora.getMonth() + 1
    ).padStart(2,'0');


  const dia =
    String(
      agora.getDate()
    ).padStart(2,'0');


  return (
    ano +
    '-' +
    mes +
    '-' +
    dia
  );

}


/* =========================================================
   ABRIR MODAL
========================================================= */

async function abrirNovoAgendamento() {

  limparFormulario();


  const dataAgenda =
    document.getElementById(
      'dataAgenda'
    ).value;


  document.getElementById(
    'data'
  ).value =
    dataAgenda ||
    obterDataHoje();


  document.getElementById(
    'modal'
  ).classList.add('ativo');


  if (
    servicos.length === 0
  ) {

    await carregarServicos();

  }


  atualizarHorarios();

}


/* =========================================================
   FECHAR MODAL
========================================================= */

function fecharModal() {

  document.getElementById(
    'modal'
  ).classList.remove('ativo');

}


/* =========================================================
   LIMPAR FORMULÁRIO
========================================================= */

function limparFormulario() {

  document.getElementById(
    'cliente'
  ).value = '';


  document.getElementById(
    'whatsapp'
  ).value = '';


  document.getElementById(
    'observacao'
  ).value = '';


  document.getElementById(
    'servico'
  ).value = '';


  horarioSelecionado = '';


  document.getElementById(
    'resumo'
  ).style.display = 'none';


  document.getElementById(
    'informacaoDuracao'
  ).style.display = 'none';


  document.getElementById(
    'areaHorarios'
  ).innerHTML =
    '<div class="carregando">' +
    'Selecione a data e o serviço.' +
    '</div>';


  esconderMensagem(
    'mensagemModal'
  );

}


/* =========================================================
   CARREGAR SERVIÇOS
========================================================= */

async function carregarServicos() {

  if (carregandoServicos) {
    return;
  }


  carregandoServicos = true;


  try {

    const resposta =
      await fetch(
        API_URL +
        '?acao=servicos&_=' +
        Date.now(),
        {
          method: 'GET',
          cache: 'no-store'
        }
      );


    if (!resposta.ok) {

      throw new Error(
        'Erro HTTP ' +
        resposta.status
      );

    }


    const dados =
      await resposta.json();


    if (!Array.isArray(dados)) {

      /*
       * Seu Code.gs pode retornar
       * diretamente array ou objeto.
       */

      if (
        dados &&
        Array.isArray(dados.servicos)
      ) {

        servicos =
          normalizarServicos(
            dados.servicos
          );

      } else {

        throw new Error(
          'Resposta inválida dos serviços.'
        );

      }

    } else {

      servicos =
        normalizarServicos(
          dados
        );

    }


    preencherSelectServicos();


  } catch (erro) {

    console.error(
      'Erro serviços:',
      erro
    );


    mostrarMensagem(
      'mensagemModal',
      'Erro ao carregar serviços: ' +
      erro.message,
      'erro'
    );


  } finally {

    carregandoServicos = false;

  }

}


/* =========================================================
   NORMALIZAR SERVIÇOS
========================================================= */

function normalizarServicos(lista) {

  return lista
    .map(function(servico) {

      return {

        id:
          String(
            servico.id ?? ''
          ),

        nome:
          String(
            servico.nome ||
            servico.servico ||
            ''
          ),

        /*
         * A duração vem da aba SERVICOS.
         */
        duracao:
          converterNumero(
            servico.duracao
          ),

        preco:
          converterNumero(
            servico.preco
          )

      };

    })
    .filter(function(servico) {

      return (
        servico.id &&
        servico.nome &&
        servico.duracao > 0
      );

    });

}


/* =========================================================
   PREENCHER SERVIÇOS
========================================================= */

function preencherSelectServicos() {

  const select =
    document.getElementById(
      'servico'
    );


  const valorAtual =
    select.value;


  select.innerHTML =
    '<option value="">' +
    'Selecione o serviço' +
    '</option>';


  servicos.forEach(
    function(servico) {

      const option =
        document.createElement(
          'option'
        );


      /*
       * O VALUE é o ID do serviço.
       */
      option.value =
        servico.id;


      let texto =
        servico.nome;


      texto +=
        ' - ' +
        servico.duracao +
        ' min';


      if (
        servico.preco > 0
      ) {

        texto +=
          ' - R$ ' +
          servico.preco
            .toFixed(2)
            .replace('.',',');

      }


      option.textContent =
        texto;


      select.appendChild(
        option
      );

    }
  );


  if (valorAtual) {

    select.value =
      valorAtual;

  }

}


/* =========================================================
   DATA OU SERVIÇO ALTERADO
========================================================= */

function atualizarHorarios() {

  horarioSelecionado = '';


  document.getElementById(
    'resumo'
  ).style.display = 'none';


  const data =
    document.getElementById(
      'data'
    ).value;


  const servicoId =
    document.getElementById(
      'servico'
    ).value;


  const area =
    document.getElementById(
      'areaHorarios'
    );


  const infoDuracao =
    document.getElementById(
      'informacaoDuracao'
    );


  if (!data) {

    infoDuracao.style.display =
      'none';


    area.innerHTML =
      '<div class="carregando">' +
      'Selecione uma data.' +
      '</div>';

    return;

  }


  if (!servicoId) {

    infoDuracao.style.display =
      'none';


    area.innerHTML =
      '<div class="carregando">' +
      'Agora selecione o serviço.' +
      '</div>';

    return;

  }


  const servico =
    servicos.find(
      function(item) {

        return String(item.id) ===
          String(servicoId);

      }
    );


  if (
    !servico ||
    servico.duracao <= 0
  ) {

    infoDuracao.style.display =
      'none';


    area.innerHTML =
      '<div class="sem-horarios">' +
      'A duração deste serviço é inválida.' +
      '</div>';

    return;

  }


  /*
   * Mostra claramente qual duração
   * está sendo usada.
   */

  infoDuracao.innerHTML =
    '<strong>Duração:</strong> ' +
    servico.duracao +
    ' minutos';


  infoDuracao.style.display =
    'block';


  area.innerHTML =
    '<div class="carregando">' +
    'Calculando horários usando ' +
    '<strong>' +
    servico.duracao +
    ' minutos' +
    '</strong>...' +
    '</div>';


  carregarAgendamentosParaHorarios(
    data,
    servico
  );

}


/* =========================================================
   BUSCAR AGENDAMENTOS
========================================================= */

async function carregarAgendamentosParaHorarios(
  data,
  servico
) {

  try {

    const resposta =
      await fetch(
        API_URL +
        '?acao=agendamentos' +
        '&data=' +
        encodeURIComponent(data) +
        '&_=' +
        Date.now(),
        {
          method: 'GET',
          cache: 'no-store'
        }
      );


    if (!resposta.ok) {

      throw new Error(
        'Erro HTTP ' +
        resposta.status
      );

    }


    const dados =
      await resposta.json();


    let agenda;


    if (Array.isArray(dados)) {

      agenda = dados;

    } else if (
      dados &&
      Array.isArray(dados.agendamentos)
    ) {

      agenda =
        dados.agendamentos;

    } else {

      throw new Error(
        'Resposta inválida dos agendamentos.'
      );

    }


    agendamentosDoDia =
      normalizarAgendamentos(
        agenda
      );


    renderizarHorariosPorDuracao(
      servico.duracao,
      agendamentosDoDia
    );


  } catch (erro) {

    console.error(
      'Erro agendamentos:',
      erro
    );


    document.getElementById(
      'areaHorarios'
    ).innerHTML =
      '<div class="sem-horarios">' +
      'Não foi possível carregar os horários.<br><br>' +
      '<small>' +
      escapeHtml(
        erro.message
      ) +
      '</small>' +
      '</div>';

  }

}


/* =========================================================
   NORMALIZAR AGENDAMENTOS
========================================================= */

function normalizarAgendamentos(lista) {

  return lista
    .map(function(item) {

      return {

        id:
          String(
            item.id || ''
          ),

        data:
          String(
            item.data || ''
          ),

        hora:
          String(
            item.hora || ''
          ),

        cliente:
          String(
            item.cliente || ''
          ),

        whatsapp:
          String(
            item.whatsapp || ''
          ),

        servico:
          String(
            item.servico || ''
          ),

        /*
         * A duração do agendamento
         * existente também é real.
         */
        duracao:
          converterNumero(
            item.duracao
          ),

        observacao:
          String(
            item.observacao || ''
          ),

        status:
          String(
            item.status ||
            'AGENDADO'
          )

      };

    })
    .filter(function(item) {

      return (
        item.hora &&
        item.duracao > 0 &&
        item.status.toUpperCase() !==
        'CANCELADO'
      );

    });

}


/* =========================================================
   GERAR HORÁRIOS
========================================================= */

/*
 * ============================================================
 *
 * ESTA É A PARTE MAIS IMPORTANTE DO HTML.
 *
 * NÃO EXISTE INTERVALO FIXO DE 30 MINUTOS.
 *
 * O intervalo usado é:
 *
 *     DURACAO DO SERVIÇO
 *
 * ============================================================
 *
 * Exemplo:
 *
 * duração = 40
 *
 * 08:00
 * 08:40
 * 09:20
 * 10:00
 * 10:40
 *
 *
 * Se houver:
 *
 * 10:00 → 10:40
 *
 * então 10:00 fica ocupado
 * e o próximo horário possível
 * será 10:40.
 *
 * ============================================================
 */

function renderizarHorariosPorDuracao(
  duracaoServico,
  agendamentos
) {

  const area =
    document.getElementById(
      'areaHorarios'
    );


  const duracao =
    Number(
      duracaoServico
    );


  if (
    !duracao ||
    duracao <= 0
  ) {

    area.innerHTML =
      '<div class="sem-horarios">' +
      'Duração do serviço inválida.' +
      '</div>';

    return;

  }


  const inicioExpediente =
    INICIO_EXPEDIENTE;


  const fimExpediente =
    FIM_EXPEDIENTE;


  /*
   * Copia e ordena os agendamentos.
   */

  const agenda =
    Array.isArray(agendamentos)
      ? agendamentos
          .filter(function(item) {

            return (
              horaParaMinutos(
                item.hora
              ) >= 0 &&
              Number(item.duracao) > 0
            );

          })
          .sort(function(a,b) {

            return (
              horaParaMinutos(a.hora) -
              horaParaMinutos(b.hora)
            );

          })
      : [];


  const horarios = [];


  /*
   * ========================================================
   * COMEÇA ÀS 08:00.
   * ========================================================
   */

  let cursor =
    inicioExpediente;


  /*
   * Segurança contra loop.
   */

  let contador =
    0;


  while (
    cursor + duracao <= fimExpediente &&
    contador < 100
  ) {

    contador++;


    /*
     * Procura se o horário atual
     * entra em conflito com algum
     * agendamento existente.
     */

    const conflito =
      agenda.find(
        function(agendamento) {

          const inicioExistente =
            horaParaMinutos(
              agendamento.hora
            );


          const duracaoExistente =
            Number(
              agendamento.duracao
            );


          const fimExistente =
            inicioExistente +
            duracaoExistente;


          /*
           * INTERVALOS:
           *
           * Novo:
           * cursor → cursor + duração
           *
           * Existente:
           * início → fim
           *
           * Se cruzar, está ocupado.
           */

          return (
            cursor <
              fimExistente
            &&
            cursor + duracao >
              inicioExistente
          );

        }
      );


    /*
     * ======================================================
     * HORÁRIO LIVRE
     * ======================================================
     */

    if (!conflito) {

      horarios.push({

        hora:
          minutosParaHora(
            cursor
          ),

        disponivel: true

      });


      /*
       * PRÓXIMO HORÁRIO:
       *
       * horário atual
       * +
       * duração do serviço
       */

      cursor =
        cursor +
        duracao;


      continue;

    }


    /*
     * ======================================================
     * HORÁRIO OCUPADO
     * ======================================================
     */

    const inicioOcupado =
      horaParaMinutos(
        conflito.hora
      );


    const duracaoOcupada =
      Number(
        conflito.duracao
      );


    const fimOcupado =
      inicioOcupado +
      duracaoOcupada;


    /*
     * O próximo horário começa
     * exatamente quando termina
     * o agendamento que bloqueou.
     *
     * Exemplo:
     *
     * 10:00 + 50 = 10:50
     *
     * próximo = 10:50
     */

    cursor =
      Math.max(
        cursor + 1,
        fimOcupado
      );

  }


  /*
   * Nenhum horário.
   */

  if (
    horarios.length === 0
  ) {

    area.innerHTML =
      '<div class="sem-horarios">' +
      'Não há horários disponíveis para este serviço nesta data.' +
      '</div>';

    return;

  }


  /*
   * ========================================================
   * DESENHAR HORÁRIOS
   * ========================================================
   */

  area.innerHTML = '';


  horarios.forEach(
    function(item) {

      const botao =
        document.createElement(
          'button'
        );


      botao.type =
        'button';


      botao.textContent =
        item.hora;


      botao.className =
        'horario';


      /*
       * Todos que chegaram aqui
       * estão disponíveis.
       */

      botao.onclick =
        function() {

          selecionarHorario(
            item.hora,
            botao
          );

        };


      area.appendChild(
        botao
      );

    }
  );

}


/* =========================================================
   SELECIONAR HORÁRIO
========================================================= */

function selecionarHorario(
  hora,
  botao
) {

  document
    .querySelectorAll(
      '#areaHorarios .horario'
    )
    .forEach(
      function(item) {

        item.classList.remove(
          'selecionado'
        );

      }
    );


  botao.classList.add(
    'selecionado'
  );


  horarioSelecionado =
    hora;


  atualizarResumo();

}


/* =========================================================
   RESUMO
========================================================= */

function atualizarResumo() {

  const data =
    document.getElementById(
      'data'
    ).value;


  const servicoId =
    document.getElementById(
      'servico'
    ).value;


  const resumo =
    document.getElementById(
      'resumo'
    );


  if (
    !data ||
    !servicoId ||
    !horarioSelecionado
  ) {

    resumo.style.display =
      'none';

    return;

  }


  const servico =
    servicos.find(
      function(item) {

        return String(item.id) ===
          String(servicoId);

      }
    );


  if (!servico) {

    resumo.style.display =
      'none';

    return;

  }


  const inicio =
    horaParaMinutos(
      horarioSelecionado
    );


  const fim =
    inicio +
    Number(
      servico.duracao
    );


  resumo.innerHTML =

    '<strong>Resumo:</strong><br>' +

    'Data: ' +
    formatarDataBR(data) +

    '<br>' +

    'Horário: ' +
    horarioSelecionado +

    '<br>' +

    'Previsão de término: ' +
    minutosParaHora(fim) +

    '<br>' +

    'Serviço: ' +
    escapeHtml(
      servico.nome
    ) +

    '<br>' +

    'Duração: ' +
    servico.duracao +
    ' minutos';


  resumo.style.display =
    'block';

}


/* =========================================================
   SALVAR AGENDAMENTO
========================================================= */

async function salvarAgendamento() {

  const cliente =
    document.getElementById(
      'cliente'
    ).value.trim();


  const whatsapp =
    document.getElementById(
      'whatsapp'
    ).value.trim();


  const data =
    document.getElementById(
      'data'
    ).value;


  const servicoId =
    document.getElementById(
      'servico'
    ).value;


  const observacao =
    document.getElementById(
      'observacao'
    ).value.trim();


  if (!cliente) {

    mostrarMensagem(
      'mensagemModal',
      'Informe o nome da cliente.',
      'erro'
    );

    return;

  }


  if (!whatsapp) {

    mostrarMensagem(
      'mensagemModal',
      'Informe o WhatsApp da cliente.',
      'erro'
    );

    return;

  }


  if (!data) {

    mostrarMensagem(
      'mensagemModal',
      'Informe a data.',
      'erro'
    );

    return;

  }


  if (!servicoId) {

    mostrarMensagem(
      'mensagemModal',
      'Selecione o serviço.',
      'erro'
    );

    return;

  }


  if (!horarioSelecionado) {

    mostrarMensagem(
      'mensagemModal',
      'Selecione um horário.',
      'erro'
    );

    return;

  }


  const servico =
    servicos.find(
      function(item) {

        return String(item.id) ===
          String(servicoId);

      }
    );


  if (
    !servico ||
    !servico.duracao
  ) {

    mostrarMensagem(
      'mensagemModal',
      'Não foi possível identificar a duração do serviço.',
      'erro'
    );

    return;

  }


  const inicioNovo =
    horaParaMinutos(
      horarioSelecionado
    );


  const fimNovo =
    inicioNovo +
    Number(
      servico.duracao
    );


  if (
    fimNovo >
    FIM_EXPEDIENTE
  ) {

    mostrarMensagem(
      'mensagemModal',
      'Este serviço termina após o horário de funcionamento.',
      'erro'
    );

    return;

  }


  const btn =
    document.getElementById(
      'btnSalvar'
    );


  btn.disabled = true;

  btn.textContent =
    'Agendando...';


  try {

    /*
     * VERIFICA A AGENDA NOVAMENTE
     * ANTES DE SALVAR.
     */

    const respostaAgenda =
      await fetch(
        API_URL +
        '?acao=agendamentos' +
        '&data=' +
        encodeURIComponent(data) +
        '&_=' +
        Date.now(),
        {
          method: 'GET',
          cache: 'no-store'
        }
      );


    if (!respostaAgenda.ok) {

      throw new Error(
        'Não foi possível verificar a agenda. HTTP ' +
        respostaAgenda.status
      );

    }


    const dadosAgenda =
      await respostaAgenda.json();


    const agendaAtual =
      Array.isArray(dadosAgenda)
        ? dadosAgenda
        : (
            dadosAgenda &&
            Array.isArray(
              dadosAgenda.agendamentos
            )
              ? dadosAgenda.agendamentos
              : []
          );


    const agendaNormalizada =
      normalizarAgendamentos(
        agendaAtual
      );


    const conflito =
      verificarConflito(
        inicioNovo,
        fimNovo,
        agendaNormalizada
      );


    if (conflito) {

      throw new Error(
        'Este horário acabou de ser ocupado. Escolha outro horário.'
      );

    }


    /*
     * ======================================================
     * ENVIA O ID E O NOME DO SERVIÇO.
     *
     * A duração enviada é a mesma que veio
     * da aba Servicos.
     * ======================================================
     */

    const dados = {

      acao:
        'agendar',

      cliente:
        cliente,

      whatsapp:
        whatsapp,

      data:
        data,

      hora:
        horarioSelecionado,

      servico:
        servico.nome,

      servicoId:
        servico.id,

      duracao:
        Number(
          servico.duracao
        ),

      observacao:
        observacao

    };


    const resposta =
      await fetch(
        API_URL,
        {

          method:
            'POST',

          headers: {
            'Content-Type':
              'text/plain;charset=utf-8'
          },

          body:
            JSON.stringify(
              dados
            )

        }
      );


    if (!resposta.ok) {

      throw new Error(
        'Erro HTTP ' +
        resposta.status +
        ' ao salvar.'
      );

    }


    const resultado =
      await resposta.json();


    if (
      !resultado.sucesso
    ) {

      throw new Error(
        resultado.erro ||
        'Não foi possível realizar o agendamento.'
      );

    }


    mostrarMensagem(
      'mensagemPrincipal',
      'Agendamento realizado com sucesso!',
      'sucesso'
    );


    fecharModal();


    document.getElementById(
      'dataAgenda'
    ).value =
      data;


    carregarAgenda();


  } catch (erro) {

    console.error(
      'Erro ao salvar:',
      erro
    );


    mostrarMensagem(
      'mensagemModal',
      erro.message,
      'erro'
    );


  } finally {

    btn.disabled =
      false;


    btn.textContent =
      'Agendar Cliente';

  }

}


/* =========================================================
   VERIFICAR CONFLITO
========================================================= */

function verificarConflito(
  inicioNovo,
  fimNovo,
  agendamentos
) {

  return agendamentos.some(
    function(agendamento) {

      const inicioExistente =
        horaParaMinutos(
          agendamento.hora
        );


      const duracaoExistente =
        Number(
          agendamento.duracao || 0
        );


      if (
        inicioExistente < 0 ||
        duracaoExistente <= 0
      ) {

        return false;

      }


      const fimExistente =
        inicioExistente +
        duracaoExistente;


      return (
        inicioNovo <
        fimExistente
        &&
        fimNovo >
        inicioExistente
      );

    }
  );

}


/* =========================================================
   CARREGAR AGENDA
========================================================= */

async function carregarAgenda() {

  const data =
    document.getElementById(
      'dataAgenda'
    ).value;


  const area =
    document.getElementById(
      'listaAgendamentos'
    );


  if (!data) {

    area.innerHTML =
      '<div class="carregando">' +
      'Selecione uma data.' +
      '</div>';

    return;

  }


  area.innerHTML =
    '<div class="carregando">' +
    'Carregando agendamentos...' +
    '</div>';


  try {

    const resposta =
      await fetch(
        API_URL +
        '?acao=agendamentos' +
        '&data=' +
        encodeURIComponent(data) +
        '&_=' +
        Date.now(),
        {
          method: 'GET',
          cache: 'no-store'
        }
      );


    if (!resposta.ok) {

      throw new Error(
        'HTTP ' +
        resposta.status
      );

    }


    const dados =
      await resposta.json();


    const agendamentos =
      Array.isArray(dados)
        ? dados
        : (
            dados &&
            Array.isArray(
              dados.agendamentos
            )
              ? dados.agendamentos
              : null
          );


    if (!agendamentos) {

      throw new Error(
        'Resposta inválida.'
      );

    }


    renderizarAgenda(
      agendamentos
    );


  } catch (erro) {

    console.error(
      'Erro agenda:',
      erro
    );


    area.innerHTML =
      '<div class="sem-horarios">' +
      'Erro ao carregar a agenda.<br>' +
      escapeHtml(
        erro.message
      ) +
      '</div>';

  }

}


/* =========================================================
   RENDERIZAR AGENDA
========================================================= */

function renderizarAgenda(
  agendamentos
) {

  const area =
    document.getElementById(
      'listaAgendamentos'
    );


  if (
    !agendamentos ||
    agendamentos.length === 0
  ) {

    area.innerHTML =
      '<h3>Agendamentos do dia</h3>' +
      '<div class="carregando">' +
      'Nenhum agendamento para esta data.' +
      '</div>';

    return;

  }


  agendamentos.sort(
    function(a,b) {

      return (
        horaParaMinutos(a.hora) -
        horaParaMinutos(b.hora)
      );

    }
  );


  let html =
    '<h3>Agendamentos do dia</h3>';


  agendamentos.forEach(
    function(item) {

      html +=

        '<div class="agendamento">' +

          '<div class="agendamento-topo">' +

            '<div>' +

              '<strong>' +

                escapeHtml(
                  item.hora
                ) +

                ' - ' +

                escapeHtml(
                  item.cliente
                ) +

              '</strong>' +

            '</div>' +

            '<button ' +

              'class="btn-cancelar" ' +

              'onclick="cancelarAgendamento(\'' +

                escapeHtmlJS(
                  item.id
                ) +

              '\')">' +

              'Cancelar' +

            '</button>' +

          '</div>' +


          '<div class="info">' +

            '<strong>Serviço:</strong> ' +

            escapeHtml(
              item.servico
            ) +

            ' (' +

            Number(
              item.duracao || 0
            ) +

            ' min)' +

          '</div>' +


          '<div class="info">' +

            '<strong>Término:</strong> ' +

            calcularTermino(
              item.hora,
              item.duracao
            ) +

          '</div>' +


          '<div class="info">' +

            '<strong>WhatsApp:</strong> ' +

            escapeHtml(
              item.whatsapp
            ) +

          '</div>' +


          (
            item.observacao
              ?
                '<div class="info">' +
                  '<strong>Observação:</strong> ' +
                  escapeHtml(
                    item.observacao
                  ) +
                '</div>'
              :
                ''
          ) +

        '</div>';

    }
  );


  area.innerHTML =
    html;

}


/* =========================================================
   CANCELAR
========================================================= */

async function cancelarAgendamento(
  id
) {

  if (
    !confirm(
      'Deseja realmente cancelar este agendamento?'
    )
  ) {

    return;

  }


  try {

    const resposta =
      await fetch(
        API_URL,
        {

          method:
            'POST',

          headers: {
            'Content-Type':
              'text/plain;charset=utf-8'
          },

          body:
            JSON.stringify({

              acao:
                'cancelar',

              id:
                id

            })

        }
      );


    if (!resposta.ok) {

      throw new Error(
        'Erro HTTP ' +
        resposta.status
      );

    }


    const resultado =
      await resposta.json();


    if (
      !resultado.sucesso
    ) {

      throw new Error(
        resultado.erro ||
        'Erro ao cancelar.'
      );

    }


    mostrarMensagem(
      'mensagemPrincipal',
      'Agendamento cancelado com sucesso.',
      'sucesso'
    );


    carregarAgenda();


  } catch (erro) {

    mostrarMensagem(
      'mensagemPrincipal',
      erro.message,
      'erro'
    );

  }

}


/* =========================================================
   CALCULAR TÉRMINO
========================================================= */

function calcularTermino(
  hora,
  duracao
) {

  const inicio =
    horaParaMinutos(
      hora
    );


  const fim =
    inicio +
    Number(
      duracao || 0
    );


  return minutosParaHora(
    fim
  );

}


/* =========================================================
   CONVERSÃO DE NÚMERO
========================================================= */

function converterNumero(
  valor
) {

  if (
    valor === null ||
    valor === undefined ||
    valor === ''
  ) {

    return 0;

  }


  if (
    typeof valor === 'number'
  ) {

    return valor;

  }


  let texto =
    String(
      valor
    ).trim();


  texto =
    texto.replace(
      /R\$/gi,
      ''
    ).trim();


  if (
    texto.includes(',') &&
    texto.includes('.')
  ) {

    texto =
      texto
        .replace(/\./g,'')
        .replace(',','.');

  } else {

    texto =
      texto.replace(',','.');

  }


  const numero =
    Number(
      texto
    );


  return isNaN(numero)
    ? 0
    : numero;

}


/* =========================================================
   HORA → MINUTOS
========================================================= */

function horaParaMinutos(
  hora
) {

  const texto =
    String(
      hora || ''
    ).trim();


  const partes =
    texto.split(':');


  if (
    partes.length < 2
  ) {

    return -1;

  }


  const horas =
    Number(
      partes[0]
    );


  const minutos =
    Number(
      partes[1]
    );


  if (
    isNaN(horas) ||
    isNaN(minutos)
  ) {

    return -1;

  }


  return (
    horas * 60 +
    minutos
  );

}


/* =========================================================
   MINUTOS → HORA
========================================================= */

function minutosParaHora(
  minutos
) {

  const valor =
    Number(
      minutos
    );


  const horas =
    Math.floor(
      valor / 60
    );


  const mins =
    valor % 60;


  return (
    String(
      horas
    ).padStart(2,'0') +

    ':' +

    String(
      mins
    ).padStart(2,'0')
  );

}


/* =========================================================
   DATA BR
========================================================= */

function formatarDataBR(
  data
) {

  const partes =
    String(
      data
    ).split('-');


  if (
    partes.length !== 3
  ) {

    return data;

  }


  return (
    partes[2] +
    '/' +
    partes[1] +
    '/' +
    partes[0]
  );

}


/* =========================================================
   MENSAGEM
========================================================= */

function mostrarMensagem(
  id,
  texto,
  tipo
) {

  const elemento =
    document.getElementById(
      id
    );


  if (!elemento) {
    return;
  }


  elemento.textContent =
    texto;


  elemento.className =
    'mensagem ' +
    tipo;


  setTimeout(
    function() {

      esconderMensagem(
        id
      );

    },
    5000
  );

}


/* =========================================================
   ESCONDER MENSAGEM
========================================================= */

function esconderMensagem(
  id
) {

  const elemento =
    document.getElementById(
      id
    );


  if (!elemento) {
    return;
  }


  elemento.className =
    'mensagem';


  elemento.textContent =
    '';

}


/* =========================================================
   SEGURANÇA HTML
========================================================= */

function escapeHtml(
  texto
) {

  return String(
    texto || ''
  )
  .replace(
    /&/g,
    '&amp;'
  )
  .replace(
    /</g,
    '&lt;'
  )
  .replace(
    />/g,
    '&gt;'
  )
  .replace(
    /"/g,
    '&quot;'
  )
  .replace(
    /'/g,
    '&#039;'
  );

}


/* =========================================================
   SEGURANÇA JAVASCRIPT
========================================================= */

function escapeHtmlJS(
  texto
) {

  return String(
    texto || ''
  )
  .replace(
    /\\/g,
    '\\\\'
  )
  .replace(
    /'/g,
    "\\'"
  )
  .replace(
    /"/g,
    '\\"'
  );

}


/* =========================================================
   FECHAR CLICANDO FORA
========================================================= */

document
  .getElementById('modal')
  .addEventListener(
    'click',
    function(event) {

      if (
        event.target === this
      ) {

        fecharModal();

      }

    }
  );


</script>
