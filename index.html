<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Agenda do Salão</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f8f5f2;
      color: #333;
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    /* ==============================
       TOPO
    ============================== */

    header {
      background: linear-gradient(135deg, #8d526e, #b97898);
      color: white;
      padding: 22px 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,.12);
    }

    .topo {
      max-width: 1200px;
      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .titulo h1 {
      font-size: 25px;
    }

    .titulo p {
      margin-top: 5px;
      opacity: .9;
      font-size: 14px;
    }

    /* ==============================
       CONTAINER
    ============================== */

    .container {
      max-width: 1200px;
      margin: 25px auto;
      padding: 0 15px;
    }

    /* ==============================
       BOTÕES
    ============================== */

    .btn {
      border: 0;
      border-radius: 9px;
      padding: 12px 18px;
      font-size: 14px;
      font-weight: bold;
    }

    .btn-principal {
      background: #9a5f7b;
      color: white;
    }

    .btn-principal:hover {
      background: #844e68;
    }

    .btn-secundario {
      background: #eeeeee;
      color: #444;
    }

    .btn-secundario:hover {
      background: #e0e0e0;
    }

    /* ==============================
       CONTROLES
    ============================== */

    .controles {
      background: white;
      padding: 18px;
      border-radius: 14px;
      margin-bottom: 20px;

      display: flex;
      align-items: end;
      gap: 15px;
      flex-wrap: wrap;

      box-shadow: 0 3px 15px rgba(0,0,0,.06);
    }

    .campo {
      display: flex;
      flex-direction: column;
      gap: 7px;
      flex: 1;
      min-width: 180px;
    }

    label {
      font-size: 13px;
      font-weight: bold;
      color: #555;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;

      border: 1px solid #ddd;
      border-radius: 9px;

      background: white;
      color: #333;

      font-size: 15px;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #9a5f7b;
      box-shadow: 0 0 0 2px rgba(154,95,123,.10);
    }

    textarea {
      min-height: 85px;
      resize: vertical;
    }

    /* ==============================
       RESUMO
    ============================== */

    .resumo {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .card-resumo {
      background: white;
      padding: 18px;
      border-radius: 14px;

      box-shadow: 0 3px 15px rgba(0,0,0,.06);
    }

    .numero {
      color: #9a5f7b;
      font-size: 28px;
      font-weight: bold;
    }

    .card-resumo span {
      color: #777;
      font-size: 13px;
    }

    /* ==============================
       AGENDA
    ============================== */

    .agenda {
      background: white;
      border-radius: 14px;
      overflow: hidden;

      box-shadow: 0 3px 15px rgba(0,0,0,.06);
    }

    .agenda-titulo {
      padding: 18px;

      border-bottom: 1px solid #eee;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .agenda-titulo h2 {
      font-size: 19px;
      color: #444;
    }

    .lista {
      padding: 15px;
    }

    .agendamento {
      border: 1px solid #eee;
      border-left: 5px solid #a56583;
      border-radius: 10px;

      padding: 15px;
      margin-bottom: 12px;

      display: grid;
      grid-template-columns: 80px 1fr auto;
      gap: 15px;
      align-items: center;
    }

    .horario-agenda {
      font-size: 21px;
      font-weight: bold;
      color: #9a5f7b;
    }

    .cliente {
      font-weight: bold;
      font-size: 16px;
    }

    .detalhes {
      margin-top: 5px;
      color: #666;
      font-size: 13px;
      line-height: 1.7;
    }

    .btn-cancelar {
      background: #dc5b5b;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 12px;
      font-weight: bold;
    }

    .btn-cancelar:hover {
      background: #c94b4b;
    }

    .vazio,
    .loading {
      padding: 45px 20px;
      text-align: center;
      color: #888;
    }

    /* ==============================
       MENSAGENS
    ============================== */

    .mensagem {
      display: none;
      padding: 13px 15px;
      border-radius: 9px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .mensagem.erro {
      background: #ffe5e5;
      color: #a33333;
    }

    .mensagem.sucesso {
      background: #e3f6e8;
      color: #28713b;
    }

    /* ==============================
       MODAL
    ============================== */

    #modalFundo {
      display: none;

      position: fixed;
      inset: 0;

      background: rgba(0,0,0,.55);

      z-index: 9999;

      padding: 15px;

      align-items: center;
      justify-content: center;
    }

    #modalFundo.aberto {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 650px;
      max-height: 92vh;

      overflow-y: auto;

      background: white;
      border-radius: 17px;

      padding: 25px;

      box-shadow: 0 15px 50px rgba(0,0,0,.25);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 22px;
    }

    .modal-header h2 {
      color: #8d526e;
      font-size: 21px;
    }

    .btn-fechar {
      width: 36px;
      height: 36px;

      border: 0;
      border-radius: 50%;

      background: #eee;
      color: #555;

      font-size: 22px;
    }

    .btn-fechar:hover {
      background: #ddd;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .campo-completo {
      grid-column: 1 / -1;
    }

    /* ==============================
       HORÁRIOS
    ============================== */

    .horarios-titulo {
      margin-bottom: 8px;
    }

    #horarios {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 9px;

      margin-top: 4px;
    }

    .btn-horario {
      border: 1px solid #d7c1cc;
      border-radius: 9px;

      background: white;
      color: #8d526e;

      padding: 13px 5px;

      font-size: 14px;
      font-weight: bold;

      transition: .15s;
    }

    .btn-horario:hover:not(:disabled) {
      background: #f7edf2;
      border-color: #9a5f7b;
    }

    .btn-horario.selecionado {
      background: #9a5f7b;
      color: white;
      border-color: #9a5f7b;
    }

    .btn-horario.ocupado,
    .btn-horario:disabled {
      background: #eeeeee;
      color: #aaa;
      border-color: #ddd;
      cursor: not-allowed;
      text-decoration: line-through;
    }

    .horarios-info {
      grid-column: 1 / -1;

      background: #f8f5f2;
      color: #777;

      padding: 15px;

      text-align: center;

      border-radius: 9px;

      font-size: 13px;
    }

    /* ==============================
       AÇÕES
    ============================== */

    .acoes-modal {
      display: flex;
      justify-content: flex-end;
      gap: 10px;

      margin-top: 22px;
    }

    /* ==============================
       RESPONSIVO
    ============================== */

    @media (max-width: 700px) {

      .topo {
        flex-direction: column;
        align-items: stretch;
      }

      .topo .btn {
        width: 100%;
      }

      .resumo {
        grid-template-columns: 1fr;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .campo-completo {
        grid-column: auto;
      }

      #horarios {
        grid-template-columns: repeat(3, 1fr);
      }

      .agendamento {
        grid-template-columns: 65px 1fr;
      }

      .agendamento .acao {
        grid-column: 1 / -1;
      }

      .agenda-titulo {
        flex-direction: column;
        align-items: stretch;
      }

      .agenda-titulo .btn {
        width: 100%;
      }

    }

    @media (max-width: 400px) {

      #horarios {
        grid-template-columns: repeat(2, 1fr);
      }

    }

  </style>
</head>

<body>

  <!-- =========================================
       TOPO
  ========================================== -->

  <header>

    <div class="topo">

      <div class="titulo">

        <h1>💇 Agenda do Salão</h1>

        <p>
          Controle de clientes e horários
        </p>

      </div>

      <button
        type="button"
        id="btnNovoTopo"
        class="btn btn-principal"
      >
        + Novo agendamento
      </button>

    </div>

  </header>


  <main class="container">

    <!-- MENSAGENS -->

    <div
      id="mensagemErro"
      class="mensagem erro"
    ></div>

    <div
      id="mensagemSucesso"
      class="mensagem sucesso"
    ></div>


    <!-- =========================================
         CONTROLE DA AGENDA
    ========================================== -->

    <section class="controles">

      <div class="campo">

        <label for="dataAgenda">
          Data da agenda
        </label>

        <input
          type="date"
          id="dataAgenda"
        >

      </div>


      <button
        type="button"
        id="btnHoje"
        class="btn btn-secundario"
      >
        Hoje
      </button>


      <button
        type="button"
        id="btnAtualizar"
        class="btn btn-secundario"
      >
        🔄 Atualizar
      </button>

    </section>


    <!-- =========================================
         RESUMO
    ========================================== -->

    <section class="resumo">

      <div class="card-resumo">

        <div
          id="totalAgendamentos"
          class="numero"
        >
          0
        </div>

        <span>
          Agendamentos
        </span>

      </div>


      <div class="card-resumo">

        <div
          id="totalHoras"
          class="numero"
        >
          0h
        </div>

        <span>
          Tempo agendado
        </span>

      </div>


      <div class="card-resumo">

        <div
          id="proximoHorario"
          class="numero"
        >
          --:--
        </div>

        <span>
          Primeiro horário
        </span>

      </div>

    </section>


    <!-- =========================================
         AGENDA
    ========================================== -->

    <section class="agenda">

      <div class="agenda-titulo">

        <h2>
          Agenda de
          <span id="dataTitulo">
            --/--/----
          </span>
        </h2>

        <button
          type="button"
          id="btnAgendarCliente"
          class="btn btn-principal"
        >
          + Agendar cliente
        </button>

      </div>


      <div
        id="listaAgendamentos"
        class="lista"
      >

        <div class="loading">
          Carregando agenda...
        </div>

      </div>

    </section>

  </main>


  <!-- =========================================
       MODAL
  ========================================== -->

  <div
    id="modalFundo"
  >

    <div class="modal">

      <div class="modal-header">

        <h2>
          Novo agendamento
        </h2>

        <button
          type="button"
          id="btnFechar"
          class="btn-fechar"
        >
          ×
        </button>

      </div>


      <form
        id="formAgendamento"
      >

        <div class="form-grid">

          <!-- CLIENTE -->

          <div class="campo campo-completo">

            <label for="cliente">
              Nome da cliente *
            </label>

            <input
              type="text"
              id="cliente"
              autocomplete="name"
              placeholder="Digite o nome da cliente"
              required
            >

          </div>


          <!-- WHATSAPP -->

          <div class="campo">

            <label for="whatsapp">
              WhatsApp *
            </label>

            <input
              type="tel"
              id="whatsapp"
              placeholder="(31) 99999-9999"
              required
            >

          </div>


          <!-- DATA -->

          <div class="campo">

            <label for="data">
              Data *
            </label>

            <input
              type="date"
              id="data"
              required
            >

          </div>


          <!-- SERVIÇO -->

          <div class="campo campo-completo">

            <label for="servico">
              Serviço *
            </label>

            <select
              id="servico"
              required
            >

              <option value="">
                Carregando serviços...
              </option>

            </select>

          </div>


          <!-- HORÁRIOS -->

          <div class="campo campo-completo">

            <label>
              Horário disponível *
            </label>

            <input
              type="hidden"
              id="hora"
              required
            >

            <div id="horarios">

              <div class="horarios-info">
                Selecione uma data para ver os horários.
              </div>

            </div>

          </div>


          <!-- DURAÇÃO -->

          <div class="campo">

            <label for="duracao">
              Duração
            </label>

            <input
              type="text"
              id="duracao"
              readonly
              placeholder="Automático"
            >

          </div>


          <!-- PREÇO -->

          <div class="campo">

            <label for="preco">
              Preço
            </label>

            <input
              type="text"
              id="preco"
              readonly
              placeholder="Automático"
            >

          </div>


          <!-- OBSERVAÇÃO -->

          <div class="campo campo-completo">

            <label for="observacao">
              Observação
            </label>

            <textarea
              id="observacao"
              placeholder="Alguma observação sobre a cliente..."
            ></textarea>

          </div>

        </div>


        <div class="acoes-modal">

          <button
            type="button"
            id="btnCancelarModal"
            class="btn btn-secundario"
          >
            Fechar
          </button>

          <button
            type="submit"
            class="btn btn-principal"
            id="btnSalvar"
          >
            Salvar agendamento
          </button>

        </div>

      </form>

    </div>

  </div>


  <!-- =========================================
       JAVASCRIPT
  ========================================== -->

  <script>

    /*
     * =====================================================
     * CONFIGURAÇÃO
     * =====================================================
     */

    const API_URL =
      "https://script.google.com/macros/s/AKfycbxlDNqWDBZZ_BQiECAgMFgd1iZKmv-T1AVBOg2bTnvJdPj7NGolqTbQYdUljRORD3DK/exec";


    let servicos = [];

    let agendamentos = [];


    /*
     * =====================================================
     * INICIALIZAÇÃO
     * =====================================================
     */

    document.addEventListener(
      "DOMContentLoaded",
      iniciar
    );


    async function iniciar() {

      console.log(
        "Sistema iniciando..."
      );


      configurarEventos();


      colocarDataHoje();


      await carregarServicos();


      await carregarAgenda();

    }


    /*
     * =====================================================
     * EVENTOS
     * =====================================================
     */

    function configurarEventos() {

      document
        .getElementById("btnNovoTopo")
        .addEventListener(
          "click",
          abrirModal
        );


      document
        .getElementById("btnAgendarCliente")
        .addEventListener(
          "click",
          abrirModal
        );


      document
        .getElementById("btnFechar")
        .addEventListener(
          "click",
          fecharModal
        );


      document
        .getElementById("btnCancelarModal")
        .addEventListener(
          "click",
          fecharModal
        );


      document
        .getElementById("btnHoje")
        .addEventListener(
          "click",
          function() {

            colocarDataHoje();

            carregarAgenda();

          }
        );


      document
        .getElementById("btnAtualizar")
        .addEventListener(
          "click",
          carregarAgenda
        );


      document
        .getElementById("dataAgenda")
        .addEventListener(
          "change",
          carregarAgenda
        );


      document
        .getElementById("data")
        .addEventListener(
          "change",
          carregarHorarios
        );


      document
        .getElementById("servico")
        .addEventListener(
          "change",
          function() {

            atualizarDadosServico();

            carregarHorarios();

          }
        );


      document
        .getElementById("formAgendamento")
        .addEventListener(
          "submit",
          salvarAgendamento
        );


      /*
       * Clicar fora do modal fecha.
       */

      document
        .getElementById("modalFundo")
        .addEventListener(
          "click",
          function(event) {

            if (
              event.target ===
              document.getElementById("modalFundo")
            ) {

              fecharModal();

            }

          }
        );

    }


    /*
     * =====================================================
     * DATA DE HOJE
     * =====================================================
     */

    function obterDataHoje() {

      const agora =
        new Date();


      const ano =
        agora.getFullYear();


      const mes =
        String(
          agora.getMonth() + 1
        ).padStart(2, "0");


      const dia =
        String(
          agora.getDate()
        ).padStart(2, "0");


      return (
        ano +
        "-" +
        mes +
        "-" +
        dia
      );

    }


    function colocarDataHoje() {

      const hoje =
        obterDataHoje();


      document
        .getElementById("dataAgenda")
        .value =
        hoje;


      document
        .getElementById("data")
        .value =
        hoje;


      atualizarTitulo(
        hoje
      );

    }


    /*
     * =====================================================
     * MODAL
     * =====================================================
     */

    function abrirModal() {

      console.log(
        "Abrindo modal..."
      );


      const modal =
        document.getElementById(
          "modalFundo"
        );


      modal.classList.add(
        "aberto"
      );


      /*
       * Coloca a data da agenda no formulário.
       */

      const dataAgenda =
        document
          .getElementById("dataAgenda")
          .value;


      if (dataAgenda) {

        document
          .getElementById("data")
          .value =
          dataAgenda;

      }


      /*
       * Carrega os horários imediatamente.
       */

      carregarHorarios();


      setTimeout(
        function() {

          document
            .getElementById("cliente")
            .focus();

        },
        100
      );

    }


    function fecharModal() {

      const modal =
        document.getElementById(
          "modalFundo"
        );


      modal.classList.remove(
        "aberto"
      );


      limparFormulario();

    }


    function limparFormulario() {

      document
        .getElementById("formAgendamento")
        .reset();


      const dataAgenda =
        document
          .getElementById("dataAgenda")
          .value;


      if (dataAgenda) {

        document
          .getElementById("data")
          .value =
          dataAgenda;

      }


      document
        .getElementById("hora")
        .value =
        "";


      document
        .getElementById("duracao")
        .value =
        "";


      document
        .getElementById("preco")
        .value =
        "";


      document
        .getElementById("horarios")
        .innerHTML = `

          <div class="horarios-info">
            Selecione uma data para ver os horários.
          </div>

        `;

    }


    /*
     * =====================================================
     * SERVIÇOS
     * =====================================================
     */

    async function carregarServicos() {

      const select =
        document.getElementById(
          "servico"
        );


      try {

        select.innerHTML = `
          <option value="">
            Carregando serviços...
          </option>
        `;


        const resposta =
          await fetch(
            API_URL +
            "?acao=servicos"
          );


        if (!resposta.ok) {

          throw new Error(
            "Erro HTTP " +
            resposta.status
          );

        }


        const dados =
          await resposta.json();


        console.log(
          "Serviços recebidos:",
          dados
        );


        if (
          !Array.isArray(dados)
        ) {

          throw new Error(
            "A API não retornou uma lista de serviços."
          );

        }


        servicos =
          dados;


        select.innerHTML = `
          <option value="">
            Selecione o serviço
          </option>
        `;


        servicos.forEach(
          function(servico) {

            const option =
              document.createElement(
                "option"
              );


            option.value =
              servico.id;


            option.textContent =
              servico.nome;


            select.appendChild(
              option
            );

          }
        );


      } catch (erro) {

        console.error(
          "Erro serviços:",
          erro
        );


        select.innerHTML = `
          <option value="">
            Erro ao carregar serviços
          </option>
        `;


        mostrarErro(
          "Não foi possível carregar os serviços: " +
          erro.message
        );

      }

    }


    /*
     * =====================================================
     * SERVIÇO SELECIONADO
     * =====================================================
     */

    function obterServicoSelecionado() {

      const id =
        document
          .getElementById("servico")
          .value;


      return servicos.find(
        function(servico) {

          return String(
            servico.id
          ) === String(id);

        }
      );

    }


    function atualizarDadosServico() {

      const servico =
        obterServicoSelecionado();


      const duracao =
        document.getElementById(
          "duracao"
        );


      const preco =
        document.getElementById(
          "preco"
        );


      if (!servico) {

        duracao.value = "";

        preco.value = "";

        return;

      }


      duracao.value =
        servico.duracao +
        " minutos";


      preco.value =
        formatarMoeda(
          servico.preco
        );

    }


    /*
     * =====================================================
     * HORÁRIOS
     * =====================================================
     */

    async function carregarHorarios() {

      const data =
        document
          .getElementById("data")
          .value;


      const container =
        document.getElementById(
          "horarios"
        );


      const campoHora =
        document.getElementById(
          "hora"
        );


      campoHora.value = "";


      if (!data) {

        container.innerHTML = `
          <div class="horarios-info">
            Selecione uma data.
          </div>
        `;

        return;

      }


      /*
       * Se o serviço ainda não foi selecionado,
       * usamos 30 minutos para listar os horários.
       */

      const servico =
        obterServicoSelecionado();


      let duracao = 30;


      if (servico) {

        duracao =
          Number(
            servico.duracao
          );

      }


      container.innerHTML = `
        <div class="horarios-info">
          Buscando horários disponíveis...
        </div>
      `;


      try {

        const url =
          API_URL +
          "?acao=horarios" +
          "&data=" +
          encodeURIComponent(data) +
          "&duracao=" +
          encodeURIComponent(duracao);


        console.log(
          "Consultando:",
          url
        );


        const resposta =
          await fetch(
            url
          );


        if (!resposta.ok) {

          throw new Error(
            "Erro HTTP " +
            resposta.status
          );

        }


        const resultado =
          await resposta.json();


        console.log(
          "Resposta horários:",
          resultado
        );


        if (
          resultado.sucesso === false
        ) {

          throw new Error(
            resultado.erro ||
            "Erro na API."
          );

        }


        /*
         * Aceita tanto:
         *
         * resultado.horarios
         *
         * quanto uma resposta direta em array.
         */

        let horarios =
          Array.isArray(
            resultado
          )
          ?
          resultado
          :
          resultado.horarios;


        if (
          !Array.isArray(horarios)
        ) {

          throw new Error(
            "A API não retornou os horários."
          );

        }


        mostrarHorarios(
          horarios
        );


      } catch (erro) {

        console.error(
          "Erro horários:",
          erro
        );


        container.innerHTML = `

          <div class="horarios-info">

            Não foi possível carregar os horários.

            <br><br>

            ${escaparHTML(
              erro.message
            )}

          </div>

        `;

      }

    }


    function mostrarHorarios(
      horarios
    ) {

      const container =
        document.getElementById(
          "horarios"
        );


      container.innerHTML = "";


      if (
        !horarios ||
        horarios.length === 0
      ) {

        container.innerHTML = `
          <div class="horarios-info">
            Nenhum horário disponível para esta data.
          </div>
        `;

        return;

      }


      horarios.forEach(
        function(item) {

          const hora =
            item.hora ||
            item;


          /*
           * Aceita:
           *
           * disponivel: true
           *
           * disponível: true
           *
           * ou disponível sem informação,
           * considerando livre.
           */

          const disponivel =
            item.disponivel !== undefined
            ?
            Boolean(item.disponivel)
            :
            item.disponível !== undefined
            ?
            Boolean(item.disponível)
            :
            true;


          const botao =
            document.createElement(
              "button"
            );


          botao.type =
            "button";


          botao.className =
            "btn-horario";


          botao.textContent =
            hora;


          if (!disponivel) {

            botao.disabled =
              true;


            botao.classList.add(
              "ocupado"
            );


            botao.title =
              "Horário ocupado";


          } else {

            botao.addEventListener(
              "click",
              function() {

                selecionarHorario(
                  hora,
                  botao
                );

              }
            );

          }


          container.appendChild(
            botao
          );

        }
      );

    }


    function selecionarHorario(
      hora,
      botao
    ) {

      document
        .querySelectorAll(
          "#horarios .btn-horario"
        )
        .forEach(
          function(item) {

            item.classList.remove(
              "selecionado"
            );

          }
        );


      botao.classList.add(
        "selecionado"
      );


      document
        .getElementById("hora")
        .value =
        hora;

    }


    /*
     * =====================================================
     * AGENDA
     * =====================================================
     */

    async function carregarAgenda() {

      const data =
        document
          .getElementById("dataAgenda")
          .value;


      if (!data) {

        return;

      }


      atualizarTitulo(
        data
      );


      const lista =
        document.getElementById(
          "listaAgendamentos"
        );


      lista.innerHTML = `
        <div class="loading">
          Carregando agenda...
        </div>
      `;


      try {

        const url =
          API_URL +
          "?acao=agendamentos" +
          "&data=" +
          encodeURIComponent(data);


        const resposta =
          await fetch(
            url
          );


        if (!resposta.ok) {

          throw new Error(
            "Erro HTTP " +
            resposta.status
          );

        }


        const dados =
          await resposta.json();


        if (
          !Array.isArray(dados)
        ) {

          throw new Error(
            "Resposta inválida da agenda."
          );

        }


        agendamentos =
          dados.sort(
            function(a,b) {

              return converterMinutos(
                a.hora
              )
              -
              converterMinutos(
                b.hora
              );

            }
          );


        mostrarAgenda();

        atualizarResumo();


      } catch (erro) {

        console.error(
          "Erro agenda:",
          erro
        );


        lista.innerHTML = `
          <div class="vazio">
            Não foi possível carregar a agenda.
          </div>
        `;


        mostrarErro(
          erro.message
        );

      }

    }


    function atualizarTitulo(
      data
    ) {

      if (!data) {

        return;

      }


      const partes =
        data.split("-");


      document
        .getElementById("dataTitulo")
        .textContent =
        partes[2] +
        "/" +
        partes[1] +
        "/" +
        partes[0];

    }


    function mostrarAgenda() {

      const lista =
        document.getElementById(
          "listaAgendamentos"
        );


      if (
        agendamentos.length === 0
      ) {

        lista.innerHTML = `
          <div class="vazio">
            Nenhum agendamento para este dia.
          </div>
        `;

        return;

      }


      lista.innerHTML = "";


      agendamentos.forEach(
        function(item) {

          const div =
            document.createElement(
              "div"
            );


          div.className =
            "agendamento";


          const observacao =
            item.observacao
            ?
            `
              <br>
              📝 ${escaparHTML(item.observacao)}
            `
            :
            "";


          div.innerHTML = `

            <div class="horario-agenda">
              ${escaparHTML(item.hora)}
            </div>

            <div>

              <div class="cliente">
                ${escaparHTML(item.cliente)}
              </div>

              <div class="detalhes">

                💇 ${escaparHTML(item.servico)}

                <br>

                📱 ${formatarTelefone(item.whatsapp)}

                <br>

                ⏱️ ${item.duracao} minutos

                ${observacao}

              </div>

            </div>

            <div class="acao">

              <button
                type="button"
                class="btn-cancelar"
                data-id="${escaparHTML(item.id)}"
              >
                Cancelar
              </button>

            </div>

          `;


          const botaoCancelar =
            div.querySelector(
              ".btn-cancelar"
            );


          botaoCancelar.addEventListener(
            "click",
            function() {

              cancelarAgendamento(
                item.id
              );

            }
          );


          lista.appendChild(
            div
          );

        }
      );

    }


    /*
     * =====================================================
     * RESUMO
     * =====================================================
     */

    function atualizarResumo() {

      const total =
        agendamentos.length;


      document
        .getElementById(
          "totalAgendamentos"
        )
        .textContent =
        total;


      let minutos = 0;


      agendamentos.forEach(
        function(item) {

          minutos +=
            Number(
              item.duracao || 0
            );

        }
      );


      const horas =
        Math.floor(
          minutos / 60
        );


      const minutosRestantes =
        minutos % 60;


      document
        .getElementById(
          "totalHoras"
        )
        .textContent =
        horas +
        "h " +
        minutosRestantes +
        "min";


      document
        .getElementById(
          "proximoHorario"
        )
        .textContent =
        total > 0
        ?
        agendamentos[0].hora
        :
        "--:--";

    }


    /*
     * =====================================================
     * SALVAR AGENDAMENTO
     * =====================================================
     */

    async function salvarAgendamento(
      event
    ) {

      event.preventDefault();


      const cliente =
        document
          .getElementById("cliente")
          .value
          .trim();


      const whatsapp =
        document
          .getElementById("whatsapp")
          .value
          .trim();


      const data =
        document
          .getElementById("data")
          .value;


      const hora =
        document
          .getElementById("hora")
          .value;


      const servico =
        obterServicoSelecionado();


      const observacao =
        document
          .getElementById("observacao")
          .value
          .trim();


      if (!cliente) {

        mostrarErro(
          "Informe o nome da cliente."
        );

        return;

      }


      if (!whatsapp) {

        mostrarErro(
          "Informe o WhatsApp."
        );

        return;

      }


      if (!data) {

        mostrarErro(
          "Informe a data."
        );

        return;

      }


      if (!hora) {

        mostrarErro(
          "Selecione um horário."
        );

        return;

      }


      if (!servico) {

        mostrarErro(
          "Selecione o serviço."
        );

        return;

      }


      const botao =
        document.getElementById(
          "btnSalvar"
        );


      botao.disabled =
        true;


      botao.textContent =
        "Salvando...";


      const dados = {

        acao:
          "agendar",

        cliente:
          cliente,

        whatsapp:
          whatsapp,

        data:
          data,

        hora:
          hora,

        servico:
          servico.nome,

        duracao:
          Number(
            servico.duracao
          ),

        observacao:
          observacao

      };


      try {

        console.log(
          "Enviando agendamento:",
          dados
        );


        /*
         * text/plain evita problemas de CORS
         * com o Google Apps Script.
         */

        const resposta =
          await fetch(
            API_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "text/plain;charset=utf-8"
              },

              body:
                JSON.stringify(
                  dados
                )
            }
          );


        const resultado =
          await resposta.json();


        console.log(
          "Resultado:",
          resultado
        );


        if (
          !resultado.sucesso
        ) {

          throw new Error(
            resultado.erro ||
            "Não foi possível realizar o agendamento."
          );

        }


        fecharModal();


        mostrarSucesso(
          "Agendamento realizado com sucesso!"
        );


        document
          .getElementById("dataAgenda")
          .value =
          data;


        await carregarAgenda();


      } catch (erro) {

        console.error(
          "Erro ao salvar:",
          erro
        );


        mostrarErro(
          erro.message
        );

      } finally {

        botao.disabled =
          false;


        botao.textContent =
          "Salvar agendamento";

      }

    }


    /*
     * =====================================================
     * CANCELAR
     * =====================================================
     */

    async function cancelarAgendamento(
      id
    ) {

      const confirmar =
        confirm(
          "Deseja realmente cancelar este agendamento?"
        );


      if (!confirmar) {

        return;

      }


      try {

        const resposta =
          await fetch(
            API_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "text/plain;charset=utf-8"
              },

              body:
                JSON.stringify({

                  acao:
                    "cancelar",

                  id:
                    id

                })

            }
          );


        const resultado =
          await resposta.json();


        if (
          !resultado.sucesso
        ) {

          throw new Error(
            resultado.erro ||
            "Não foi possível cancelar."
          );

        }


        mostrarSucesso(
          "Agendamento cancelado."
        );


        await carregarAgenda();


      } catch (erro) {

        console.error(
          erro
        );


        mostrarErro(
          erro.message
        );

      }

    }


    /*
     * =====================================================
     * AUXILIARES
     * =====================================================
     */

    function converterMinutos(
      hora
    ) {

      const partes =
        String(
          hora || "00:00"
        ).split(":");


      return (
        Number(partes[0]) * 60 +
        Number(partes[1])
      );

    }


    function formatarMoeda(
      valor
    ) {

      return Number(
        valor || 0
      ).toLocaleString(
        "pt-BR",
        {
          style: "currency",
          currency: "BRL"
        }
      );

    }


    function formatarTelefone(
      numero
    ) {

      const n =
        String(
          numero || ""
        ).replace(
          /\D/g,
          ""
        );


      if (
        n.length === 11
      ) {

        return (
          "(" +
          n.substring(0,2) +
          ") " +
          n.substring(2,7) +
          "-" +
          n.substring(7)
        );

      }


      if (
        n.length === 10
      ) {

        return (
          "(" +
          n.substring(0,2) +
          ") " +
          n.substring(2,6) +
          "-" +
          n.substring(6)
        );

      }


      return numero || "";

    }


    function escaparHTML(
      texto
    ) {

      return String(
        texto == null
        ? ""
        : texto
      )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

    }


    function mostrarErro(
      mensagem
    ) {

      const elemento =
        document.getElementById(
          "mensagemErro"
        );


      elemento.textContent =
        mensagem;


      elemento.style.display =
        "block";


      setTimeout(
        function() {

          elemento.style.display =
            "none";

        },
        5000
      );

    }


    function mostrarSucesso(
      mensagem
    ) {

      const elemento =
        document.getElementById(
          "mensagemSucesso"
        );


      elemento.textContent =
        mensagem;


      elemento.style.display =
        "block";


      setTimeout(
        function() {

          elemento.style.display =
            "none";

        },
        4000
      );

    }

  </script>
