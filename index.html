<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Agenda - Salão Janaina</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f8f5f7;
  color: #333;
}

header {
  background: linear-gradient(135deg,#8e4168,#c66d9c);
  color: white;
  padding: 25px 20px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 27px;
}

header p {
  margin: 7px 0 0;
  opacity: .9;
}

.container {
  width: 100%;
  max-width: 1000px;
  margin: 25px auto;
  padding: 0 15px;
}

.topo {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 20px;
}

.topo h2 {
  margin: 0;
  color: #713253;
}

button {
  border: 0;
  cursor: pointer;
  font-family: inherit;
}

.btn-principal {
  background: #8e4168;
  color: white;
  padding: 13px 20px;
  border-radius: 10px;
  font-size: 15px;
  font-weight: bold;
}

.btn-principal:hover {
  background: #713253;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 3px 15px rgba(0,0,0,.07);
}

.card h3 {
  margin-top: 0;
  color: #713253;
}

.filtro {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

label {
  display: block;
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 7px;
  color: #555;
}

input,
select,
textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 9px;
  font-size: 15px;
  outline: none;
  background: white;
}

input:focus,
select:focus,
textarea:focus {
  border-color: #b65f8d;
}

textarea {
  min-height: 80px;
  resize: vertical;
}

.campo {
  margin-bottom: 16px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 15px;
}

/* HORÁRIOS */

.horarios {
  display: grid;
  grid-template-columns: repeat(auto-fill,minmax(90px,1fr));
  gap: 10px;
  margin-top: 10px;
}

.horario {
  padding: 12px 8px;
  border-radius: 10px;
  background: #f4e6ee;
  color: #713253;
  border: 2px solid transparent;
  font-size: 15px;
  font-weight: bold;
}

.horario:hover {
  background: #e8cadb;
}

.horario.selecionado {
  background: #8e4168;
  color: white;
  border-color: #713253;
}

.horario.ocupado {
  background: #eee;
  color: #aaa;
  cursor: not-allowed;
  text-decoration: line-through;
}

/* MENSAGENS */

.mensagem {
  padding: 12px;
  border-radius: 9px;
  margin-bottom: 15px;
  display: none;
}

.mensagem.erro {
  display: block;
  background: #ffe4e4;
  color: #a00000;
}

.mensagem.sucesso {
  display: block;
  background: #e2f7e8;
  color: #176b2d;
}

.carregando {
  text-align: center;
  color: #777;
  padding: 15px;
}

.sem-horarios {
  background: #fff4f4;
  color: #a33;
  padding: 15px;
  border-radius: 10px;
  text-align: center;
}

/* AGENDAMENTOS */

.agendamento {
  border: 1px solid #eee;
  border-left: 5px solid #8e4168;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 12px;
  background: #fff;
}

.agendamento-topo {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}

.agendamento strong {
  color: #713253;
}

.info {
  margin-top: 7px;
  font-size: 14px;
  color: #555;
}

.btn-cancelar {
  background: #ffe1e1;
  color: #a00000;
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: bold;
}

.btn-cancelar:hover {
  background: #ffcaca;
}

/* MODAL */

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  z-index: 999;
  padding: 20px;
  overflow-y: auto;
}

.modal.ativo {
  display: flex;
  align-items: flex-start;
  justify-content: center;
}

.modal-conteudo {
  background: white;
  width: 100%;
  max-width: 650px;
  margin: 20px auto;
  border-radius: 18px;
  padding: 25px;
  box-shadow: 0 10px 40px rgba(0,0,0,.2);
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.modal-header h2 {
  margin: 0;
  color: #713253;
}

.fechar {
  width: 35px;
  height: 35px;
  border-radius: 50%;
  background: #f2e6ed;
  color: #713253;
  font-size: 20px;
}

.fechar:hover {
  background: #e5cedb;
}

.resumo {
  background: #f8f1f5;
  border-radius: 10px;
  padding: 12px;
  margin-top: 15px;
  color: #713253;
  font-size: 14px;
}

.acoes {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  margin-top: 20px;
}

.btn-secundario {
  background: #eee;
  color: #444;
  padding: 12px 18px;
  border-radius: 9px;
  font-weight: bold;
}

.btn-salvar {
  background: #8e4168;
  color: white;
  padding: 12px 20px;
  border-radius: 9px;
  font-weight: bold;
}

.btn-salvar:hover {
  background: #713253;
}

.btn-salvar:disabled {
  background: #aaa;
  cursor: not-allowed;
}

.preco {
  color: #8e4168;
  font-weight: bold;
}

@media (max-width:600px) {

  .grid {
    grid-template-columns: 1fr;
  }

  .topo {
    align-items: stretch;
    flex-direction: column;
  }

  .topo .btn-principal {
    width: 100%;
  }

  .modal {
    padding: 10px;
  }

  .modal-conteudo {
    margin: 5px auto;
    padding: 18px;
  }

  .horarios {
    grid-template-columns: repeat(3,1fr);
  }

}

</style>
</head>

<body>

<header>

<h1>Salão Janaina</h1>

<p>Agenda de clientes</p>

</header>


<div class="container">

<div class="topo">

<h2>Agenda</h2>

<button
class="btn-principal"
onclick="abrirNovoAgendamento()"
>
+ Novo Agendamento
</button>

</div>


<div
id="mensagemPrincipal"
class="mensagem"
></div>


<div class="card">

<h3>Agendamentos do dia</h3>

<div class="filtro">

<div style="width:100%;max-width:250px">

<label for="dataAgenda">
Data
</label>

<input
type="date"
id="dataAgenda"
onchange="carregarAgenda()"
>

</div>

</div>

</div>


<div
id="listaAgendamentos"
class="card"
>

<div class="carregando">
Carregando...
</div>

</div>

</div>


<!-- MODAL -->

<div
id="modal"
class="modal"
>

<div class="modal-conteudo">

<div class="modal-header">

<h2>Novo Agendamento</h2>

<button
class="fechar"
onclick="fecharModal()"
>
×
</button>

</div>


<div
id="mensagemModal"
class="mensagem"
></div>


<div class="campo">

<label for="cliente">
Nome da cliente *
</label>

<input
type="text"
id="cliente"
placeholder="Digite o nome da cliente"
>

</div>


<div class="campo">

<label for="whatsapp">
WhatsApp *
</label>

<input
type="tel"
id="whatsapp"
placeholder="(31) 99999-9999"
>

</div>


<div class="grid">

<div class="campo">

<label for="data">
Data *
</label>

<input
type="date"
id="data"
onchange="atualizarHorarios()"
>

</div>


<div class="campo">

<label for="servico">
Serviço *
</label>

<select
id="servico"
onchange="atualizarHorarios()"
>

<option value="">
Selecione o serviço
</option>

</select>

</div>

</div>


<div class="campo">

<label>
Horários disponíveis *
</label>

<div
id="areaHorarios"
class="horarios"
>

<div class="carregando">
Selecione a data e o serviço.
</div>

</div>

</div>


<div class="campo">

<label for="observacao">
Observação
</label>

<textarea
id="observacao"
placeholder="Observações da cliente..."
></textarea>

</div>


<div
id="resumo"
class="resumo"
style="display:none"
></div>


<div class="acoes">

<button
class="btn-secundario"
onclick="fecharModal()"
>
Cancelar
</button>

<button
id="btnSalvar"
class="btn-salvar"
onclick="salvarAgendamento()"
>
Agendar Cliente
</button>

</div>

</div>

</div>


<script>

/* =========================================================
CONFIGURAÇÃO
========================================================= */

const API_URL =
'https://script.google.com/macros/s/AKfycbwp9RPaerz5Qe0k-DVjlUMoEn16Pdw4JYyayCR9-CXW0ImT8XkRUmKjbNmXCzaZQqRc/exec';


let servicos = [];

let agendamentosDoDia = [];

let horarioSelecionado = '';

let carregandoServicos = false;


/* =========================================================
INICIALIZAÇÃO
========================================================= */

document.addEventListener(
'DOMContentLoaded',
async function() {

const hoje = obterDataHoje();

document.getElementById(
'dataAgenda'
).value = hoje;

document.getElementById(
'dataAgenda'
).min = hoje;

document.getElementById(
'data'
).min = hoje;

await carregarServicos();

carregarAgenda();

});


/* =========================================================
DATA
========================================================= */

function obterDataHoje() {

const agora = new Date();

const ano =
agora.getFullYear();

const mes =
String(
agora.getMonth()+1
).padStart(2,'0');

const dia =
String(
agora.getDate()
).padStart(2,'0');

return `${ano}-${mes}-${dia}`;

}


/* =========================================================
ABRIR NOVO AGENDAMENTO
========================================================= */

async function abrirNovoAgendamento() {

limparFormulario();

const dataAgenda =
document.getElementById(
'dataAgenda'
).value;

document.getElementById(
'data'
).value =
dataAgenda || obterDataHoje();

document.getElementById(
'modal'
).classList.add('ativo');

if (
servicos.length === 0
) {

await carregarServicos();

}

atualizarHorarios();

}


/* =========================================================
FECHAR
========================================================= */

function fecharModal() {

document.getElementById(
'modal'
).classList.remove('ativo');

}


/* =========================================================
LIMPAR
========================================================= */

function limparFormulario() {

document.getElementById(
'cliente'
).value = '';

document.getElementById(
'whatsapp'
).value = '';

document.getElementById(
'observacao'
).value = '';

document.getElementById(
'servico'
).value = '';

horarioSelecionado = '';

document.getElementById(
'resumo'
).style.display = 'none';

document.getElementById(
'areaHorarios'
).innerHTML =
'<div class="carregando">' +
'Selecione a data e o serviço.' +
'</div>';

esconderMensagem(
'mensagemModal'
);

}


/* =========================================================
CARREGAR SERVIÇOS
========================================================= */

async function carregarServicos() {

if (carregandoServicos) {
return;
}

carregandoServicos = true;

try {

const resposta =
await fetch(
API_URL +
'?acao=servicos&_=' +
Date.now(),
{
cache:'no-store'
}
);

const dados =
await resposta.json();

if (!Array.isArray(dados)) {

throw new Error(
'Resposta inválida dos serviços.'
);

}

servicos = dados.map(
function(servico) {

return {

id:String(
servico.id
),

nome:String(
servico.nome || ''
),

/*
IMPORTANTÍSSIMO:
a duração vem diretamente
da aba Servicos.
*/

duracao:Number(
servico.duracao || 0
),

preco:Number(
servico.preco || 0
)

};

}
);


const select =
document.getElementById(
'servico'
);

const valorAtual =
select.value;

select.innerHTML =
'<option value="">' +
'Selecione o serviço' +
'</option>';


servicos.forEach(
function(servico) {

const option =
document.createElement(
'option'
);

option.value =
servico.id;

let texto =
servico.nome;

if (servico.duracao > 0) {

texto +=
' - ' +
servico.duracao +
' min';

}

if (servico.preco > 0) {

texto +=
' - R$ ' +
servico.preco
.toFixed(2)
.replace('.',',');

}

option.textContent =
texto;

select.appendChild(
option
);

}
);


if (valorAtual) {
select.value =
valorAtual;
}


} catch (erro) {

console.error(
'Erro serviços:',
erro
);

mostrarMensagem(
'mensagemModal',
'Erro ao carregar serviços: ' +
erro.message,
'erro'
);

} finally {

carregandoServicos = false;

}

}


/* =========================================================
DATA/SERVIÇO ALTERADOS
========================================================= */

function atualizarHorarios() {

horarioSelecionado = '';

const data =
document.getElementById(
'data'
).value;

const servicoId =
document.getElementById(
'servico'
).value;

const area =
document.getElementById(
'areaHorarios'
);

document.getElementById(
'resumo'
).style.display =
'none';


if (!data) {

area.innerHTML =
'<div class="carregando">' +
'Selecione uma data.' +
'</div>';

return;

}


if (!servicoId) {

area.innerHTML =
'<div class="carregando">' +
'Agora selecione o serviço para calcular os horários.' +
'</div>';

return;

}


const servico =
servicos.find(
function(item) {

return String(item.id) ===
String(servicoId);

}
);


if (
!servico ||
servico.duracao <= 0
) {

area.innerHTML =
'<div class="sem-horarios">' +
'A duração deste serviço é inválida.' +
'</div>';

return;

}


area.innerHTML =
'<div class="carregando">' +
'Calculando horários usando ' +
servico.duracao +
' minutos...' +
'</div>';


/*
Agora NÃO usamos mais a ação
"horarios" do Code.gs.

Buscamos os agendamentos reais
do dia e calculamos localmente.
*/

carregarAgendamentosParaHorarios(
data,
servico
);

}


/* =========================================================
BUSCAR AGENDAMENTOS PARA CALCULAR HORÁRIOS
========================================================= */

async function carregarAgendamentosParaHorarios(
data,
servico
) {

try {

const resposta =
await fetch(
API_URL +
'?acao=agendamentos' +
'&data=' +
encodeURIComponent(data) +
'&_=' +
Date.now(),
{
cache:'no-store'
}
);

const dados =
await resposta.json();


if (!Array.isArray(dados)) {

throw new Error(
'Resposta inválida dos agendamentos.'
);

}


agendamentosDoDia =
dados;


/*
Aqui está o cálculo principal.

A duração usada é a duração
DO SERVIÇO SELECIONADO.
*/

renderizarHorariosPorDuracao(
servico.duracao,
dados
);


} catch (erro) {

console.error(
'Erro ao consultar agendamentos:',
erro
);

document.getElementById(
'areaHorarios'
).innerHTML =
'<div class="sem-horarios">' +
'Não foi possível calcular os horários.<br><br>' +
'<small>' +
escapeHtml(erro.message) +
'</small>' +
'</div>';

}

}


/* =========================================================
GERAR HORÁRIOS
========================================================= */

function renderizarHorariosPorDuracao(
  duracaoServico,
  agendamentos
) {

  const area =
    document.getElementById('areaHorarios');

  const duracao =
    Number(duracaoServico);


  if (!duracao || duracao <= 0) {

    area.innerHTML =
      '<div class="sem-horarios">' +
      'Duração do serviço inválida.' +
      '</div>';

    return;
  }


  /*
   * ========================================================
   * HORÁRIO DE FUNCIONAMENTO
   * ========================================================
   */

  const inicioExpediente = 8 * 60;
  const fimExpediente = 18 * 60;


  /*
   * ========================================================
   * IMPORTANTE
   *
   * NÃO usar 30 minutos.
   *
   * O intervalo entre os horários é exatamente
   * a duração do serviço selecionado.
   *
   * Exemplo:
   *
   * duração = 40
   *
   * 08:00
   * 08:40
   * 09:20
   * 10:00
   * 10:40
   *
   * ========================================================
   */

  const intervalo = duracao;


  const horarios = [];


  /*
   * Gera os horários usando a duração do serviço.
   */

  for (
    let inicio = inicioExpediente;

    inicio + duracao <= fimExpediente;

    inicio += intervalo
  ) {

    const fim =
      inicio + duracao;


    const disponivel =
      verificarDisponibilidade(
        inicio,
        fim,
        agendamentos
      );


    horarios.push({

      hora:
        minutosParaHora(inicio),

      disponivel:
        disponivel

    });

  }


  /*
   * ========================================================
   * VERIFICA SE EXISTE ALGUM HORÁRIO
   * ========================================================
   */

  if (horarios.length === 0) {

    area.innerHTML =
      '<div class="sem-horarios">' +
      'Não há horários disponíveis para este serviço nesta data.' +
      '</div>';

    return;
  }


  area.innerHTML = '';


  /*
   * ========================================================
   * DESENHA OS BOTÕES
   * ========================================================
   */

  horarios.forEach(
    function(item) {

      const botao =
        document.createElement('button');


      botao.type = 'button';


      botao.textContent =
        item.hora;


      botao.className =
        'horario';


      if (item.disponivel) {

        botao.onclick =
          function() {

            selecionarHorario(
              item.hora,
              botao
            );

          };

      } else {

        botao.classList.add(
          'ocupado'
        );

        botao.disabled = true;

        botao.title =
          'Este horário conflita com outro agendamento.';

      }


      area.appendChild(
        botao
      );

    }
  );

}



/* =========================================================
VERIFICAR DISPONIBILIDADE
========================================================= */

function verificarDisponibilidade(
inicioNovo,
fimNovo,
agendamentos
) {

return !agendamentos.some(
function(agendamento) {

const inicioExistente =
horaParaMinutos(
agendamento.hora
);


/*
IMPORTANTE:

Usa a duração do agendamento
que já está na planilha.

Não usa 30 minutos.
*/

const duracaoExistente =
Number(
agendamento.duracao || 0
);


const fimExistente =
inicioExistente +
duracaoExistente;


/*
DOIS INTERVALOS CONFLITAM
quando:

início novo < fim existente

E

fim novo > início existente
*/

return (
inicioNovo < fimExistente &&
fimNovo > inicioExistente
);

}
);

}


/* =========================================================
SELECIONAR HORÁRIO
========================================================= */

function selecionarHorario(
hora,
botao
) {

document
.querySelectorAll(
'#areaHorarios .horario'
)
.forEach(
function(item) {

item.classList.remove(
'selecionado'
);

}
);

botao.classList.add(
'selecionado'
);

horarioSelecionado =
hora;

atualizarResumo();

}


/* =========================================================
RESUMO
========================================================= */

function atualizarResumo() {

const data =
document.getElementById(
'data'
).value;

const servicoId =
document.getElementById(
'servico'
).value;

const resumo =
document.getElementById(
'resumo'
);


if (
!data ||
!servicoId ||
!horarioSelecionado
) {

resumo.style.display =
'none';

return;

}


const servico =
servicos.find(
function(item) {

return String(item.id) ===
String(servicoId);

}
);


if (!servico) {
return;
}


const inicio =
horaParaMinutos(
horarioSelecionado
);

const fim =
inicio +
Number(servico.duracao);


resumo.innerHTML =

'<strong>Resumo:</strong><br>' +

'Data: ' +
formatarDataBR(data) +

'<br>' +

'Horário: ' +
horarioSelecionado +

'<br>' +

'Previsão de término: ' +
minutosParaHora(fim) +

'<br>' +

'Serviço: ' +
escapeHtml(servico.nome) +

'<br>' +

'Duração: ' +
servico.duracao +
' minutos';


resumo.style.display =
'block';

}


/* =========================================================
SALVAR AGENDAMENTO
========================================================= */

async function salvarAgendamento() {

const cliente =
document.getElementById(
'cliente'
).value.trim();

const whatsapp =
document.getElementById(
'whatsapp'
).value.trim();

const data =
document.getElementById(
'data'
).value;

const servicoId =
document.getElementById(
'servico'
).value;

const observacao =
document.getElementById(
'observacao'
).value.trim();


if (!cliente) {

mostrarMensagem(
'mensagemModal',
'Informe o nome da cliente.',
'erro'
);

return;

}


if (!whatsapp) {

mostrarMensagem(
'mensagemModal',
'Informe o WhatsApp da cliente.',
'erro'
);

return;

}


if (!data) {

mostrarMensagem(
'mensagemModal',
'Informe a data.',
'erro'
);

return;

}


if (!servicoId) {

mostrarMensagem(
'mensagemModal',
'Selecione o serviço.',
'erro'
);

return;

}


if (!horarioSelecionado) {

mostrarMensagem(
'mensagemModal',
'Selecione um horário.',
'erro'
);

return;

}


const servico =
servicos.find(
function(item) {

return String(item.id) ===
String(servicoId);

}
);


if (
!servico ||
!servico.duracao
) {

mostrarMensagem(
'mensagemModal',
'Não foi possível identificar a duração do serviço.',
'erro'
);

return;

}


const btn =
document.getElementById(
'btnSalvar'
);

btn.disabled = true;

btn.textContent =
'Agendando...';


try {


/*
Antes de salvar, verifica novamente
os agendamentos do dia.

Isso evita salvar um horário que
acabou de ficar ocupado.
*/

const respostaAgenda =
await fetch(
API_URL +
'?acao=agendamentos' +
'&data=' +
encodeURIComponent(data) +
'&_=' +
Date.now(),
{
cache:'no-store'
}
);


const agendaAtual =
await respostaAgenda.json();


if (!Array.isArray(agendaAtual)) {

throw new Error(
'Não foi possível verificar a agenda.'
);

}


const inicioNovo =
horaParaMinutos(
horarioSelecionado
);

const fimNovo =
inicioNovo +
Number(servico.duracao);


const conflito =
!verificarDisponibilidade(
inicioNovo,
fimNovo,
agendaAtual
);


if (conflito) {

throw new Error(
'Este horário acabou de ser ocupado. Escolha outro horário.'
);

}


/*
Envia a duração REAL do serviço.
*/

const dados = {

acao:'agendar',

cliente:cliente,

whatsapp:whatsapp,

data:data,

hora:horarioSelecionado,

servico:servico.nome,

/*
AQUI está a duração real.
*/

duracao:Number(
servico.duracao
),

observacao:observacao

};


const resposta =
await fetch(
API_URL,
{

method:'POST',

headers:{
'Content-Type':
'text/plain;charset=utf-8'
},

body:
JSON.stringify(dados)

}
);


const resultado =
await resposta.json();


if (!resultado.sucesso) {

throw new Error(
resultado.erro ||
'Não foi possível realizar o agendamento.'
);

}


mostrarMensagem(
'mensagemPrincipal',
'Agendamento realizado com sucesso!',
'sucesso'
);


fecharModal();


document.getElementById(
'dataAgenda'
).value = data;


carregarAgenda();


} catch (erro) {

console.error(erro);

mostrarMensagem(
'mensagemModal',
erro.message,
'erro'
);

} finally {

btn.disabled = false;

btn.textContent =
'Agendar Cliente';

}

}


/* =========================================================
CARREGAR AGENDA
========================================================= */

async function carregarAgenda() {

const data =
document.getElementById(
'dataAgenda'
).value;

const area =
document.getElementById(
'listaAgendamentos'
);


if (!data) {

area.innerHTML =
'<div class="carregando">' +
'Selecione uma data.' +
'</div>';

return;

}


area.innerHTML =
'<div class="carregando">' +
'Carregando agendamentos...' +
'</div>';


try {

const resposta =
await fetch(
API_URL +
'?acao=agendamentos' +
'&data=' +
encodeURIComponent(data) +
'&_=' +
Date.now(),
{
cache:'no-store'
}
);


const dados =
await resposta.json();


if (!Array.isArray(dados)) {

throw new Error(
'Resposta inválida.'
);

}


renderizarAgenda(dados);


} catch (erro) {

area.innerHTML =
'<div class="sem-horarios">' +
'Erro ao carregar a agenda.<br>' +
escapeHtml(erro.message) +
'</div>';

}

}


/* =========================================================
RENDERIZAR AGENDA
========================================================= */

function renderizarAgenda(
agendamentos
) {

const area =
document.getElementById(
'listaAgendamentos'
);


if (
!agendamentos ||
agendamentos.length === 0
) {

area.innerHTML =
'<h3>Agendamentos do dia</h3>' +
'<div class="carregando">' +
'Nenhum agendamento para esta data.' +
'</div>';

return;

}


agendamentos.sort(
function(a,b) {

return horaParaMinutos(a.hora) -
horaParaMinutos(b.hora);

}
);


let html =
'<h3>Agendamentos do dia</h3>';


agendamentos.forEach(
function(item) {

html +=

'<div class="agendamento">' +

'<div class="agendamento-topo">' +

'<div>' +

'<strong>' +

escapeHtml(item.hora) +

' - ' +

escapeHtml(item.cliente) +

'</strong>' +

'</div>' +

'<button ' +

'class="btn-cancelar" ' +

'onclick="cancelarAgendamento(\'' +

escapeHtmlJS(item.id) +

'\')">' +

'Cancelar' +

'</button>' +

'</div>' +

'<div class="info">' +

'<strong>Serviço:</strong> ' +

escapeHtml(item.servico) +

' (' +

Number(item.duracao || 0) +

' min)' +

'</div>' +

'<div class="info">' +

'<strong>WhatsApp:</strong> ' +

escapeHtml(item.whatsapp) +

'</div>' +

(
item.observacao
?
'<div class="info">' +
'<strong>Observação:</strong> ' +
escapeHtml(item.observacao) +
'</div>'
:
''
) +

'</div>';

}
);


area.innerHTML =
html;

}


/* =========================================================
CANCELAR
========================================================= */

async function cancelarAgendamento(id) {

if (
!confirm(
'Deseja realmente cancelar este agendamento?'
)
) {
return;
}


try {

const resposta =
await fetch(
API_URL,
{

method:'POST',

headers:{
'Content-Type':
'text/plain;charset=utf-8'
},

body:
JSON.stringify({
acao:'cancelar',
id:id
})

}
);


const resultado =
await resposta.json();


if (!resultado.sucesso) {

throw new Error(
resultado.erro ||
'Erro ao cancelar.'
);

}


mostrarMensagem(
'mensagemPrincipal',
'Agendamento cancelado com sucesso.',
'sucesso'
);


carregarAgenda();


} catch (erro) {

mostrarMensagem(
'mensagemPrincipal',
erro.message,
'erro'
);

}

}


/* =========================================================
CONVERSÕES DE HORÁRIO
========================================================= */

function horaParaMinutos(hora) {

const partes =
String(
hora || '00:00'
).split(':');


return (
Number(partes[0] || 0) * 60 +
Number(partes[1] || 0)
);

}


function minutosParaHora(
minutos
) {

const horas =
Math.floor(
minutos / 60
);

const mins =
minutos % 60;


return (
String(horas).padStart(2,'0') +
':' +
String(mins).padStart(2,'0')
);

}


/* =========================================================
DATA BR
========================================================= */

function formatarDataBR(data) {

const partes =
String(data).split('-');

if (partes.length !== 3) {
return data;
}

return (
partes[2] +
'/' +
partes[1] +
'/' +
partes[0]
);

}


/* =========================================================
MENSAGENS
========================================================= */

function mostrarMensagem(
id,
texto,
tipo
) {

const elemento =
document.getElementById(id);

if (!elemento) {
return;
}

elemento.textContent =
texto;

elemento.className =
'mensagem ' + tipo;

setTimeout(
function() {
esconderMensagem(id);
},
5000
);

}


function esconderMensagem(id) {

const elemento =
document.getElementById(id);

if (!elemento) {
return;
}

elemento.className =
'mensagem';

elemento.textContent =
'';

}


/* =========================================================
SEGURANÇA
========================================================= */

function escapeHtml(texto) {

return String(texto || '')
.replace(/&/g,'&amp;')
.replace(/</g,'&lt;')
.replace(/>/g,'&gt;')
.replace(/"/g,'&quot;')
.replace(/'/g,'&#039;');

}


function escapeHtmlJS(texto) {

return String(texto || '')
.replace(/\\/g,'\\\\')
.replace(/'/g,"\\'")
.replace(/"/g,'\\"');

}


/* =========================================================
FECHAR CLICANDO FORA
========================================================= */

document
.getElementById('modal')
.addEventListener(
'click',
function(event) {

if (
event.target === this
) {

fecharModal();

}

}
);

</script>
